<title>AI-DLC story points</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  AI-DLC story points — the one template for reviewing an intent's story points without Jira.

  Published ONCE per developer as a private Artifact with the `db` and `user` capabilities
  (capabilities: {db: {}, user: {}}, icon "cards"); never regenerated per review. Every review is rows
  INSIDE this artifact, written by the agent with the ArtifactData tool (see SKILL.md next to
  this file). The page renders whatever the rows say, live. After a plugin update, republish this
  file to the same artifact URL.

  Data contract (what the agent writes):

    reviews/<id>                 {title, intent, file, scale: [1, 2, 3, 5, 8],
                                  status: "open"|"done", createdAt (ISO), picks: {}, savedAt?}
      id: [a-z0-9._-]+ — the intent's directory name, lowercased.
    reviews/<id>/units/<Unit>    {n: 3, unit: "U3", name: "api-billing", title, ctx?,
                                  points: 5 | null, source: "ai" | "human" | null,
                                  dependsOn?: ["U1" | {unit: "U1", title}],
                                  stories?: [{id: "US-3.1", title, text?}],
                                  requirements?: [{id: "FR-4", title, text?}]}
      points/source: the row that counts in unit-points.csv now; null/null without a row.
      title: one line a person understands without the ids. name: the Unit's slug.
      dependsOn: the Units it depends on. A Unit in this review links to its card; for one that is
        not, give its title in the object form, or the link can only show the id.
      stories, requirements (optional): what the Unit delivers. They are not cards on this page, so
        their links show the title and, in the tooltip, the id and text; a click says the source is
        not in this document.
      A string entry ("US-3.1") is accepted wherever an object is, and shows only the id.

    Markdown the page renders in ctx: blocks separated by a blank line; a block whose every line
    starts with "- " is a one-level list; inside both, `code` and **bold**. A Unit id (U3) or a
    story or requirement id named on any card becomes a link labelled with its title. title: `code`
    and **bold** only. Nothing else renders.

  What the page writes:

    reviews/<id>.picks[<Unit>] = {points: 5, at: ISO}   the developer pressed 5 on that Unit
                               = null                    they cleared it again
      Pressing the number the row already holds is a pick too: it confirms an AI suggestion
      as the developer's own estimate.
    reviews/<id>.status        = "done" when the developer presses Done; "open" again after
                                 a later pick.   reviews/<id>.savedAt = ISO of Done.
    data/users/<viewer>/reads-<id>  {marks: {<Unit>: <stamp>}}
      Read marks are the viewer's own (localStorage when the user capability is not served), set only
      with a card's read dot. The stamp is a hash of what the card shows, so a Unit whose row changes
      turns unread again. The agent never reads them.

  The agent reads back only reviews/<id> (one `get`).
  Link to a review: <artifact url>#<id>. No hash: the list of reviews.

  The render functions between RENDER-START and RENDER-END use no DOM, so tests render a review under Node.
-->

}

  --accent: #8FA2FF; --accent-strong: #B5C2FF; --accent-soft: #222B4D; --accent-tint: #1B2035; --on-accent: #111318;
  --ai: #F0C36B; --ai-soft: #3D3016; --ai-tint: #241E12;

* { box-sizing: border-box; }

/* header */
.head { display: flex; flex-direction: column; gap: 14px; padding: 20px 24px; }

.status i { width: 7px; height: 7px; border-radius: 4px; background: var(--warn-dot); }

.titlerow > div:first-child { flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }

.lc b { font-family: var(--mono); font-weight: 500; }

.meter i { display: block; height: 6px; background: var(--accent); }
.save { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 0 10px; border-radius: 13px; font-size: 12px; font-weight: 500; background: var(--low-bg); color: var(--low-fg); }
.save i { width: 7px; height: 7px; border-radius: 4px; background: currentColor; flex: none; }

.save.failed, .save.readonly { background: var(--crit-bg); color: var(--crit-fg); }
.save button { border: 0; background: transparent; padding: 0 0 0 4px; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; color: inherit; }
@keyframes pulse { 50% { opacity: .3; } }
.done { height: 32px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 600; }
.done:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.done:disabled { opacity: .5; cursor: default; }
.done.is-done { background: var(--ok-bg); color: var(--ok-fg); border-color: var(--ok-fg); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 7px; height: 32px; max-width: 240px; padding: 0 10px 0 4px; border-radius: 16px; border: 1px solid var(--control); background: var(--surface); color: var(--fg); text-decoration: none; font-size: 13px; white-space: nowrap; }
.chip:hover { border-color: var(--accent); color: var(--fg); }
.chip .cl { overflow: hidden; text-overflow: ellipsis; }
.chip.read .cl { color: var(--muted); }
.cv { flex: none; min-width: 24px; height: 24px; padding: 0 5px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 12px; font-weight: 500; }
.cv.human { background: var(--accent); color: var(--on-accent); }
.cv.ai { background: var(--ai-soft); color: var(--ai); box-shadow: inset 0 0 0 1px var(--ai); }
.cv.none { background: var(--low-bg); color: var(--low-fg); }

/* Unit cards */
main { display: flex; flex-direction: column; gap: 16px; }
.unit { scroll-margin-top: calc(var(--bar-h) + 16px); overflow: hidden; }
.unit.need { box-shadow: inset 3px 0 0 var(--ai); }
.unit:focus { outline: none; }
.uhead { display: flex; align-items: flex-start; gap: 10px 12px; padding: 14px 12px 0 16px; }
.uid { flex: none; margin-top: 2px; min-width: 36px; height: 24px; padding: 0 7px; display: inline-flex; align-items: center; justify-content: center; border-radius: 5px; background: var(--low-bg); color: var(--fg-2); font-family: var(--mono); font-size: 12px; }
h2 { flex: 1 1 auto; min-width: 0; margin: 0; padding-top: 2px; font-size: 16px; font-weight: 600; line-height: 1.4; text-wrap: balance; overflow-wrap: anywhere; }
.unit.read h2 { color: var(--fg-2); }
.state { flex: none; margin-top: 2px; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 5px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.state.human { background: var(--accent-soft); color: var(--accent); }
.state.ai { background: var(--ai-soft); color: var(--ai); }
.state.none { background: var(--low-bg); color: var(--low-fg); }
.dot { flex: none; width: 32px; height: 32px; margin-top: -2px; border: 0; border-radius: 6px; background: transparent; display: inline-flex; align-items: center; justify-content: center; }
.dot:hover { background: var(--hover); }
.dot i { width: 10px; height: 10px; border-radius: 5px; background: var(--accent); border: 2px solid var(--accent); }

.ref:hover { color: var(--accent-strong); text-decoration: underline; }

.pt:hover { border-color: var(--accent); transform: translateY(-2px); }

.band span { color: var(--band-muted); } .band b { font-weight: 500; } .band .end { margin-left: auto; font-family: var(--mono); font-size: 12px; }
.list h2 { padding: 16px 16px 4px; }
.lrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 10px 16px; border-top: 1px solid var(--line-soft); color: var(--fg); text-decoration: none; }

#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: calc(100vw - 32px); background: var(--tip-bg); color: var(--tip-fg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 20; }

  };
  var TIP = {
    ai: "AI suggestion: a number an assistant proposed from the Unit documents. It doesn’t count as the developers’ estimate until a developer presses it.",
    human: "Developer estimate: a number a developer gave. It is a human row in unit-points.csv and is what the Unit is planned with.",
    none: "No estimate: the Unit has no row in unit-points.csv yet."
  };

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function num(v) { return v === null || v === undefined || v === "" || !isFinite(Number(v)) ? null : Number(v); }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : (many || one + "s")); }
  function uidOf(u) { return String(u.unit || u.id || ""); }
  function anchorOf(id) { return "u-" + String(id).replace(/[^A-Za-z0-9._-]+/g, "-"); }
  function fmt(iso) { try { return iso ? new Date(iso).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : ""; } catch (e) { return iso || ""; } }
  function mark(kind) { return '<i class="mark ' + kind + '">' + ICON[kind] + "</i>"; }
  function reRx(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
  /* A short hash of what a card shows: a read mark holds it, so a Unit whose row changed turns unread. */
  function stamp(u) {
    var s = JSON.stringify([u.title, u.ctx, u.points, u.source, u.dependsOn, u.stories, u.requirements]), h = 5381;
    for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  }
  function items(list, key) {
    return (list || []).filter(Boolean).map(function (x) {
      return typeof x === "string" ? { id: x } : { id: String(x[key] || x.id || ""), title: x.title || "", text: x.text || "" };
    }).filter(function (x) { return x.id; });
  }

  /* ---------- state helpers ---------- */
  function scaleOf(review) { return (review.scale || [1, 2, 3, 5, 8]).map(Number).filter(function (n) { return isFinite(n); }); }
  function pickOf(st, u) { var p = st.picks[uidOf(u)]; return p && num(p.points) !== null ? num(p.points) : null; }
  function srcOf(u) { return num(u.points) === null ? null : (u.source === "human" ? "human" : "ai"); }
  function hasDev(st, u) { return pickOf(st, u) !== null || srcOf(u) === "human"; }
  function kindOf(st, u) { return hasDev(st, u) ? "human" : (srcOf(u) === "ai" ? "ai" : "none"); }
  function isRead(st, u) { return st.read[uidOf(u)] === stamp(u); }
  function passes(st, u) {
    if (st.filter === "need") return !hasDev(st, u);
    if (st.filter === "unread") return !isRead(st, u);
    return true;
  }
  function tally(st, units) {
    var t = { all: units.length, human: 0, ai: 0, none: 0, unread: 0 };
    units.forEach(function (u) { t[kindOf(st, u)]++; if (!isRead(st, u)) t.unread++; });
    t.need = t.ai + t.none;
    return t;
  }

  /* ---------- links: live inside the page, a toast otherwise ---------- */
  function link(label, tip, target, extra) {
    if (target) return '<a class="ref' + (extra || "") + '" href="#' + esc(target) + '" data-jump="' + esc(target) + '" data-tip="' + esc(tip) + '">' + esc(label) + "</a>";
    return '<a class="ref out' + (extra || "") + '" href="#" data-missing="1" data-tip="' + esc(tip + " Not in this document.") + '">' + esc(label) + "</a>";
  }
  function unitLink(byId, id, title) {
    var u = byId[id];
    if (u) return link(u.title || u.name || id, "Unit " + id + (u.name ? " · " + u.name : "") + ". Jump to its card.", anchorOf(id));
    return link(title || id, "Unit " + id + (title ? ": " + title : "") + ". It isn’t part of this review.", null);
  }
  function srcLink(kind, x) {
    return link(x.title || x.id, kind + " " + x.id + (x.title ? ": " + x.title : "") + (x.text ? " — " + x.text : "") + ".", null);
  }
  /* Ids a card's prose may name: every Unit in the review, and every story and requirement on any card. */
  function linker(units, byId) {
    var known = {};
    units.forEach(function (u) {
      items(u.stories).forEach(function (s) { known[s.id] = function () { return srcLink("Story", s); }; });
      items(u.requirements).forEach(function (r) { known[r.id] = function () { return srcLink("Requirement", r); }; });
    });
    Object.keys(byId).forEach(function (id) { known[id] = function () { return unitLink(byId, id); }; });
    var keys = Object.keys(known).sort(function (a, b) { return b.length - a.length; }).map(reRx);
    var rx = new RegExp("(?<![\\w-])(" + keys.concat(["U\\d+"]).join("|") + ")(?![\\w-])", "g");
    return function (html) { return html.replace(rx, function (m) { return known[m] ? known[m]() : unitLink(byId, m); }); };
  }
  function inline(s, L) {
    return String(s == null ? "" : s).split(/(`[^`]+`)/).map(function (part, i) {
      if (i % 2) return "<code>" + esc(part.slice(1, -1)) + "</code>";
      var out = esc(part).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      return L ? L(out) : out;
    }).join("");
  }
  function md(s, L) {
    return String(s == null ? "" : s).trim().split(/\n\s*\n/).filter(Boolean).map(function (b) {
      var lines = b.split("\n");
      if (lines.every(function (l) { return /^\s*-\s+/.test(l); })) return "<ul>" + lines.map(function (l) { return "<li>" + inline(l.replace(/^\s*-\s+/, ""), L) + "</li>"; }).join("") + "</ul>";
      return "<p>" + lines.map(function (l) { return inline(l, L); }).join("<br>") + "</p>";
    }).join("");
  }

  /* ---------- one Unit ---------- */
  function stateTag(st, u, cur, src, pick) {
    if (pick !== null) return '<span class="state human" tabindex="0" data-tip="You picked ' + pick + ". It is saved in this review and becomes a developer estimate in unit-points.csv once you tell Claude the form is done." + '">' + mark("human") + "Your pick " + pick + "</span>";
    if (src === "human") return '<span class="state human" tabindex="0" data-tip="' + esc(TIP.human) + '">' + mark("human") + "Developer estimate " + cur + "</span>";
    if (src === "ai") return '<span class="state ai" tabindex="0" data-tip="' + esc(TIP.ai + " Press " + cur + " to keep it.") + '">' + mark("ai") + "AI suggests " + cur + "</span>";
    return '<span class="state none" tabindex="0" data-tip="' + esc(TIP.none) + '">No estimate</span>';
  }
  function unitHtml(st, review, u, byId, L) {
    var id = uidOf(u), cur = num(u.points), src = srcOf(u), pick = pickOf(st, u), scale = scaleOf(review), top = Math.max.apply(null, scale);
    var values = scale.slice(), off = cur !== null && values.indexOf(cur) < 0;
    if (off) values.push(cur);
    values.sort(function (a, b) { return a - b; });
    var label = u.title || u.name || id, read = isRead(st, u), ro = st.readOnly ? " disabled" : "";
    var hand = values.map(function (v) {
      var isCur = v === cur, isPick = v === pick;
      var cls = ["pt", isCur ? (src === "human" ? "is-human" : "is-ai") : "", isPick ? "picked" : "", isCur && off ? "off" : ""].filter(Boolean).join(" ");
      var what = isPick ? "your pick; press again to clear it" : isCur ? (src === "ai" ? "the AI suggestion; press to keep it as your estimate" : "the developer estimate in the file") : "press to pick it";
      var tip = plural(v, "point") + ": " + what + "." + (isCur && off ? " It is off the project’s scale." : "") + (v > top ? " Above the top of the scale, the Unit is split instead." : "");
      return '<button type="button" id="pt-' + esc(id) + "-" + v + '" class="' + cls + '" data-act="pick" data-unit="' + esc(id) + '" data-v="' + v + '" aria-pressed="' + isPick + '" aria-label="' + esc(plural(v, "point") + (isCur ? (src === "ai" ? ", AI suggestion" : ", developer estimate") : "") + (isPick ? ", your pick" : "")) + '" data-tip="' + esc(tip) + '"' + ro + ">" + v + (isPick ? mark("human") : isCur ? mark(src) : "") + "</button>";
    }).join("");
    var foot;
    if (pick !== null) {
      var was = cur === null ? "there was no estimate before" : pick === cur ? (src === "ai" ? "it confirms the AI suggestion" : "the same as the estimate in the file") : "it was " + cur + ", " + (src === "ai" ? "an AI suggestion" : "a developer estimate");
      foot = "<span>Your estimate is <b>" + pick + "</b>; " + was + '.</span><button type="button" class="clear" id="clr-' + esc(id) + '" data-act="clear" data-unit="' + esc(id) + '"' + ro + ">Clear</button>";
    } else if (cur === null) foot = "<span>No estimate yet. Pick a number.</span>";
    else if (off) foot = "<span>" + (src === "ai" ? "The AI suggests" : "The developer estimate is") + " <b>" + cur + "</b>, off the scale. Pick a number from the scale" + (cur > top ? ", or split the Unit" : "") + ".</span>";
    else if (src === "ai") foot = "<span>The AI suggests <b>" + cur + "</b>. Press " + cur + " to keep it as your estimate, or pick another number.</span>";
    else foot = "<span>A developer estimated <b>" + cur + "</b>. Pick another number to change it.</span>";
    if (pick !== null && pick > top) foot += '<span class="warnline">Above the top of the scale: split the Unit instead.</span>';

    var save = st.unitSave[id], ustat = "";
    if (save === "saving") ustat = '<span class="ustat">Saving…</span>';
    else if (save === "saved") ustat = '<span class="ustat saved">Saved</span>';
    else if (save === "failed") ustat = '<span class="ustat failed">Not saved. <button type="button" id="rt-' + esc(id) + '" data-act="retry">Retry</button></span>';

    var deps = items(u.dependsOn, "unit"), stories = items(u.stories), reqs = items(u.requirements);
    var refs = (deps.length ? '<div class="refs"><span>Depends on</span>' + deps.map(function (d) { return unitLink(byId, d.id, d.title); }).join("") + "</div>" : "") +
      (stories.length ? '<div class="refs"><span>Stories</span>' + stories.map(function (s) { return srcLink("Story", s); }).join("") + "</div>" : "") +
      (reqs.length ? '<div class="refs"><span>Requirements</span>' + reqs.map(function (r) { return srcLink("Requirement", r); }).join("") + "</div>" : "");
    var kind = kindOf(st, u);
    return '<section class="card unit' + (read ? " read" : "") + (kind !== "human" ? " need" : "") + '" id="' + esc(anchorOf(id)) + '" data-unit="' + esc(id) + '" tabindex="-1" aria-labelledby="h-' + esc(id) + '">' +
      '<div class="uhead"><span class="uid" tabindex="0" data-tip="' + esc("Unit " + id + (u.name ? " · " + u.name : "") + ". The id the AI-DLC documents and unit-points.csv use for this Unit.") + '">' + esc(id) + "</span>" +
      '<h2 id="h-' + esc(id) + '">' + inline(label) + "</h2>" + stateTag(st, u, cur, src, pick) +
      '<button type="button" class="dot" id="rd-' + esc(id) + '" data-act="read" data-unit="' + esc(id) + '" aria-pressed="' + read + '" aria-label="' + esc("Read: " + label) + '" data-tip="' + (read ? "Read. Press to mark it unread." : "Unread. Press when you have read this Unit; only you see the mark.") + '"><i></i></button></div>' +
      '<div class="ubody">' + (u.ctx ? '<div class="ctx">' + md(u.ctx, L) + "</div>" : "") + refs +
      '<div class="handrow"><div class="hand" role="group" aria-label="' + esc("Story points for " + label) + '">' + hand + "</div>" + ustat + "</div>" +
      '<div class="ufoot">' + foot + "</div></div></section>";
  }

  /* ---------- the page ---------- */
  function headerHtml(st, review, units, t) {
    var done = review.status === "done", scale = scaleOf(review);
    var crumbs = '<div class="crumbs"><a href="#" data-nav="">All reviews</a><span aria-hidden="true">/</span><span>' + esc(review.intent || "") + "</span>" +
      '<span class="status' + (done ? " done" : "") + '"><i aria-hidden="true"></i>' + (done ? "Done " + esc(fmt(review.savedAt)) : "Open") + "</span></div>";
    var facts = [["Units", t.all, "Every Unit of the intent, in the order of its dependency file."],
      ["Developer estimates", t.human, "Units with a number a developer gave: your picks here, or a human row already in the file."],
      ["AI suggestion only", t.ai, "Units whose only number came from an assistant. Press it to keep it, or pick another."],
      ["No estimate", t.none, "Units with no row in unit-points.csv yet."]].map(function (f) {
      return '<div class="fact" tabindex="0" data-tip="' + esc(f[2]) + '"><span>' + f[0] + '</span><b>' + f[1] + "</b></div>";
    }).join("");
    var legend = '<div class="legend"><span class="term" tabindex="0" data-tip="' + esc(TIP.ai) + '">' + mark("ai") + "AI suggestion</span>" +
      '<span class="term" tabindex="0" data-tip="' + esc(TIP.human) + '">' + mark("human") + "Developer estimate</span>" +
      '<span class="term" tabindex="0" data-tip="' + esc("Story points measure a Unit’s size relative to the others. This project’s scale is " + scale.join(", ") + "; a Unit bigger than " + Math.max.apply(null, scale) + " is split rather than estimated.") + '">Scale <span class="scale">' + scale.map(function (v) { return "<b>" + v + "</b>"; }).join("") + "</span></span>" +
      (review.file ? '<span class="file" tabindex="0" data-tip="The file Claude writes your picks into, as human rows, after you send: form is done.">' + esc(review.file) + "</span>" : "") + "</div>";
    return '<header class="card head">' + crumbs + '<div class="titlerow"><div><h1>' + esc(review.title || review.intent || "Story points") + '</h1><p class="lede">Press a number to give a Unit your estimate. To keep an AI suggestion, press its number: it becomes yours. Picks save as you go; press Done when you are finished.</p></div><div class="facts">' + facts + "</div></div>" + legend + "</header>";
  }

  function saveHtml(st) {
    var s = st.save || {};
    if (st.readOnly) return '<span class="save readonly" role="status" tabindex="0" data-tip="Your access lets you read this review but not save picks. Ask the owner for Contributor access."><i aria-hidden="true"></i>Read only</span>';
    if (s.state === "saving") return '<span class="save saving" role="status"><i aria-hidden="true"></i>Saving…</span>';
    if (s.state === "failed") return '<span class="save failed" role="status"><i aria-hidden="true"></i>Not saved<button type="button" id="retry" data-act="retry">Retry</button></span>';
    if (s.state === "saved") return '<span class="save saved" role="status"><i aria-hidden="true"></i>Saved ' + esc(s.at ? fmt(s.at).replace(/^.*?, (?=\d)/, "") : "") + "</span>";
    return '<span class="save" role="status"><i aria-hidden="true"></i>Picks save as you go</span>';
  }

  function barHtml(st, review, units, t) {
    var pct = t.all ? Math.round(t.human / t.all * 100) : 0, done = review.status === "done";
    var filters = [["all", "All", t.all, "Every Unit."], ["need", "Needs your estimate", t.need, "Units without a developer estimate: an AI suggestion only, or nothing."], ["unread", "Unread", t.unread, "Units you haven’t marked read, or whose row changed since."]];
    var chips = units.map(function (u) {
      var id = uidOf(u), k = kindOf(st, u), p = pickOf(st, u), v = p !== null ? p : num(u.points);
      var tip = "Unit " + id + ": " + (u.title || u.name || id) + ". " + (k === "human" ? "Developer estimate " + v + "." : k === "ai" ? "AI suggests " + v + "; no developer estimate yet." : "No estimate yet.");
      return '<a class="chip' + (isRead(st, u) ? " read" : "") + '" href="#' + esc(anchorOf(id)) + '" data-jump="' + esc(anchorOf(id)) + '" data-tip="' + esc(tip) + '"><span class="cv ' + k + '" aria-hidden="true">' + (v === null ? "–" : v) + '</span><span class="cl">' + esc(u.title || u.name || id) + "</span></a>";
    }).join("");
    return '<div class="bar" id="bar"><div class="barrow">' +
      '<div class="filters" role="group" aria-label="Show">' + filters.map(function (f) { return '<button type="button" class="pill" id="f-' + f[0] + '" data-act="filter" data-val="' + f[0] + '" aria-pressed="' + (st.filter === f[0]) + '" data-tip="' + esc(f[3]) + '">' + f[1] + '<span class="n">' + f[2] + "</span></button>"; }).join("") + "</div>" +
      '<div class="counts wide">' +
        '<span class="lc human" tabindex="0" data-tip="' + esc(TIP.human) + '">Developer<b>' + t.human + "</b></span>" +
        '<span class="lc ai" tabindex="0" data-tip="' + esc(TIP.ai) + '">AI only<b>' + t.ai + "</b></span>" +
        '<span class="lc none" tabindex="0" data-tip="' + esc(TIP.none) + '">None<b>' + t.none + "</b></span></div>" +
      '<div class="tools"><span class="progress" tabindex="0" data-tip="Units with a developer estimate, out of every Unit in this review."><span class="num">' + t.human + "/" + t.all + ' estimated</span><span class="meter" aria-hidden="true"><i style="width:' + pct + '%"></i></span></span>' +
      saveHtml(st) +
      '<button type="button" class="done' + (done ? " is-done" : "") + '" id="done" data-act="done"' + (st.readOnly || st.finishing ? " disabled" : "") + ' data-tip="' + esc(done ? "Marked done. A later pick reopens the review; press Done again after it." : "Press when you are finished, then tell Claude in chat: form is done.") + '">' + (done ? "Done ✓" : "Done") + "</button></div></div>" +
      '<nav class="chips" aria-label="Units">' + chips + "</nav></div>";
  }

  /* The whole page for one review. st: {filter, picks, unitSave, save, read, readOnly, finishing}. */
  function render(review, units, st) {
    st = Object.assign({ filter: "all", picks: {}, unitSave: {}, save: {}, read: {}, readOnly: false }, st || {});
    units = units.slice().sort(function (a, b) { return (a.n || 0) - (b.n || 0); });
    var byId = {};
    units.forEach(function (u) { byId[uidOf(u)] = u; });
    var t = tally(st, units), L = linker(units, byId);
    var shown = units.filter(function (u) { return passes(st, u); });
    var body = !units.length ? '<div class="card msg"><b>No Units in this review yet.</b><p>Claude adds them as rows; they appear here as soon as they are written.</p></div>'
      : !shown.length ? '<div class="card msg"><b>' + (st.filter === "need" ? "Every Unit has a developer estimate." : "Nothing unread.") + '</b><p><a href="#" data-act="filter" data-val="all">Show all Units</a></p></div>'
      : shown.map(function (u) { return unitHtml(st, review, u, byId, L); }).join("");
    var done = review.status === "done";
    var band = '<footer class="band"><b>' + (done ? "Marked done. Tell Claude in chat: form is done." : "When you are finished, press Done, then tell Claude in chat: form is done.") + "</b><span>Claude writes each pick into unit-points.csv as a developer estimate. Units you leave alone keep their row.</span>" +
      '<span class="end num">' + t.human + "/" + t.all + " estimated</span></footer>";

    if (!rows.length) return head + '<div class="card msg"><b>No reviews yet.</b><p>Run <code>/story-points:review</code> in Claude Code. Claude puts the intent’s Units here and sends you the link.</p></div>';

      var n = Object.keys(r.picks || {}).filter(function (k) { return r.picks[k]; }).length, done = r.status === "done";
      return '<a class="lrow" href="#' + esc(r.id) + '"><b>' + esc(r.title || r.id) + "</b><small>" + esc(r.intent || "") + " · " + esc(fmt(r.createdAt)) + (n ? " · " + plural(n, "pick") : "") + '</small><span class="end lc ' + (done ? "human" : "ai") + '">' + (done ? "done" : "open") + "</span></a>";
    }).join("") + "</section>";
  }

  return { render: render, listHtml: listHtml, anchorOf: anchorOf, stamp: stamp, uidOf: uidOf, pickOf: pickOf, passes: passes, esc: esc };
})();
if (typeof module !== "undefined") module.exports = PointsView;

</script>
<script>
(function () {
  "use strict";
  var app = document.getElementById("app"), toastEl = document.getElementById("toast"), tipEl = document.getElementById("tip");
  var db = null, uid = null;
  var view = { id: "", review: null, units: [], loaded: false, unsub: [], st: fresh(), pending: {}, inflight: null };

  function fresh() { return { filter: "all", picks: {}, unitSave: {}, save: {}, read: {}, readOnly: false, finishing: false }; }
  function toast(text) { toastEl.textContent = text; toastEl.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { toastEl.hidden = true; }, 3200); }
  function reviewId() { var h = decodeURIComponent(location.hash.replace(/^#/, "")); return /^[a-z0-9._-]+$/i.test(h) && !/^u-/.test(h) ? h : ""; }
  function barHeight() { var b = document.getElementById("bar"); if (b) document.documentElement.style.setProperty("--bar-h", b.offsetHeight + "px"); }
  function teardown() {
    view.unsub.forEach(function (u) { try { u(); } catch (e) { /* already gone */ } });
    view.unsub = []; view.review = null; view.units = []; view.loaded = false; view.pending = {}; view.inflight = null; view.st = fresh();
    hideTip();
  }

  function paint() {

    var y = window.scrollY, focusId = document.activeElement && document.activeElement.id;
    hideTip();
    app.innerHTML = PointsView.render(view.review, view.units, view.st);
    barHeight();
    window.scrollTo(0, y);
    if (focusId) { var f = document.getElementById(focusId); if (f) f.focus({ preventScroll: true }); }
  }

  /* ---------- tooltips: one element, on hover and on keyboard focus ---------- */
  var tipFor = null;
  function showTip(el) {
    var text = el.getAttribute("data-tip");
    if (!text) return;
    tipFor = el; tipEl.textContent = text; tipEl.hidden = false; el.setAttribute("aria-describedby", "tip");
    var r = el.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;

    var left = Math.min(Math.max(8, r.left), window.innerWidth - w - 8);
    tipEl.style.top = top + "px"; tipEl.style.left = left + "px";
  }
  function hideTip() { if (tipFor) tipFor.removeAttribute("aria-describedby"); tipFor = null; tipEl.hidden = true; }
  /* hover waits a moment, so passing over the hand doesn't flash a tip per card; the tip itself can be hovered */
  var tipTimer = 0;
  document.addEventListener("mouseover", function (e) {

    var t = e.target.closest && e.target.closest("[data-tip]");
    clearTimeout(tipTimer);

  });
  document.addEventListener("focusin", function (e) { var t = e.target.closest && e.target.closest("[data-tip]"); if (t) showTip(t); else hideTip(); });
  document.addEventListener("focusout", function () { hideTip(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") hideTip(); });
  window.addEventListener("scroll", hideTip, { passive: true });

  /* ---------- read marks: the viewer's own ---------- */
  function localKey() { return "story-points:reads:" + view.id; }
  function loadLocalReads() { try { return JSON.parse(localStorage.getItem(localKey()) || "{}") || {}; } catch (e) { return {}; } }
  function readsDoc() { return db.collection("data/users/" + uid).doc("reads-" + view.id); }
  function saveReads() {
    var marks = Object.assign({}, view.st.read);
    try { localStorage.setItem(localKey(), JSON.stringify(marks)); } catch (e) { /* storage refused: the db copy still holds */ }
    try { if (db && uid) readsDoc().set({ marks: marks }).catch(function () { /* kept locally */ }); } catch (e) { /* kept locally */ }
  }
  function unitById(id) { return view.units.filter(function (u) { return PointsView.uidOf(u) === id; })[0]; }

  /* ---------- picks: saved as they are made ---------- */
  function choose(unit, v) {
    var st = view.st;
    if (st.readOnly) return;
    var u = unitById(unit); if (!u) return;
    var next = v === null || PointsView.pickOf(st, u) === v ? null : { points: v, at: new Date().toISOString() };
    st.picks[unit] = next; view.pending[unit] = next; st.unitSave[unit] = "saving"; st.save = { state: "saving" };
    paint(); flush();
  }
  function retry() {
    var st = view.st;
    Object.keys(st.unitSave).forEach(function (k) { if (st.unitSave[k] === "failed") { if (!(k in view.pending)) view.pending[k] = st.picks[k] || null; st.unitSave[k] = "saving"; } });
    st.save = { state: "saving" }; paint(); flush();
  }
  async function flush() {
    if (view.inflight || !db || !view.id || !Object.keys(view.pending).length) return;
    var id = view.id, st = view.st, batch = view.pending; view.pending = {}; view.inflight = batch;
    var ok = true;
    try {
      var patch = { picks: Object.assign({}, st.picks) };
      if (view.review && view.review.status === "done") patch.status = "open";
      await db.doc("reviews/" + id).update(patch);
      if (view.id !== id) return;
      /* the whole picks map went, so a pick that failed earlier is saved now too */
      Object.keys(batch).concat(Object.keys(st.unitSave).filter(function (k) { return st.unitSave[k] === "failed"; })).forEach(function (k) { if (!(k in view.pending)) st.unitSave[k] = "saved"; });
      st.save = Object.keys(view.pending).length ? { state: "saving" } : { state: "saved", at: new Date().toISOString() };
    } catch (e) {
      ok = false;
      if (view.id !== id) return;
      Object.keys(batch).forEach(function (k) { if (!(k in view.pending)) view.pending[k] = batch[k]; });
      if (e && e.code === "invalid_argument") {
        st.readOnly = true; view.pending = {}; st.unitSave = {};
        toast("You can read this review but not save picks to it. Ask the owner for Contributor access.");
      } else {
        Object.keys(batch).forEach(function (k) { st.unitSave[k] = "failed"; });
        st.save = { state: "failed" };
        view.pending = {};  /* the failed picks wait for Retry or the next pick */
        toast("Couldn’t save your pick. Check your connection, then press Retry.");
      }
    } finally {
      if (view.id === id) { view.inflight = null; paint(); if (ok && Object.keys(view.pending).length) flush(); }
    }
  }
  async function finish() {
    var st = view.st;
    if (!db || !view.id || st.readOnly || st.finishing) return;
    if (Object.keys(st.unitSave).some(function (k) { return st.unitSave[k] === "failed"; })) { toast("Some picks aren’t saved yet. Press Retry first."); return; }
    st.finishing = true; paint();
    try {
      for (var i = 0; i < 100 && (view.inflight || Object.keys(view.pending).length); i++) {
        if (!view.inflight) await flush(); else await new Promise(function (r) { setTimeout(r, 100); });
      }
      if (view.inflight || Object.keys(view.pending).length || st.save.state === "failed") throw new Error("unsaved");
      await db.doc("reviews/" + view.id).update({ status: "done", savedAt: new Date().toISOString() });
      toast("Marked done. Now tell Claude in chat: form is done.");
    } catch (e) { toast("Couldn’t mark the review as done. Try again."); }
    finally { st.finishing = false; paint(); }
  }

  /* ---------- jumps land below the bar ---------- */
  function reveal(target) {
    var id = target.replace(/^u-/, ""), u = unitById(id);
    if (u && !PointsView.passes(view.st, u)) { view.st.filter = "all"; paint(); }
    var el = document.getElementById(target);
    if (!el) return;
    el.scrollIntoView({ block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    el.focus({ preventScroll: true });
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  }

  /* ---------- events ---------- */
  app.addEventListener("click", function (e) {
    var nav = e.target.closest("[data-nav]");
    if (nav) { e.preventDefault(); history.pushState(null, "", location.pathname + location.search); route(); return; }
    var jump = e.target.closest("[data-jump]");
    if (jump) { e.preventDefault(); reveal(jump.dataset.jump); return; }
    if (e.target.closest("[data-missing]")) { e.preventDefault(); toast("That source isn’t in this document. Its text is in the link’s tooltip."); return; }
    var btn = e.target.closest("[data-act]");
    if (!btn || !view.review) return;
    var act = btn.dataset.act, unit = btn.dataset.unit, st = view.st;
    if (act === "pick") choose(unit, Number(btn.dataset.v));
    else if (act === "clear") choose(unit, null);
    else if (act === "retry") retry();
    else if (act === "done") finish();
    else if (act === "filter") { e.preventDefault(); st.filter = btn.dataset.val; paint(); }
    else if (act === "read") {
      var u = unitById(unit); if (!u) return;
      if (st.read[unit] === PointsView.stamp(u)) delete st.read[unit]; else st.read[unit] = PointsView.stamp(u);
      saveReads(); paint();
    }
  });
  window.addEventListener("resize", function () { barHeight(); hideTip(); });

  /* ---------- views ---------- */
  function showList() {
    teardown(); view.id = "";
    document.title = "AI-DLC story points";
    if (!db) return;
    view.unsub.push(db.collection("reviews").orderBy("createdAt", "desc").limit(100).onSnapshot(function (snap) {
      app.innerHTML = PointsView.listHtml(snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }));
    }, function () { app.innerHTML = '<div class="card msg"><b>Couldn’t load the reviews.</b><p>Reload the page.</p></div>'; }));
  }
  function showReview(id) {
    teardown(); view.id = id;
    if (!db) return;
    app.innerHTML = '<div class="card msg"><b>Loading this review…</b></div>';
    view.st.read = loadLocalReads();
    if (uid) Promise.resolve().then(function () { return readsDoc().get(); }).then(function (d) {
      var marks = d && d.exists ? (d.data().marks || {}) : {};
      Object.keys(marks).forEach(function (k) { if (!view.st.read[k]) view.st.read[k] = marks[k]; });
      paint();
    }).catch(function () { /* local marks only */ });
    var ref = db.doc("reviews/" + id);
    view.unsub.push(ref.onSnapshot(function (snap) {
      if (!snap.exists) {
        view.review = null;
        app.innerHTML = '<div class="card msg"><b>No review under this link</b><p>Nothing is stored under this id. Check the link Claude sent you.</p><p><a href="#" data-nav="">All reviews</a></p></div>';
        return;
      }
      var r = snap.data(), st = view.st, local = st.picks;
      view.review = r;
      /* the stored picks win, except a pick still on its way or waiting for Retry */
      st.picks = Object.assign({}, r.picks || {});
      Object.keys(local).forEach(function (k) { if (k in view.pending || (view.inflight && k in view.inflight) || st.unitSave[k] === "failed") st.picks[k] = local[k]; });
      document.title = (r.title || id) + " · AI-DLC story points";
      if (!view.loaded) app.innerHTML = '<div class="card msg"><b>Loading the Units…</b></div>';
      paint();
    }, function () { app.innerHTML = '<div class="card msg"><b>Couldn’t load this review.</b><p>Reload the page.</p></div>'; }));
    view.unsub.push(ref.collection("units").orderBy("n").onSnapshot(function (snap) {
      view.units = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      view.loaded = true; paint();
    }, function () { app.innerHTML = '<div class="card msg"><b>Couldn’t load the Units.</b><p>Reload the page.</p></div>'; }));
  }
  function route() { var id = reviewId(); if (id) showReview(id); else showList(); }
  window.addEventListener("hashchange", function () { if (reviewId() || !location.hash) route(); });

  (async function boot() {
    var use = window.claude && typeof window.claude.use === "function" ? window.claude.use : null;
    db = use ? await use("db") : null;
    if (!db) { app.innerHTML = '<div class="card msg"><b>Sign in to claude.ai to see your story points.</b><p>The reviews are stored with the artifact, and only a signed-in viewer can read them.</p></div>'; return; }
    try { var user = await use("user"); uid = user && typeof user.id === "function" ? await user.id() : null; } catch (e) { uid = null; }
    route();
  })();
})();
</script>
