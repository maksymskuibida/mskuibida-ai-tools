<title>AI-DLC maps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  AI-DLC maps — the one template for the project maps of an AI-DLC intent: the component map, the Unit map, the story map
  and the entity map.

  Published ONCE per developer as a private Artifact with the `db` and `user` capabilities
  (capabilities: {db: {}, user: {}}, title "AI-DLC maps", icon "map"); never regenerated per intent. Every map is a row
  INSIDE this artifact, written by the agent with the ArtifactData tool (SKILL.md next to this file, § 8;
  scripts/map_bundle.py builds the row). The page renders whatever the row says, live. Link to a map:
  <artifact url>#<row id>; to a block of it: <artifact url>#<row id>/<block id>. No hash: the list of intents and their maps.

  Data contract (contract/map.schema.json is the same in JSON Schema):

    maps/<id>   id = <intent>-<kind>, one row per intent and map kind, written again (set) whenever the records change
      schema    "aidlc-map/1"
      intent, kind ("components"|"units"|"stories"|"entities"), title, view ("graph"|"matrix"),
      revision  integer, 1 for the first publication; +1 whenever something a viewer sees changed
      builtAt   ISO time;  digest  hash of the records it was built from (the guard compares it with the records)
      sources   the record files it was built from, relative to the intent folder
      ids       {"U3": {kind, title, text, doc, line}}  the tooltips of the ids the map shows (aidlc_ids.py refs)
      previous  {revision, builtAt, blocks: {id: {label, title, summary, group, status, points, layer, needs: [id]}}}
                or, for a matrix, {revision, builtAt, rows: {id: {title, uncovered}}, cols: {...}, cells: ["row|col"]}:
                the revision before this one, so the page marks what is new, changed or removed since
      graph:  groups [{key, label}], layerName ("Wave"|"Layer"), waves [{n, title, units, points, landed}] (Unit map),
              blocks [{id, label, title, group, summary, layer, needs: [{id, why}], usedBy: [id], status ("landed"|
              "building"|"planned"), points, pointsSource, stories: [US..], detail, responsibilities: [..],
              external: [..], entities: [..]}]
      matrix: rowsTitle, colsTitle, rows [{id, label, title, uncovered}], cols [{id, label, title, layer, status}],
              cells {row id: [col id, ...]}

  The page writes nothing to the row. Per-viewer conveniences (the last view, a hidden group) stay in this browser.
  The render functions between RENDER-START and RENDER-END use no DOM, so tests render a map under Node.
  The page: a head that scrolls away (title, round, stats) and one sticky tools row (the map kind switch, search, Groups, Ready now,
  Gaps only, Only changes, the view switch and Fit / Comfortable, the Legend). The graph opens in Fit: compact cards, every wave
  in view without sideways scrolling, a long wave wrapped into columns and, when the width asks for it, the waves wrapped into
  bands; Comfortable is the full card and scrolls. The side panel is a narrow rail until a block is picked and never more than a
  third of the width. A Unit is Ready when every block it needs has landed and it has not landed (nor is it being built); the
  panel says for each need whether it landed. Stories and Entities open as a grouped list (gaps first); the matrix is the other
  view, offered when it shows something (a gap, or rows and columns that each hold several dots). A new or changed thing wears the
  colour of the round it came in, as on the gate pages; landed is a quiet filled tick.
  Stable hooks for tests and checks: #map-head, #map-bar, #map-canvas, #map-panel, [data-block=<id>], [data-row=<id>],
  [data-col=<id>], [data-kind-tab=<kind>], [data-group-chip=<key>], #map-search, [data-act="ready"|"changes"|"gaps"|"legend"|"groups"],
  [data-view="graph"|"list"], [data-zoom="fit"|"comfy"], [data-mview="list"|"matrix"], .tag.rnd.new|chg, .tag.gone, .landed, [data-ready].
-->

.tabs { display: inline-flex; gap: 4px; flex-wrap: nowrap; }

/* the round strip */
.rvbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0 0 12px; padding: 8px 14px; font-size: 13.5px; border-color: color-mix(in srgb, var(--rnd-fg) 40%, var(--line)); }

.rvbar .why-n { color: var(--muted); font-size: 12.5px; }

/* body: canvas and panel. The panel is a narrow rail until something is picked, and never more than a third of the width */
.body { display: grid; grid-template-columns: minmax(0, 1fr) 44px; gap: 16px; align-items: start; }
.body.open { grid-template-columns: minmax(0, 1fr) clamp(280px, 33.333%, 400px); }
.canvas { position: relative; padding: 8px; }
.canvas.fit { overflow-x: auto; overflow-y: hidden; min-height: 200px; }
.canvas.comfy { overflow: auto; max-height: calc(100vh - var(--bar-h) - 28px); min-height: 320px; }
.plane { position: relative; }
.plane svg { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.collabel { position: absolute; font: 600 11px var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-bottom: 4px; }
.collabel small { display: block; font: 500 10.5px var(--mono); letter-spacing: 0; text-transform: none; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; }
.collabel .bar { display: block; height: 3px; margin-top: 3px; border-radius: 2px; background: var(--line); overflow: hidden; } .collabel .bar b { display: block; height: 100%; background: var(--ok-line); }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.4; stroke-linejoin: round; }
.edge.out { stroke: var(--edge-out); stroke-width: 2; } .edge.in { stroke: var(--edge-in); stroke-width: 2; }
.edge.pv { stroke: var(--accent); stroke-width: 1.6; opacity: .85; }
.ah-out { fill: var(--edge-out); } .ah-in { fill: var(--edge-in); } .ah-pv { fill: var(--accent); }
.node { position: absolute; display: block; padding: 5px 8px 5px 13px; border-radius: 8px; border: 1px solid var(--control); background: var(--surface);
  cursor: pointer; text-align: left; transition: opacity .12s, box-shadow .12s, border-color .12s; }
.node::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; border-radius: 8px 0 0 8px; background: var(--c, var(--accent)); }
.node:hover { border-color: var(--c, var(--accent)); }
.node .n1 { display: block; flex: 1; min-width: 0; font: 600 12.5px/1.3 var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node .n2 { display: flex; gap: 6px; align-items: center; font: 500 11.5px/1.3 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; }
.node .mark { flex: none; margin-left: auto; font-size: 12px; line-height: 1; }
.node.cmp { display: flex; align-items: center; gap: 6px; padding: 0 7px 0 12px; }

.node.sel { box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent); border-width: 2px; }

.panel { padding: 16px 18px; position: sticky; top: calc(var(--bar-h) + 8px); max-height: calc(100vh - var(--bar-h) - 24px); overflow: auto; }

<script>
/* aidlc-ids.js:begin */
/* The ids an AI-DLC page shows (US1.1, AC1.1.2, FR1.4, NFR3, BR1.2, Q4, U31, C2, ADR-009, R-01, ...), each a link with
   a tooltip saying what it is. Shared: the canonical copy is shared/aidlc-ids/aidlc-ids.js in mskuibida-ai-tools,
   copied into every page by scripts/sync-shared.py. Edit it there.

   The page gives it a map of what each id is, `ids` = {"FR1.4": {kind, title, text, doc}}, the output of
   `aidlc_ids.py refs` written with the page's data, and marks each element that shows an id's own definition with
   data-aidlc-id="<id>". Then:

     AidlcIds.linkify(root, ids, { toast: fn })   turn every id in root's text into a link; run after each render
     AidlcIds.observe(root, getIds, { toast: fn }) the same, again whenever root's content changes

   A link whose id is shown in the page jumps there and flashes it. One that is not shown still looks like a link: its
   tooltip says what it is, and a click shows a toast that it is not in this page. An id no document defines says so.
   The tooltip is the page's own: the link carries data-tip and aria-label, which every page's tooltip reads. */
var AidlcIds = (function () {
  "use strict";
  var ID = /(^|[^\w-])([A-Z][A-Z]{0,4}-?\d+[a-z]?(?:[.-]\d+[a-z]?)*(?:-[A-Z]{1,4}\d+[a-z]?)?)(?![\w-])/g;
  var NOT_IDS = /^(UTF-?\d+|SHA-?\d+|ISO-?\d+|RFC-?\d+|HTTP-?\d+|TLS-?\d|H[1-6]|V\d+|X\d+|P\d|ES\d+|ID\d*)$/;
  var KINDS = { US: "Story", AC: "Acceptance criterion", FR: "Functional requirement", NFR: "Non-functional requirement",
    BR: "Business rule", Q: "Question", U: "Unit", C: "Contract", E: "External interface", ADR: "Decision record",
    R: "Review finding", D: "Decision", DR: "Design rule", S: "Screen", M: "Mockup", T: "Task" };
  var SKIP = "a, button, code, pre, script, style, textarea, input, select, option, [data-aidlc-noids]";

  function prefix(id) { return (/^[A-Z]+/.exec(id) || [""])[0]; }
  function docName(doc) { return String(doc || "").split("/").pop(); }

  function anchorOf(id) {
    var css = window.CSS && CSS.escape ? CSS.escape(id) : id.replace(/["\\]/g, "\\$&");
    return document.querySelector('[data-aidlc-id="' + css + '"]');
  }

  /** The tooltip of an id: what it is, in plain words, and where it is written. */
  function tip(id, def) {
    if (!def) return id + ": not found in this project's documents.";
    var kind = def.kind || KINDS[prefix(id)] || "";
    var head = (kind ? kind + " " : "") + id + (def.title ? ": " + def.title : "");
    var body = def.text && def.text !== def.title ? " " + def.text : "";
    return head + (/[.!?…]$/.test(head) || !body ? "" : ".") + body + (def.doc ? " (" + docName(def.doc) + ")" : "");
  }

  /** Whether a word is an id this page knows of, or looks like one of a kind it knows. */
  function isId(word, ids, prefixes) {
    if (NOT_IDS.test(word)) return false;
    return Object.prototype.hasOwnProperty.call(ids, word) || prefixes[prefix(word)] === true;
  }

  function linkify(root, ids, opts) {
    if (!root) return;
    ids = ids || {};
    opts = opts || {};
    var prefixes = {};
    Object.keys(ids).forEach(function (k) { prefixes[prefix(k)] = true; });
    Object.keys(KINDS).forEach(function (k) { prefixes[k] = true; });
    // Keys of the page's own map that are not id-shaped (a form's q1, a card's f-3) are linked by their exact text.
    var own = Object.keys(ids).filter(function (k) { return !/^[A-Z]/.test(k) && /^[\w.-]+$/.test(k); })
      .sort(function (a, b) { return b.length - a.length; })
      .map(function (k) { return k.replace(/[.-]/g, "\\$&"); });
    var OWN = own.length ? new RegExp("(^|[^\\w-])(" + own.join("|") + ")(?![\\w-])", "g") : null;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        if (!n.nodeValue || !(OWN ? /\d/ : /[A-Z]-?\d/).test(n.nodeValue)) return NodeFilter.FILTER_REJECT;
        var p = n.parentElement;
        return p && !p.closest(SKIP) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      }
    });
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function (node) {
      var text = node.nodeValue, last = 0, frag = null, m;
      var self = node.parentElement.closest("[data-aidlc-id]");
      var found = [];
      [ID, OWN].forEach(function (re) {
        if (!re) return;
        re.lastIndex = 0;
        while ((m = re.exec(text))) found.push({ word: m[2], start: m.index + m[1].length, own: re === OWN });
      });
      found.sort(function (a, b) { return a.start - b.start; });
      for (var i = 0; i < found.length; i++) {
        var word = found[i].word, start = found[i].start;
        if (start < last) continue;
        if (!found[i].own && !isId(word, ids, prefixes)) continue;
        if (self && self.getAttribute("data-aidlc-id") === word) continue;
        frag = frag || document.createDocumentFragment();
        frag.appendChild(document.createTextNode(text.slice(last, start)));
        var a = document.createElement("a");
        var def = ids[word];
        a.className = "aidlc-id" + (def ? "" : " aidlc-id-unknown");
        a.href = "#" + encodeURIComponent(word);
        a.textContent = word;
        a.setAttribute("data-aidlc-ref", word);
        a.setAttribute("data-tip", tip(word, def));
        a.setAttribute("aria-label", tip(word, def));
        frag.appendChild(a);
        last = start + word.length;

      }

    bind(root, opts);

  /** Links whose id is shown in the page get the live look; the rest the out-of-page one. */
  function markLive(root) {
    Array.prototype.forEach.call(root.querySelectorAll("a.aidlc-id"), function (a) {

    });
  }

  function bind(root, opts) {
    if (root.__aidlcIds) { root.__aidlcIds.opts = opts; return; }
    root.__aidlcIds = { opts: opts };
    root.addEventListener("click", function (e) {
      var a = e.target.closest && e.target.closest("a.aidlc-id");
      if (!a || !root.contains(a)) return;
      e.preventDefault();
      var id = a.getAttribute("data-aidlc-ref"), target = anchorOf(id);
      var say = root.__aidlcIds.opts.toast || function (t) { window.alert(t); };
      if (target) {
        var closed = target.closest("details:not([open])");
        if (closed) closed.open = true;
        target.scrollIntoView({ behavior: "smooth", block: "center" });
        target.classList.remove("aidlc-flash");
        void target.offsetWidth;
        target.classList.add("aidlc-flash");
        if (target.tabIndex < 0 && !target.hasAttribute("tabindex")) target.setAttribute("tabindex", "-1");
        target.focus({ preventScroll: true });
      } else if (a.classList.contains("aidlc-id-unknown")) {
        say(id + " isn't defined in this project's documents.");
      } else {
        say(id + " isn't in this page. What it is: in its tooltip.");
      }
    });
  }

  function observe(root, getIds, opts) {
    if (!root) return;
    var busy = false;
    var run = function () {
      if (busy) return;
      busy = true;
      try { linkify(root, getIds(), opts); } finally { busy = false; }
    };
