<title>AI-DLC maps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  AI-DLC maps — the one template for the project maps of an AI-DLC intent: the component map, the Unit map, the story map
  and the entity map.

  Published ONCE per developer as a private Artifact with the `db` and `user` capabilities
  (capabilities: {db: {}, user: {}}, title "AI-DLC maps", icon "map"); never regenerated per intent. Every map is a row
  INSIDE this artifact, written by the agent with the ArtifactData tool (SKILL.md next to this file, § 8;
  scripts/map_bundle.py builds the row). The page renders whatever the row says, live. Link to a map:
  <artifact url>#<row id>; to a block of it: <artifact url>#<row id>/<block id>. No hash: the list of intents and their maps.

  Data contract (contract/map.schema.json is the same in JSON Schema):

    maps/<id>   id = <intent>-<kind>, one row per intent and map kind, written again (set) whenever the records change
      schema    "aidlc-map/1"
      intent, kind ("components"|"units"|"stories"|"entities"), title, view ("graph"|"matrix"),
      revision  integer, 1 for the first publication; +1 whenever something a viewer sees changed
      builtAt   ISO time;  digest  hash of the records it was built from (the guard compares it with the records)
      sources   the record files it was built from, relative to the intent folder
      ids       {"U3": {kind, title, text, doc, line}}  the tooltips of the ids the map shows (aidlc_ids.py refs)
      previous  {revision, builtAt, blocks: {id: {label, title, summary, group, status, points, layer, needs: [id]}}}
                or, for a matrix, {revision, builtAt, rows: {id: {title, uncovered}}, cols: {...}, cells: ["row|col"]}:
                the revision before this one, so the page marks what is new, changed or removed since
      graph:  groups [{key, label}], layerName ("Wave"|"Layer"), waves [{n, title, units, points, landed}] (Unit map),
              blocks [{id, label, title, group, summary, layer, needs: [{id, why}], usedBy: [id], status ("landed"|
              "building"|"planned"), points, pointsSource, stories: [US..], detail, responsibilities: [..],
              external: [..], entities: [..]}]
      matrix: rowsTitle, colsTitle, rows [{id, label, title, uncovered}], cols [{id, label, title, layer, status}],
              cells {row id: [col id, ...]}

  The page writes nothing to the row. Per-viewer conveniences (the last view, a hidden group) stay in this browser.
  The render functions between RENDER-START and RENDER-END use no DOM, so tests render a map under Node.
  Stable hooks for tests and checks: #map-bar, #map-canvas, #map-panel, [data-block=<id>], [data-row=<id>],
  [data-col=<id>], [data-kind-tab=<kind>], [data-group-chip=<key>], #map-search, [data-act="edges"|"changes"|"gaps"],
  [data-view="graph"|"list"], .rv-tag.new|chg|gone, .landed.
-->

/* rev-diff.css:begin */
/* Shared: the canonical copy is shared/rev-diff/rev-diff.css; scripts/sync-shared.py copies it into every page that
   carries the block. What changed since an earlier round: inserted words on a soft green wash with a thin underline,
   removed words struck and muted, a new block with a green edge, a changed one with an amber edge, a gone one as a struck
   ghost. [data-rv="clean"] on any ancestor hides every mark and shows the page as it is now, with each round's own changes tinted in
   that round's colour (rv-r*): no strikethrough, no ghosts; the latest round wins where rounds clash. The round colours are
   the pages' own --r2..--r5 tokens (light and dark), so a round reads the same here as on its "revised" note. */
:root { --rv-ins-bg: #DDF3E4; --rv-ins-line: #2F8F55; --rv-del-fg: #9A4A43; --rv-del-bg: #FBEDEB; --rv-new: #2F8F55; --rv-chg: #C98A1B; --rv-gone: #B5544B; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --rv-ins-bg: #173A26; --rv-ins-line: #6FCB93; --rv-del-fg: #E3A39C; --rv-del-bg: #3A1F1D; --rv-new: #6FCB93; --rv-chg: #E9B65A; --rv-gone: #E3897F; } }
:root[data-theme="dark"] { --rv-ins-bg: #173A26; --rv-ins-line: #6FCB93; --rv-del-fg: #E3A39C; --rv-del-bg: #3A1F1D; --rv-new: #6FCB93; --rv-chg: #E9B65A; --rv-gone: #E3897F; }
:root { --rv-r2: var(--r2-fg, #5B2FA8); --rv-r3: var(--r3-fg, #0F665F); --rv-r4: var(--r4-fg, #8A5A00); --rv-r5: var(--r5-fg, #9B2C5C); }
.rv-t2 { --rvc: var(--rv-r2); } .rv-t3 { --rvc: var(--rv-r3); } .rv-t4 { --rvc: var(--rv-r4); } .rv-t5 { --rvc: var(--rv-r5); }
ins.rv-r { background: color-mix(in srgb, var(--rvc) 24%, transparent); color: inherit; text-decoration: none; border-radius: 3px; padding: 0 1px; box-decoration-break: clone; -webkit-box-decoration-break: clone; transition: background-color .15s; }
.rv-rb { box-shadow: inset 3px 0 0 var(--rvc); padding-left: 8px; }
ins.rv-r.rv-dim { background: none; }
.rv-rb.rv-dim { box-shadow: none; }

/* aidlc-ids.js:begin */
/* The ids an AI-DLC page shows (US1.1, AC1.1.2, FR1.4, NFR3, BR1.2, Q4, U31, C2, ADR-009, R-01, ...), each a link with
   a tooltip saying what it is. Shared: the canonical copy is shared/aidlc-ids/aidlc-ids.js in mskuibida-ai-tools,
   copied into every page by scripts/sync-shared.py. Edit it there.

   The page gives it a map of what each id is, `ids` = {"FR1.4": {kind, title, text, doc}}, the output of
   `aidlc_ids.py refs` written with the page's data, and marks each element that shows an id's own definition with
   data-aidlc-id="<id>". Then:

     AidlcIds.linkify(root, ids, { toast: fn })   turn every id in root's text into a link; run after each render
     AidlcIds.observe(root, getIds, { toast: fn }) the same, again whenever root's content changes

  "use strict";

    R: "Review finding", D: "Decision", DR: "Design rule", S: "Screen", M: "Mockup", T: "Task" };

    });
  }

  function bind(root, opts) {
    if (root.__aidlcIds) { root.__aidlcIds.opts = opts; return; }
    root.__aidlcIds = { opts: opts };
    root.addEventListener("click", function (e) {
      var a = e.target.closest && e.target.closest("a.aidlc-id");
      if (!a || !root.contains(a)) return;
      e.preventDefault();

        void target.offsetWidth;
        target.classList.add("aidlc-flash");

      } else {

      }

  }

  function observe(root, getIds, opts) {
    if (!root) return;
    var busy = false;

/* aidlc-ids.js:end */

  function graphHtml(row, st, d) {

(function () {
  "use strict";
  var app = document.getElementById("app"), toastEl = document.getElementById("toast"), tipEl = document.getElementById("tip");
  var db = null, rows = [], ids = {}, tipOn = null;
  var st = { sel: "", q: "", off: {}, allEdges: false, changed: false, gaps: false, view: "" };
  var current = "";

  function toast(text) { toastEl.textContent = text; toastEl.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { toastEl.hidden = true; }, 2600); }
  function narrow() { try { return !!(window.matchMedia && window.matchMedia("(max-width: 720px)").matches); } catch (e) { return false; } }
  function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* no storage: the page works without */ } }
  function load(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
  function parse() {
    var h = decodeURIComponent(location.hash.slice(1)), i = h.indexOf("/");
    return i < 0 ? { id: h, block: "" } : { id: h.slice(0, i), block: h.slice(i + 1) };
  }
  function rowNow() { var p = parse(); return rows.filter(function (r) { return r.id === p.id; })[0] || null; }
  function setHash(row) {
    var h = "#" + row.id + (st.sel ? "/" + st.sel : "");
    try { history.replaceState(null, "", location.pathname + location.search + h); } catch (e) { /* a preview without history */ }
  }

  function paint(keepFocus) {
    var row = rowNow();
    if (!row) { current = ""; app.innerHTML = rows.length || parse().id === "" ? MapView.indexHtml(rows) : '<div class="card msg"><b>Waiting for this map</b><p>Nothing is stored under this id yet. The agent writes the map just before it sends you the link.</p><p><a href="#" data-nav="">All maps</a></p></div>'; return; }
    ids = row.ids || {};
    var focus = keepFocus && document.activeElement && app.contains(document.activeElement) ? document.activeElement.getAttribute("data-block") || document.activeElement.getAttribute("data-col") || document.activeElement.getAttribute("data-row") : null;
    var q = document.getElementById("map-search"), qFocus = q && document.activeElement === q;
    var y = window.scrollY, canvas = document.getElementById("map-canvas"), sx = canvas ? canvas.scrollLeft : 0, sy = canvas ? canvas.scrollTop : 0;
    app.innerHTML = MapView.render(rows, row, st, narrow());
    document.title = row.title + " · " + row.intent;
    var c2 = document.getElementById("map-canvas");
    if (c2 && keepFocus) { c2.scrollLeft = sx; c2.scrollTop = sy; }
    window.scrollTo(0, y);
    if (qFocus) { var q2 = document.getElementById("map-search"); if (q2) { q2.focus(); q2.setSelectionRange(q2.value.length, q2.value.length); } }
    else if (focus) { var n = app.querySelector('[data-block="' + CSS.escape(focus) + '"],[data-col="' + CSS.escape(focus) + '"],[data-row="' + CSS.escape(focus) + '"]'); if (n) n.focus(); }
    current = row.id;
  }
  function select(id) {
    var row = rowNow();
    st.sel = st.sel === id ? "" : id;
    if (row) setHash(row);
    paint(true);
    var n = st.sel ? app.querySelector('[data-block="' + CSS.escape(st.sel) + '"]') : null;
    if (n && n.scrollIntoView) n.scrollIntoView({ block: "nearest", inline: "nearest" });
  }

  app.addEventListener("click", function (e) {
    if (e.target.closest("a.aidlc-id")) return;
    var nav = e.target.closest("[data-nav]");
    if (nav) { e.preventDefault(); st.sel = ""; location.hash = nav.dataset.nav; return; }
    var tab = e.target.closest("[data-kind-tab]");
    if (tab) { st.sel = ""; return; }
    var go = e.target.closest("[data-go]");
    if (go) { e.preventDefault(); var row0 = rowNow(); st.sel = go.dataset.go; if (row0) setHash(row0); paint(true); var t = app.querySelector('[data-block="' + CSS.escape(st.sel) + '"]'); if (t) { t.focus(); if (t.scrollIntoView) t.scrollIntoView({ block: "nearest", inline: "nearest" }); } return; }
    var chip = e.target.closest("[data-group-chip]");
    if (chip) { var k = chip.dataset.groupChip; st.off[k] = !st.off[k]; store("maps.off", JSON.stringify(st.off)); paint(true); return; }
    var act = e.target.closest("[data-act]");
    if (act) {
      var a = act.dataset.act;
      if (a === "edges") st.allEdges = !st.allEdges; else if (a === "changes") st.changed = !st.changed; else if (a === "gaps") st.gaps = !st.gaps;
      paint(true); return;
    }
    var view = e.target.closest("[data-view]");
    if (view && view.tagName === "BUTTON") { st.view = view.dataset.view; store("maps.view", st.view); paint(false); return; }
    var col = e.target.closest("[data-col]"), rw = e.target.closest("[data-row]");
    if (col || rw) { var key = col ? "c:" + col.dataset.col : "r:" + rw.dataset.row, r1 = rowNow(); st.sel = st.sel === key ? "" : key; if (r1) setHash(r1); paint(true); return; }
    var node = e.target.closest("[data-block]");
    if (node) select(node.dataset.block);
  });
  app.addEventListener("input", function (e) { if (e.target.id === "map-search") { st.q = e.target.value.trim(); paint(true); } });
  app.addEventListener("mouseover", function (e) { hover(e.target.closest(".node"), true); });
  app.addEventListener("mouseout", function (e) { hover(e.target.closest(".node"), false); });
  app.addEventListener("focusin", function (e) { hover(e.target.closest(".node"), true); });
  app.addEventListener("focusout", function (e) { hover(e.target.closest(".node"), false); });
  function hover(node, on) {
    if (!node || st.sel) return;
    var id = node.dataset.block;
    app.querySelectorAll(".edge").forEach(function (p) { if (p.dataset.from === id || p.dataset.to === id) p.classList.toggle("on", on); });
  }

  /* the keyboard: arrows walk the graph, Enter picks, Escape clears, / finds */
  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var typing = e.target.closest && e.target.closest("input, textarea, select");
    if (e.key === "Escape") { if (tipOn) hideTip(); if (typing) { e.target.blur(); return; } if (st.sel) { st.sel = ""; var r = rowNow(); if (r) setHash(r); paint(true); } return; }
    if (typing) return;
    if (e.key === "/" ) { var q = document.getElementById("map-search"); if (q) { e.preventDefault(); q.focus(); } return; }
    var node = e.target.closest && e.target.closest(".node");
    if (!node) return;
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(node.dataset.block); return; }
    var dir = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (!dir) return;
    e.preventDefault();
    var here = { x: parseFloat(node.style.left), y: parseFloat(node.style.top) }, best = null, bd = 1e9;
    app.querySelectorAll(".node:not(.off)").forEach(function (n) {
      if (n === node) return;
      var p = { x: parseFloat(n.style.left), y: parseFloat(n.style.top) }, dx = p.x - here.x, dy = p.y - here.y;
      if (dir[0] && Math.sign(dx) !== dir[0]) return;
      if (dir[1] && (Math.sign(dy) !== dir[1] || Math.abs(dx) > 1)) return;
      var d = dir[0] ? Math.abs(dx) * 4 + Math.abs(dy) : Math.abs(dy);
      if (d < bd) { bd = d; best = n; }
    });
    if (best) best.focus();
  });

  function showTip(t) {
    if (tipOn && tipOn !== t) tipOn.removeAttribute("aria-describedby");
    tipEl.textContent = t.dataset.tip; tipEl.hidden = false; tipOn = t; t.setAttribute("aria-describedby", "tip");
    var r = t.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight, top = r.top - h - 6;
    if (top < 8) top = Math.min(window.innerHeight - h - 8, r.bottom + 6);
    tipEl.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + "px"; tipEl.style.top = top + "px";
  }
  function hideTip() { if (tipOn) tipOn.removeAttribute("aria-describedby"); tipOn = null; tipEl.hidden = true; }
  function tipTarget(n) { return n && n.closest ? n.closest("a.aidlc-id[data-tip]") : null; }
  document.addEventListener("mouseover", function (e) { var t = tipTarget(e.target); if (t) { if (t !== tipOn) showTip(t); } else if (tipOn && document.activeElement !== tipOn) hideTip(); });
  document.addEventListener("focusin", function (e) { var t = tipTarget(e.target); if (t) showTip(t); else hideTip(); });
  window.addEventListener("scroll", function () { if (tipOn && document.activeElement !== tipOn) hideTip(); }, { passive: true });
  AidlcIds.observe(app, function () { return ids; }, { toast: toast });

  function route() { st.sel = parse().block; paint(false); }
  window.addEventListener("hashchange", route);
  window.addEventListener("resize", function () { if (!st.view && current) paint(true); });

  (async function boot() {
    var use = window.claude && typeof window.claude.use === "function" ? window.claude.use : null;
    db = use ? await use("db") : null;
    if (!db) { app.innerHTML = '<div class="card msg"><b>Sign in to claude.ai to use this page.</b><p>The maps are stored with the artifact, and only a signed-in viewer can read them.</p></div>'; return; }
    try { await use("user"); } catch (e) { /* no per-viewer marks are kept anyway */ }
    st.view = load("maps.view");
    try { st.off = JSON.parse(load("maps.off") || "{}") || {}; } catch (e) { st.off = {}; }
    db.collection("maps").limit(200).onSnapshot(function (snap) {
      rows = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }).filter(function (r) { return r.schema === "aidlc-map/1"; });
      if (current) paint(true); else route();
    }, function () { app.innerHTML = '<div class="card msg"><b>Couldn’t load the maps.</b><p>Reload the page.</p></div>'; });
  })();
})();
</script>
