<main class="wrap">
  <header class="card0 head" id="head">
    <div class="crumbs" id="crumbs"><span>AI-DLC</span></div>
    <div class="titlerow"><div><h1 id="title">Approval gates</h1><p class="lede loadmsg" id="lede" role="status">Connecting to your gates…</p></div><div class="facts-h" id="hfacts" hidden></div></div>
    <div class="revs" id="revs" hidden></div>
  </header>
  <div id="list" hidden></div>
  <div id="gate" hidden>
    <div class="gbar" id="bar"></div>
    <div class="desk" style="margin-top:16px">
      <nav id="rail" class="card0" aria-label="Outline"></nav>
      <div id="col"></div>
    </div>
    <footer class="band" id="band" style="margin-top:16px" hidden></footer>
  </div>
</main>
<div id="pop" role="tooltip" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const el = { crumbs: $("crumbs"), title: $("title"), lede: $("lede"), hfacts: $("hfacts"), revs: $("revs"), list: $("list"), gate: $("gate"), bar: $("bar"),
    rail: $("rail"), col: $("col"), band: $("band"), pop: $("pop"), toast: $("toast") };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = (iso) => { try { return new Date(iso).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }); } catch { return iso || ""; } };
  const clock = () => new Date().toLocaleTimeString([], { timeStyle: "short" });
  const gateId = () => { const h = decodeURIComponent(location.hash.replace(/^#/, "")); return /^[a-z0-9._-]+$/i.test(h) ? h : ""; };
  const setStatus = (t, cls) => { el.lede.textContent = t || ""; el.lede.className = "lede" + (cls ? " loadmsg " + cls : ""); el.lede.hidden = !t; };
  const WHY = { first: "first presentation", revision: "after a revision", stale: "the review was out of date" };
  const KIND = { questions: "questions", json: "JSON", review: "review" };
  const KIND_TIP = { questions: "A questions file: the questions this stage asked, with your answers", json: "A machine-readable file the stage wrote", review: "The reviewer’s own record of the review" };
  // What the gate is: "Unit u2-accounts: Approve Functional Design" / "Approve Requirements Analysis". Derived from the row's
  // unit + stage name so rows written with the older "Name · unit" title read the same; gate_bundle.py gate_title writes the identical string.
  const gateTitle = (g) => {
    const name = g.stageName || String(g.title || "").replace(g.unit ? " · " + g.unit : "", "").trim();
    return name ? (g.unit ? "Unit " + g.unit + ": " : "") + "Approve " + name : "Approval gate";
  };
  const upper = (s) => String(s || "").replace(/^./, (c) => c.toUpperCase());
  const kb = (n) => n >= 1024 ? Math.round(n / 1024) + " KB" : n + " B";
  const str = (v) => v === undefined || v === null ? "" : (typeof v === "object" ? JSON.stringify(v) : String(v));
  const plural = (n, one, many) => n + " " + (n === 1 ? one : (many || one + "s"));
  /* revisions get the unit page's colours: round 2 violet, 3 teal, 4 amber, 5 rose, then round again */
  const revTone = (v) => "r" + (((Math.max(2, v) - 2) % 4) + 2);
  const hash = (s) => { s = String(s || ""); let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36) + "." + s.length; };
  const CHEV = '<svg aria-hidden="true" width="12" height="12" viewBox="0 0 14 14"><path d="M5 3l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
  const CARET = '<span class="caret" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M5 3l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>';
  function toast(text) { el.toast.textContent = text; el.toast.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.toast.hidden = true; }, 3600); }

  let db = null, uid = null, tipOn = null;
  const fresh = () => ({ unsub: [], gate: null, docs: new Map(), docsLoaded: false, notes: {}, dirty: new Set(), noteStat: {}, unsaved: false, saving: false, failed: false,
    noteTimer: null, painted: "", openNotes: new Set(), railSig: "", mode: {}, picks: {}, fpicks: {}, iopen: new Set(), bt: { v: new Set(), u: new Set(), q: "", rows: new Set(), fold: false }, refs: new Map(), ids: {}, railOpen: {},
    reads: {}, readKey: "", hashes: {}, groups: {}, filter: "all", needsKeep: new Set(), nsNow: new Set(), nav: {}, prev: null, prevDocs: null, changed: {},
    rounds: [], roundsLoaded: false, baseDocs: {}, prevList: [], itemDelta: null, rv: { groups: [] }, rvSeq: 0, rvAt: -1, rvOnly: 0, rvLegend: "", chainReady: false, rvTrees: new Map() });
  const view = Object.assign({ id: "", diagrams: 0 }, fresh());
  const hasMd = () => typeof marked !== "undefined" && typeof DOMPurify !== "undefined";

  function teardown() {
    if (view.unsaved && view.id) flushNotes();  /* sends the pending note of the gate being left; flushNotes reads the id before it awaits */
    clearTimeout(view.noteTimer);
    view.unsub.forEach((u) => { try { u(); } catch {} });
    Object.assign(view, fresh());
    hideTip();
    el.rail.innerHTML = ""; el.col.innerHTML = ""; el.bar.innerHTML = ""; el.band.hidden = true; el.hfacts.hidden = true; el.revs.hidden = true;
  }

  /* ---------- markdown ---------- */
  if (hasMd()) {
    DOMPurify.addHook("afterSanitizeAttributes", (node) => {
      if (node.tagName === "A") {
        const href = node.getAttribute("href") || "";
        if (/^https?:\/\//i.test(href)) { node.setAttribute("target", "_blank"); node.setAttribute("rel", "noopener noreferrer"); }
        else node.removeAttribute("href");
      }
    });
  }
  const isDark = () => { const t = document.documentElement.getAttribute("data-theme"); return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
  function mdHtml(text, breaks) {
    if (!hasMd()) return null;
    try { return DOMPurify.sanitize(marked.parse(String(text ?? ""), { gfm: true, breaks: !!breaks }), { USE_PROFILES: { html: true } }); }
    catch { return null; }
  }
  /* inline markdown (bold, code, links) for one line of text */
  const inline = (text) => { if (!hasMd()) return esc(text); try { return DOMPurify.sanitize(marked.parseInline(String(text ?? "")), { USE_PROFILES: { html: true } }); } catch { return esc(text); } };
  function renderMarkdown(target, text, breaks) {
    const html = mdHtml(text, breaks);
    if (html === null) { target.innerHTML = '<pre class="plain"></pre>'; target.firstChild.textContent = text; return; }
    target.innerHTML = html;
    decorate(target);
  }
  function decorate(root) {
    root.querySelectorAll("table").forEach((t) => { if (t.parentElement.classList.contains("tablewrap")) return; const w = document.createElement("div"); w.className = "tablewrap"; t.replaceWith(w); w.appendChild(t); });
    root.querySelectorAll("pre > code.language-mermaid").forEach((code) => { code.parentElement.replaceWith(diagramBox(code.textContent)); });
  }
  function diagramBox(source) {
    const box = document.createElement("div"); box.className = "diagram"; box.dataset.src = source; box.dataset.aidlcNoids = "";
    const src = document.createElement("pre"); src.className = "src"; src.textContent = source; box.appendChild(src);
    return box;
  }
  /* A diagram is drawn when its section is open; the source stays when it cannot be drawn. */
  function drawDiagrams(root) {
    root.querySelectorAll(".diagram:not([data-drawn])").forEach((box) => {
      if (!isOpen(box)) return;
      box.dataset.drawn = "1";
      const source = box.dataset.src;
      if (typeof mermaid === "undefined") { box.insertAdjacentHTML("afterbegin", '<p class="note">The diagram library did not load, so the source is shown.</p>'); return; }
      const id = "mmd" + (++view.diagrams);
      try {
        mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: isDark() ? "dark" : "neutral", fontFamily: "IBM Plex Sans, system-ui, sans-serif" });
        Promise.resolve(mermaid.render(id, source)).then((out) => { box.innerHTML = out.svg; })
          .catch(() => { document.getElementById("d" + id)?.remove(); box.insertAdjacentHTML("afterbegin", '<p class="note">This diagram could not be drawn, so its source is shown.</p>'); });
      } catch { box.insertAdjacentHTML("afterbegin", '<p class="note">This diagram could not be drawn, so its source is shown.</p>'); }
    });
  }
  function isOpen(node) { let d = node.closest("details"); while (d) { if (!d.open) return false; d = d.parentElement && d.parentElement.closest("details"); } return true; }

  /* ---------- the list of gates ---------- */
  function showIndex() {
    teardown(); view.id = "";
    document.title = "AI-DLC approval gates";
    el.crumbs.innerHTML = "<span>AI-DLC</span>";
    el.title.textContent = "Approval gates";
    setStatus("Every stage’s documents, to read before you approve. Open a gate; a note you leave on a document goes to Claude with your answer in chat.");
    el.gate.hidden = true; el.list.hidden = false;
    el.list.innerHTML = '<div class="card0 msg"><b>Loading gates…</b></div>';
    if (!db) return;
    view.unsub.push(db.collection("gates").orderBy("createdAt", "desc").limit(100).onSnapshot((snap) => {
      if (snap.empty) { el.list.innerHTML = '<div class="card0 msg"><b>No gates yet.</b><p>Claude adds a page here at every approval gate and sends you its link before it asks for your decision.</p></div>'; return; }
      const groups = new Map();
      snap.docs.forEach((d) => { const g = d.data(); const k = g.intent || "Other"; if (!groups.has(k)) groups.set(k, []); groups.get(k).push({ id: d.id, g }); });
      el.list.innerHTML = '<div style="display:grid;gap:16px">' + [...groups].map(([intent, rows]) => `<section class="card0 lgroup"><h2>${esc(intent)}</h2>` + rows.map(({ id, g }) => {
        const n = (g.documents || []).length;
        const meta = ["Round " + (g.round || 1), fmt(g.createdAt), n ? plural(n, "document") : ""].filter(Boolean).map(esc).join(" · ");
        return `<a class="lrow" href="#${esc(id)}"><span><b>${esc(gateTitle(g))}</b><small>${meta}</small></span><span class="end">${g.phase ? `<span class="pill quiet">${esc(upper(g.phase))}</span>` : ""}</span></a>`;
      }).join("") + "</section>").join("") + "</div>";
    }, () => { el.list.innerHTML = '<div class="card0 msg"><b>Couldn’t load the gates.</b><p>Reload the page.</p></div>'; }));
  }

  /* ---------- one gate ---------- */
  function showGate(id) {
    teardown(); view.id = id;
    el.list.hidden = true; el.gate.hidden = false;
    el.crumbs.innerHTML = '<a href="#">All gates</a>';
    el.title.textContent = "Loading the gate…"; setStatus("");
    el.col.innerHTML = '<p class="hint">Loading documents…</p>';
    if (!db) return;
    const ref = db.doc("gates/" + id);
    view.unsub.push(ref.onSnapshot((snap) => {
      if (!snap.exists) {
        view.gate = null; el.title.textContent = "Waiting for this gate";
        setStatus("Nothing is stored under this link yet. Claude writes the gate just before it asks you, and this page fills in when it lands. If nothing happens, check the link Claude gave you.");
        el.col.innerHTML = ""; el.rail.innerHTML = ""; el.bar.innerHTML = ""; el.band.hidden = true; return;
      }
      const first = !view.gate; view.gate = snap.data();
      if (first) startGate();
      paintGate();
    }, () => { setStatus("Couldn’t load the gate. Reload the page.", "warn"); }));
    view.unsub.push(ref.collection("documents").orderBy("n").onSnapshot((snap) => {
      const next = new Map(); snap.docs.forEach((d) => next.set(d.id, d.data()));
      view.docs = next; view.docsLoaded = true; computeChanges(); paintAll();
    }, () => { el.col.innerHTML = '<div class="card0 msg"><b>Couldn’t load the documents.</b><p>Reload the page.</p></div>'; }));
  }

  /* Read marks are the viewer's own: data/users/<viewer>/reads-<intent>--<stage>--<unit> (localStorage when the
     user capability is not served). A mark is the hash of the text read, so on a new round only what changed turns unread. */
  function startGate() {
    const g = view.gate;
    view.readKey = [g.intent || "", g.stage || "", g.unit || ""].join("--");
    view.reads = loadLocalReads();
    if (db && uid) {
      const id = view.id;
      Promise.resolve().then(() => readsDoc().get()).then((d) => {
        if (view.id !== id) return;
        const marks = d && d.exists ? (d.data().marks || {}) : {};
        view.reads = Object.assign({}, marks, view.reads); paintChrome(docList());
      }).catch(() => { /* local marks only */ });
    }
    loadPrevious();
  }
  const localKey = () => "approval-gates:reads:" + view.readKey;
  function loadLocalReads() { try { return JSON.parse(localStorage.getItem(localKey()) || "{}") || {}; } catch { return {}; } }
  function readsDoc() { return db.collection("data/users/" + uid).doc("reads-" + view.readKey); }
  function saveReads() {
    const marks = Object.assign({}, view.reads);
    try { localStorage.setItem(localKey(), JSON.stringify(marks)); } catch { /* storage refused: the db copy still holds */ }
    try { if (db && uid) readsDoc().set({ marks }).catch(() => { /* kept locally */ }); } catch { /* kept locally */ }
  }
  /* A block with marks of its own parts (a document's elements, the findings, the stage's items) is read when every part is;

  /* ---------- the review brief ---------- */
  function parseBrief(text) {
    const lines = String(text || "").split(/\r?\n/);

        if (/^-+$/.test(cells[0] || "x")) { inTable = true; continue; }
        if (!inTable) { if (!/^id$/i.test(cells[0] || "")) return null; continue; }
        if (cells.length >= 4) rows.push({ id: cells[0], severity: cells[1], where: cells[2], status: cells[3] });
        cur = null; continue;

      inTable = inTable && line === "" ? false : inTable;

      }

      if (line === "" ) { cur = null; }

  }

  /* ---------- cross-references ----------

      const blk = v.element.closest(".block"); const d = blk && docs.find((x) => "d-" + x.key === blk.id);

  /* --- id-anchored markdown helpers --- */

    const n = whereNode(w); if (n) { RevDiff.reveal(n); return; }
    const it = itemOf(w); if (it) { openSource("i:" + it.key); return; }
    if (critOf(w)) { openSource("c:" + w); return; }
    const f = el.col.querySelector(`.fcard[data-fid="${CSS.escape(w)}"]`); if (f) { RevDiff.reveal(f); return; }
    toast("That place is not on this page.");
  }
  /* next / previous change: one stop per changed block, in reading order */
  function rvStops() { return RevDiff.stops(el.col).filter((n) => !n.closest("#b-revision, .eh, [hidden]")); }
  function rvStep(dir) {
    const s = rvStops(); if (!s.length) { toast("No marked change is showing."); return; }
    view.rvAt = view.rvAt < 0 ? (dir > 0 ? 0 : s.length - 1) : (view.rvAt + dir + s.length) % s.length;
    if (view.rvAt >= s.length) view.rvAt = 0;
    RevDiff.reveal(s[view.rvAt]);
    const p = $("rvpos"); if (p) p.textContent = (view.rvAt + 1) + " / " + s.length;
  }
  const rvBar = () => !view.prev ? "" : `<div class="rvbar" role="group" aria-label="Changes since ${esc(sinceLabel())}"><span class="seg rvseg"><button type="button" data-rvview="show" aria-pressed="${rvOn()}" data-tip="Mark what changed since ${esc(sinceLabel())}">Changes</button><button type="button" data-rvview="clean" aria-pressed="${!rvOn()}" data-tip="The page as it is now, no marks">Clean</button></span>` +
    (!rvOn() ? `<span id="rvlegend">${view.rvLegend || ""}</span>` : "") +
    (rvOn() ? `<button type="button" class="rvstep" data-rvstep="-1" aria-label="Previous change" data-tip="Previous change (k)">${UP}</button><span class="num rvpos" id="rvpos" aria-live="polite">${view.rvAt >= 0 ? view.rvAt + 1 : "–"} / ${rvStops().length}</span><button type="button" class="rvstep" data-rvstep="1" aria-label="Next change" data-tip="Next change (j)">${DOWN}</button>` : "") + `</div>`;
  const UP = '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14"><path d="M3 9l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
  const DOWN = '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14"><path d="M3 5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
  el.col.addEventListener("click", (e) => { const g = e.target.closest("[data-rvgo]"); if (!g) return; e.preventDefault(); e.stopPropagation(); rvGo(g.dataset.rvgo); }, true);
  document.addEventListener("click", (e) => { const o = e.target.closest && e.target.closest("[data-rvonly]"); if (o) { e.preventDefault(); view.rvOnly = RevDiff.toggleOnly(el.col, o, view.rvOnly); } });
  el.col.addEventListener("change", (e) => { if (e.target.matches && e.target.matches("[data-rvbase]")) useBase(e.target.value); });
  document.addEventListener("keydown", (e) => {
    if (!view.prev || !rvOn() || e.metaKey || e.ctrlKey || e.altKey || (e.target.closest && e.target.closest("textarea, input, select, [contenteditable]"))) return;
    if (e.key === "j") { e.preventDefault(); rvStep(1); } else if (e.key === "k") { e.preventDefault(); rvStep(-1); }
  });

  /* ---------- notes: saved as you type; a failed save says so and is sent again ---------- */
  function noteEdited(key, text) {
    view.notes[key] = text; view.dirty.add(key); view.unsaved = true; setNoteStat(key, "Not saved yet");
    const nb = el.col.querySelector(`.notebtn[data-key="${CSS.escape(key)}"]`); if (nb) nb.textContent = text.trim() ? "Your note" : "Add a note";
    paintSave(); clearTimeout(view.noteTimer); view.noteTimer = setTimeout(flushNotes, 700);
  }
  function setNoteStat(key, t, cls) { view.noteStat[key] = [t, cls || ""]; const s = $("ns-" + key); if (s) { s.textContent = t; s.className = "stat" + (cls ? " " + cls : ""); } }
  async function flushNotes() {
    clearTimeout(view.noteTimer);
    if (view.saving || !view.unsaved || !db || !view.id) return;
    const id = view.id, keys = [...view.dirty];
    view.saving = true; view.unsaved = false; view.dirty = new Set();
    keys.forEach((k) => setNoteStat(k, "Saving…")); paintSave();
    let err = null;
    try { await db.doc("gates/" + id).update(Object.assign({ notes: Object.assign({}, view.notes) }, bt() ? { targetPicks: JSON.parse(JSON.stringify(view.picks)) } : {}, fnd() ? { findingPicks: JSON.parse(JSON.stringify(view.fpicks)) } : {})); } catch (e) { err = e || {}; }
    if (view.id !== id) return;
    view.saving = false;
    if (!err) {
      view.failed = false;
      keys.forEach((k) => { if (!view.dirty.has(k)) setNoteStat(k, "Saved " + clock(), "ok"); });
      if (view.unsaved) { flushNotes(); return; }  /* typed while the save was on its way */
    } else {
      view.failed = true; view.unsaved = true; keys.forEach((k) => view.dirty.add(k));
      keys.forEach((k) => setNoteStat(k, "Not saved. It is sent again when you type, or press Retry in the bar.", "warn"));
      toast(err.code === "invalid_argument" ? "You can read this gate but not save notes to it. Ask the owner for Contributor access." : "Couldn’t save your note. Check your connection; it is sent again when you type.");
    }
    paintChrome(docList());
  }
  if (window.ResizeObserver) new ResizeObserver(() => { document.documentElement.style.setProperty("--bar-h", el.bar.offsetHeight + "px"); }).observe(el.bar);
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { view.painted = ""; paintAll(); });
  new MutationObserver(() => { view.painted = ""; paintAll(); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  /* every id in the gate's documents, summary and review: a link with a tooltip, by the shared AidlcIds */
  AidlcIds.observe(el.col, () => view.ids, { toast });

  /* ---------- boot ---------- */
  function route() { const id = gateId(); if (id) showGate(id); else showIndex(); }
  window.addEventListener("hashchange", route);
  route();
  (async () => {
    const use = window.claude && typeof window.claude.use === "function" ? window.claude.use : null;
    db = use ? await use("db") : null;
    if (!db) { setStatus("Sign in to claude.ai to read this gate. The gates are stored with the artifact, and only a signed-in viewer can read them."); el.list.innerHTML = ""; el.col.innerHTML = ""; el.rail.innerHTML = ""; return; }
    try { const user = await use("user"); uid = user && typeof user.id === "function" ? await user.id() : null; } catch { uid = null; }
    route();
  })();
})();
</script>
