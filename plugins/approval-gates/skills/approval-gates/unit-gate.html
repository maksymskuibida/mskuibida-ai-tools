<title>AI-DLC unit approvals</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  AI-DLC unit approvals — the one template for the two pages of a Unit claimed with the unit-end rhythm:
  the plan approval (every design stage, read once) and the unit-end approval (what was built).

  Published ONCE per developer as a private Artifact with the `db` and `user` capabilities
  (capabilities: {db: {}, user: {}}, icon "checklist"); never regenerated per Unit. Every page is a row
  INSIDE this artifact, written by the agent with the ArtifactData tool (SKILL.md next to this file;
  scripts/unit_bundle.py builds it). The page renders whatever the row says, live.

  Data contract (what the agent writes — always a NEW row, a fresh id per presentation):

    bundles/<id>   {bundle, page: "plan"|"unit-end", unit, intent, title, createdAt (ISO), status: "open"}
      bundle: a gate bundle, as contract/gate-bundle.schema.json and contract/README.md define it.
      id:     the bundle's id, <intent>-<unit>-<page>-v<revision>-<YYYYMMDDTHHMM>.

  Ids. Every id the page shows (US1.1, FR1.4, BR1.2, Q3, R-01, ADR-009, …), in any text, is a link with a tooltip by the
  shared AidlcIds (aidlc-ids.js below; shared/aidlc-ids/README.md is its contract), from the bundle's `ids`. A row or an
  answer that shows an id's definition carries data-aidlc-id, and a link to it opens what holds it and lands there.

  What the page writes:

    bundles/<id>.notes[<row anchor>] = "text"          a note to the agent on a row or a step (step-<n>)
    bundles/<id>.picks[<row anchor>] = "do"|"leave"    the person's lean on a suggestion row
                                       "now"|"later"   on a row of the `unverified` section: Test now or Later; the
                                                       agent's test plan covers the rows picked Test now
    A unit-end page presented after a test plan also holds the sections `verified` (Verified by you), `unverified`
    (Still not verified) and `failed` (Failed, left as known); see contract/README.md.
    data/users/<viewer>/reads-<intent>--<unit>--<page>  {marks: {<row anchor or step key>: <revision read>}}
      Read marks are the viewer's own (localStorage when the user capability is not served), set only with the row's
      read dot (opening a row does not mark it). A row is read when its mark is at least the row's revision, so on a
      new revision only the rows marked with it turn unread.

  Notes and picks reach the agent only when the person answers in chat; the decision itself is given in chat.
  Link to a page: <artifact url>#<id>. No hash: the list of pages.

  The render functions between RENDER-START and RENDER-END use no DOM, so tests render a bundle under Node.
-->

  --core-bg: #171A21; --core-fg: #FFFFFF; --main-bg: #DDE1E8; --main-fg: #171A21; --minor-bg: #F5F6F8; --minor-fg: #4A5160;
  --ok-bg: #E6F4EA; --ok-fg: #1F6B36; --warn-bg: #FFF4DB; --warn-fg: #7A4B00; --warn-dot: #B26B00;
  --r2-tint: #F8F5FE; --r2-bg: #EDE5FC; --r2-fg: #5B2FA8; --r3-tint: #F1FAF8; --r3-bg: #DCF2EE; --r3-fg: #0F665F;
  --r4-tint: #FFF8EC; --r4-bg: #FCEBCB; --r4-fg: #8A5A00; --r5-tint: #FDF3F7; --r5-bg: #F9DCE8; --r5-fg: #9B2C5C;
  --band-bg: #171A21; --band-fg: #FFFFFF; --band-muted: #C9CDD6; --tip-bg: #171A21; --tip-fg: #FFFFFF; --tip-line: #171A21;
  --on-accent: #FFFFFF;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --bar-h: 120px;
}

  --bg: #111318; --surface: #1A1D24; --raised: #20232B; --fg: #E6E8EE; --fg-2: #C3C8D2; --muted: #9AA1AF;

  --ok-bg: #183024; --ok-fg: #8FD3A6; --warn-bg: #3A2C12; --warn-fg: #F0C36B; --warn-dot: #F0A93B;

  --on-accent: #111318;
  color-scheme: dark }

* { box-sizing: border-box; }
html { overflow-x: hidden; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--body); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
[hidden] { display: none !important; }
a { color: var(--accent); }
a:hover { color: var(--accent-strong); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }
#app { display: flex; flex-direction: column; gap: 16px; }
.wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

/* header */
.head { display: flex; flex-direction: column; gap: 14px; padding: 20px 24px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; color: var(--muted); font-size: 13px; }
.crumbs a { color: inherit; text-decoration: none; } .crumbs a:hover { text-decoration: underline; }
.status { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 2px 10px; border-radius: 13px; background: var(--warn-bg); color: var(--warn-fg); font-weight: 500; }
.status i { width: 7px; height: 7px; border-radius: 4px; background: var(--warn-dot); }
.titlerow { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px 32px; }
.titlerow > div:first-child { flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; text-wrap: balance; overflow-wrap: anywhere; }
.lede { margin: 0; color: var(--fg-2); line-height: 1.55; max-width: 76ch; }
.facts { display: flex; flex-wrap: wrap; gap: 10px; }
.fact { display: flex; flex-direction: column; gap: 2px; padding: 8px 14px; border-radius: 8px; background: var(--bg); min-width: 108px; }
.fact span { font-size: 12px; color: var(--muted); } .fact b { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.revs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px; border-radius: 8px; background: var(--raised); }
.revs .lbl { font-size: 13px; color: var(--fg-2); }
.revs .v1 { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.revbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid var(--control); background: var(--surface); font-size: 12px; font-weight: 500; }
.revs .hint { font-size: 12px; color: var(--muted); }

/* sticky bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; display: flex; flex-direction: column; gap: 10px; padding: 10px 14px; background: color-mix(in srgb, var(--surface) 96%, transparent); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 2px 8px rgba(23, 26, 33, .06); backdrop-filter: blur(6px); }
.barrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.seg { display: inline-flex; padding: 3px; border-radius: 8px; background: var(--line-soft); }
.seg button { height: 30px; padding: 0 14px; border: 0; border-radius: 6px; background: transparent; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 2px rgba(23, 26, 33, .12); }
.filters { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.pill { height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid var(--control); background: var(--surface); font-weight: 500; }
.pill[aria-pressed="true"] { background: var(--fg); color: var(--surface); border-color: var(--fg); }
.tools { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.progress { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; color: var(--fg-2); }
.meter { width: 100px; height: 6px; border-radius: 3px; background: var(--line-soft); overflow: hidden; display: block; }
.meter i { display: block; height: 6px; background: var(--accent); }
.btn { height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--control); background: var(--surface); }
.btn:hover, .pill:hover, .revbtn:hover { border-color: var(--accent); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 16px; border: 1px solid var(--control); background: var(--surface); color: var(--fg); text-decoration: none; font-size: 13px; white-space: nowrap; }
.chip:hover { border-color: var(--accent); color: var(--fg); }
.chip .count { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; white-space: nowrap; }

/* sections and rows */
main { display: flex; flex-direction: column; gap: 16px; }
section.card { overflow: hidden; scroll-margin-top: calc(var(--bar-h) + 16px); }
.sechead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; min-height: 52px; padding: 6px 16px 6px 8px; }
.sechead:hover, .rowhead:hover { background: var(--hover); }
.twist { flex: none; width: 32px; height: 32px; border: 0; border-radius: 6px; background: transparent; display: inline-flex; align-items: center; justify-content: center; }
.twist svg { transition: transform .12s; } .twist[aria-expanded="true"] svg { transform: rotate(90deg); }
h2 { flex: 1 1 240px; min-width: 0; margin: 0; font-size: 15px; font-weight: 600; }
h2 button { width: 100%; min-height: 36px; border: 0; padding: 0; background: transparent; text-align: left; font-weight: 600; }
h2 .hint { margin-left: 8px; font-weight: 400; font-size: 13px; color: var(--muted); }
.counts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.lc { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 7px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.lc b { font-family: var(--mono); font-weight: 500; }
.shown { margin-left: 4px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.secbody { border-top: 1px solid var(--line); }
.empty { margin: 0; padding: 14px 16px; color: var(--muted); }
.asapproved { margin: 0; padding: 14px 16px; display: flex; align-items: center; gap: 10px; color: var(--ok-fg); font-weight: 500; }
.row { border-bottom: 1px solid var(--line-soft); scroll-margin-top: calc(var(--bar-h) + 16px); }
.row:last-child { border-bottom: 0; }
.rowhead { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px 0 8px; }
.rid { flex: none; width: 64px; font-family: var(--mono); font-size: 12px; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rtitle { flex: 1; min-width: 0; height: 36px; border: 0; padding: 0; background: transparent; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; color: var(--fg); }
.row.read .rtitle, .step.read .rtitle { font-weight: 400; color: var(--muted); }
.look { flex: none; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--accent); color: var(--accent); white-space: nowrap; }
.where { flex: none; width: 104px; font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.where.path { font-family: var(--mono); width: 150px; }
.lab { flex: none; width: 66px; text-align: center; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 3px 0; border-radius: 4px; }
.layer { flex: none; width: 66px; text-align: center; font-size: 11px; font-weight: 500; padding: 3px 0; border-radius: 4px; }
.dot { flex: none; width: 32px; height: 32px; border: 0; border-radius: 6px; background: transparent; display: inline-flex; align-items: center; justify-content: center; }
.dot i { width: 10px; height: 10px; border-radius: 5px; background: var(--accent); border: 2px solid var(--accent); }
.read > .rowhead .dot i { background: transparent; border-color: var(--control); }
.rowbody { display: flex; flex-direction: column; gap: 10px; padding: 2px 16px 16px 114px; }
.rowbody > * { max-width: 780px; }
.rowbody p { margin: 0; line-height: 1.55; color: var(--fg); }
.revnote { padding: 8px 10px; border-radius: 6px; font-size: 13px; line-height: 1.5; }
.refs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.refs > span { font-size: 12px; color: var(--muted); }
.ref { position: relative; display: inline-flex; align-items: center; min-height: 24px; padding: 0 7px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); font-family: var(--mono); font-size: 12px; text-decoration: none; white-space: nowrap; }
.ref:hover { color: var(--accent-strong); filter: brightness(.97); }
/* a design id among the references: the shared link, in the reference chip's look */
.refs a.aidlc-id { display: inline-flex; align-items: center; min-height: 24px; padding: 0 7px; border-radius: 5px; background: var(--accent-soft); font-family: var(--mono); font-size: 12px; }
.refs a.aidlc-id.aidlc-id-unknown { background: var(--line-soft); }
a.aidlc-id:hover { color: var(--accent-strong); }
/* the one tooltip: every reference and every id link, on hover and on keyboard focus */
#tip { position: fixed; z-index: 30; max-width: min(360px, calc(100vw - 24px)); padding: 8px 10px; border-radius: 6px; background: var(--tip-bg); color: var(--tip-fg); border: 1px solid var(--tip-line); font: 12px/1.45 var(--body); pointer-events: none; box-shadow: 0 4px 14px rgba(0, 0, 0, .18); }
.covered { font-size: 12px; padding: 2px 8px; border-radius: 4px; }
.notebox { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.notebox label { flex: 1 1 300px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.notebox textarea { width: 100%; resize: vertical; padding: 8px 10px; border: 1px solid var(--control); border-radius: 6px; font: inherit; font-size: 13px; color: var(--fg); background: var(--surface); }
.notestat { font-size: 12px; color: var(--muted); min-height: 18px; }
.picks { display: inline-flex; gap: 6px; }
.picks button { height: 34px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--control); background: var(--surface); font-weight: 500; }
.picks button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.testpick { display: inline-flex; flex: none; border: 1px solid var(--control); border-radius: 8px; overflow: hidden; background: var(--surface); }
.testpick button { height: 28px; padding: 0 11px; border: 0; background: transparent; color: var(--fg-2); font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer; }
.testpick button + button { border-left: 1px solid var(--control); }
.testpick button:hover { background: var(--hover); }
.testpick button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.testpick button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-strong); }
.testpick button[aria-pressed="true"][data-val="later"] { background: var(--low-bg); color: var(--low-fg); }
.subs { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; line-height: 1.5; }
.subs li { padding: 1px 4px; border-radius: 4px; }
.subs .sv { margin-left: 8px; font-size: 11px; font-weight: 600; }
.qgroup .rowhead { font-weight: 500; }
.qs { display: flex; flex-direction: column; padding: 0 16px 12px 50px; }
.q { display: flex; align-items: center; gap: 12px; min-height: 36px; border-top: 1px solid var(--line-soft); scroll-margin-top: calc(var(--bar-h) + 16px); }
.q .qid { flex: none; width: 30px; font-family: var(--mono); font-size: 12px; color: var(--fg-2); }
.q .ans { flex: none; min-width: 24px; height: 22px; padding: 0 6px; border-radius: 5px; background: var(--line-soft); font-family: var(--mono); font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; }
.q .qt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.q .prop { flex: none; font-size: 12px; color: var(--warn-fg); }
.differ { flex: none; font-size: 12px; padding: 2px 8px; border-radius: 4px; background: var(--warn-bg); color: var(--warn-fg); }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { background: var(--accent-soft); } 100% { background: transparent; } }

/* the map of how the pieces connect */
.mapwrap { padding: 14px 16px; border-bottom: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 10px; }
.mapwrap > span { font-size: 13px; color: var(--muted); }
.mapscroll { overflow-x: auto; }
.map { position: relative; }
.map svg { position: absolute; inset: 0; overflow: visible; }
.node { position: absolute; display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--control); background: var(--surface); color: var(--fg); text-decoration: none; overflow: hidden; }
.node b { font-weight: 500; font-size: 13px; line-height: 1.3; }

<script>
/* aidlc-ids.js:begin */
/* The ids an AI-DLC page shows (US1.1, AC1.1.2, FR1.4, NFR3, BR1.2, Q4, U31, C2, ADR-009, R-01, ...), each a link with
   a tooltip saying what it is. Shared: the canonical copy is shared/aidlc-ids/aidlc-ids.js in mskuibida-ai-tools,
   copied into every page by scripts/sync-shared.py. Edit it there.

   The page gives it a map of what each id is, `ids` = {"FR1.4": {kind, title, text, doc}}, the output of
   `aidlc_ids.py refs` written with the page's data, and marks each element that shows an id's own definition with
   data-aidlc-id="<id>". Then:

     AidlcIds.linkify(root, ids, { toast: fn })   turn every id in root's text into a link; run after each render
     AidlcIds.observe(root, getIds, { toast: fn }) the same, again whenever root's content changes

   tooltip says what it is, and a click shows a toast that it is not in this page. An id no document defines says so.
   The tooltip is the page's own: the link carries data-tip and aria-label, which every page's tooltip reads. */

  "use strict";
  var ID = /(^|[^\w-])([A-Z][A-Z]{0,4}-?\d+[a-z]?(?:[.-]\d+[a-z]?)*(?:-[A-Z]{1,4}\d+[a-z]?)?)(?![\w-])/g;

  var KINDS = { US: "Story", AC: "Acceptance criterion", FR: "Functional requirement", NFR: "Non-functional requirement",
    BR: "Business rule", Q: "Question", U: "Unit", C: "Contract", E: "External interface", ADR: "Decision record",
    R: "Review finding", D: "Decision", DR: "Design rule", S: "Screen", M: "Mockup", T: "Task" };

  function prefix(id) { return (/^[A-Z]+/.exec(id) || [""])[0]; }

        frag.appendChild(document.createTextNode(text.slice(last, start)));

        a.setAttribute("data-aidlc-ref", word);
        a.setAttribute("data-tip", tip(word, def));
        a.setAttribute("aria-label", tip(word, def));

        last = start + word.length;

  function markLive(root) {

    });
  }

  function bind(root, opts) {
    if (root.__aidlcIds) { root.__aidlcIds.opts = opts; return; }

    root.addEventListener("click", function (e) {
      var a = e.target.closest && e.target.closest("a.aidlc-id");
      if (!a || !root.contains(a)) return;
      e.preventDefault();
      var id = a.getAttribute("data-aidlc-ref"), target = anchorOf(id);
      var say = root.__aidlcIds.opts.toast || function (t) { window.alert(t); };

        var closed = target.closest("details:not([open])");
        if (closed) closed.open = true;
        target.scrollIntoView({ behavior: "smooth", block: "center" });
        target.classList.remove("aidlc-flash");
        void target.offsetWidth;
        target.classList.add("aidlc-flash");
        if (target.tabIndex < 0 && !target.hasAttribute("tabindex")) target.setAttribute("tabindex", "-1");
        target.focus({ preventScroll: true });

      } else {
        say(id + " isn't in this page. What it is: in its tooltip.");
      }
    });
  }

  function observe(root, getIds, opts) {
    if (!root) return;
    var busy = false;
    var run = function () {
      if (busy) return;
      busy = true;
      try { linkify(root, getIds(), opts); } finally { busy = false; }
    };
    run();
    new MutationObserver(function () { if (!busy) window.requestAnimationFrame(run); })

  }

  return { linkify: linkify, observe: observe, tip: tip, KINDS: KINDS };
})();
/* aidlc-ids.js:end */

    var picks = suggestion ? '<div class="picks" role="group" aria-label="Suggestion"><button type="button" data-act="pick" data-key="' + esc(key) + '" data-val="do" aria-pressed="' + (pick === "do") + '">Do it</button><button type="button" data-act="pick" data-key="' + esc(key) + '" data-val="leave" aria-pressed="' + (pick === "leave") + '">Leave it</button></div>' : "";
    return '<div class="notebox"><label for="nt-' + esc(key) + '">Note to the agent<textarea id="nt-' + esc(key) + '" rows="2" data-note="' + esc(key) + '" placeholder="' + esc(placeholder) + '">' + esc(note) + '</textarea><span class="notestat" id="ns-' + esc(key) + '">' + esc(st.noteStat[key] || "") + "</span></label>" + picks + "</div>";
  }

  /* The pick on a not-verified row: Test now or Later. It decides which rows the agent's test plan covers. */
  function testPick(st, key) {
    var pick = st.picks[key];
    return '<span class="testpick" role="group" aria-label="Test this point"><button type="button" data-act="pick" data-key="' + esc(key) + '" data-val="now" aria-pressed="' + (pick === "now") + '">Test now</button><button type="button" data-act="pick" data-key="' + esc(key) + '" data-val="later" aria-pressed="' + (pick === "later") + '">Later</button></span>';
  }

  function rowHtml(st, bundle, sec, r) {
    var key = anchor(r.id), read = isRead(st, key, r), open = isOpen(st, key, read);
    var t = r.rev ? revTone(r.rev) : null;
    var bg = t ? "background:var(--" + t + "-tint)" : (r.lookFirst ? "background:var(--accent-tint)" : "");
    var head = '<div class="rowhead">' +
      '<button type="button" class="twist" data-act="row" data-key="' + esc(key) + '" aria-expanded="' + open + '" aria-label="' + (open ? "Collapse " : "Expand ") + esc(r.id) + '">' + CHEVRON + "</button>" +
      '<span class="rid" title="' + esc(r.id) + '">' + esc(r.id) + "</span>" +
      '<button type="button" class="rtitle" data-act="row" data-key="' + esc(key) + '" title="' + esc(r.title) + '">' + esc(r.title) + "</button>" +
      revBadge(r) + (r.lookFirst ? '<span class="look">look first</span>' : "") +
      (r.where ? '<span class="where' + (r.whereIsPath ? " path" : "") + '" title="' + esc(r.where) + '">' + esc(r.where) + "</span>" : "") +
      (sec.kind === "unverified" ? testPick(st, key) : "") +
      '<span class="lab" style="' + tone(LABEL_TONE[r.label] || "low") + '">' + esc(r.label) + "</span>" +
      '<button type="button" class="dot" data-act="read" data-key="' + esc(key) + '" aria-label="Mark ' + esc(r.id) + (read ? " unread" : " read") + '" title="Mark ' + (read ? "unread" : "read") + '"><i></i></button></div>';
    var body = "";
    if (open) {
      var refs = (r.refs || []).map(function (x) { return refHtml(x, bundle); }).join("");
      var cov = r.coveredBy ? '<span class="covered" style="' + tone(r.coveredBy.settled ? "ok" : "warn") + '">' + esc(r.coveredBy.text) + "</span>" : "";
      body = '<div class="rowbody">' +
        (r.rev && r.revNote ? '<p class="revnote" style="background:var(--' + t + "-bg);color:var(--" + t + '-fg)">' + esc(r.revNote) + "</p>" : "") +
        "<p>" + esc(r.body) + "</p>" +
        (refs || cov ? '<div class="refs">' + (refs && sec.refsLabel ? "<span>" + esc(sec.refsLabel) + "</span>" : "") + refs + cov + "</div>" : "") +
        noteBox(st, key, "Only if something should change", r.suggestion) + "</div>";
    }
    return '<div class="row' + (read ? " read" : "") + '" id="' + esc(key) + '"' + idAttr(definedIds(bundle), key) + ' style="' + bg + '">' + head + body + "</div>";
  }

  function sectionHead(key, title, hint, open, right) {
    return '<div class="sechead"><button type="button" class="twist" data-act="sec" data-key="' + esc(key) + '" aria-expanded="' + open + '" aria-label="' + (open ? "Collapse " : "Expand ") + esc(title) + '">' + CHEVRON + "</button>" +
      '<h2><button type="button" data-act="sec" data-key="' + esc(key) + '">' + esc(title) + (hint ? ' <span class="hint">' + esc(hint) + "</span>" : "") + "</button></h2>" +
      '<div class="counts">' + right + "</div></div>";
  }

  function labelCounts(rows, kinds) {
    return kinds.map(function (k) { var n = rows.filter(function (r) { return r.label === k; }).length; return n ? labelChip(k, n) : ""; }).join("") +
      Object.keys(rows.reduce(function (m, r) { if (r.rev) m[r.rev] = 1; return m; }, {})).sort().map(function (v) {
        var n = rows.filter(function (r) { return r.rev === +v; }).length, t = revTone(+v);
        return '<span class="lc" style="background:var(--' + t + "-bg);color:var(--" + t + '-fg)">v' + int(v) + "<b>" + n + "</b></span>";
      }).join("");
  }

  function mapHtml(m) {
    var nodes = m.nodes || [], edges = m.edges || [], layer = {}, i, changed = true, guard = 0;
    nodes.forEach(function (n) { layer[n.id] = 0; });
    while (changed && guard++ < 50) {
      changed = false;
      edges.forEach(function (e) { if (layer[e.from] != null && layer[e.to] != null && layer[e.to] < layer[e.from] + 1 && layer[e.from] < nodes.length) { layer[e.to] = layer[e.from] + 1; changed = true; } });
    }
    var cols = {}, W = 196, H = 64, GX = 56, GY = 18;
    nodes.forEach(function (n) { (cols[layer[n.id]] = cols[layer[n.id]] || []).push(n); });
    var pos = {}, maxRows = 0, ncols = 0;
    Object.keys(cols).forEach(function (c) { cols[c].forEach(function (n, r) { pos[n.id] = { x: +c * (W + GX), y: r * (H + GY) }; }); maxRows = Math.max(maxRows, cols[c].length); ncols = Math.max(ncols, +c + 1); });
    var width = ncols * W + (ncols - 1) * GX, height = maxRows * H + (maxRows - 1) * GY;
    var lines = edges.map(function (e) {
      var a = pos[e.from], b = pos[e.to]; if (!a || !b) return "";
      var x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2;
      if (b.x <= a.x) { x1 = a.x + W / 2; y1 = a.y + H; x2 = b.x + W / 2; y2 = b.y; }
      var mx = (x1 + x2) / 2;
      var d = b.x > a.x ? "M" + x1 + " " + y1 + " C" + mx + " " + y1 + " " + mx + " " + y2 + " " + (x2 - 6) + " " + y2 : "M" + x1 + " " + y1 + " L" + x2 + " " + (y2 - 6);
      return '<path class="edge" d="' + d + '" marker-end="url(#arrow)"></path>' + (e.label ? '<text class="edgelabel" x="' + (mx) + '" y="' + ((y1 + y2) / 2 - 6) + '" text-anchor="middle">' + esc(e.label) + "</text>" : "");
    }).join("");
    var boxes = nodes.map(function (n) {
      var p = pos[n.id], tag = n.target ? "a" : "div";
      var nt = n.target ? safeHref(n.target) : "";
      return "<" + tag + ' class="node ' + esc(n.weight) + '"' + (n.target ? ' href="' + esc(nt) + '" data-jump="' + esc(nt.slice(1)) + '"' : "") + ' style="left:' + p.x + "px;top:" + p.y + "px;width:" + W + "px;height:" + H + 'px"><b>' + esc(n.title) + "</b>" + (n.note ? "<small>" + esc(n.note) + "</small>" : "") + "</" + tag + ">";
    }).join("");
    return '<div class="mapwrap"><span>' + esc(m.caption || "How the pieces connect: dark boxes matter most; dashed ones already existed.") + '</span><div class="mapscroll"><div class="map" style="width:' + width + "px;height:" + height + 'px">' +
      '<svg width="' + width + '" height="' + height + '" aria-hidden="true"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"></path></marker></defs>' + lines + "</svg>" + boxes + "</div></div></div>";
  }

  function sectionHtml(st, bundle, s) {
    var rows = sortRows(s.rows || []), kinds = s.kind === "built" ? WEIGHTS : SEVERITY;
    var shownRows = rows.filter(function (r) { return passes(st, r, anchor(r.id), false); });
    var open = secOpen(st, s.key, true);
    var right = labelCounts(rows, kinds) + '<span class="shown">' + (st.filter === "all" ? rows.length : shownRows.length + "/" + rows.length) + "</span>";
    var body = "";
    if (open) {
      body = '<div class="secbody">' + (s.map && st.filter === "all" ? mapHtml(s.map) : "") +
        (s.asApproved ? '<p class="asapproved">The design stays as approved.</p>' : "") +
        shownRows.map(function (r) { return rowHtml(st, bundle, s, r); }).join("") + "</div>";
    }
    return '<section class="card" id="' + esc(s.key) + '" data-sec="' + esc(s.key) + '">' + sectionHead(s.key, s.title, s.hint, open, right) + body + "</section>";
  }

  function stepHtml(st, bundle, step) {
    var key = "step-" + int(step.n), read = isRead(st, stepKey(step), step), open = isOpen(st, key, read), t = step.rev ? revTone(step.rev) : null;
    var lt = LAYER_TONE[step.layer] || "low";
    var head = '<div class="rowhead"><button type="button" class="twist" data-act="row" data-key="' + key + '" aria-expanded="' + open + '" aria-label="' + (open ? "Collapse" : "Expand") + " step " + int(step.n) + '">' + CHEVRON + "</button>" +
      '<span class="rid">Step ' + int(step.n) + "</span>" +
      '<button type="button" class="rtitle" data-act="row" data-key="' + key + '" title="' + esc(step.title) + '">' + esc(step.title) + "</button>" + revBadge(step) +
      '<span class="layer" style="' + tone(lt) + '">' + esc(step.layer) + "</span>" +
      '<span class="where num">' + plural(step.files, "file") + "</span>" +
      '<span class="where wide">' + ((step.implements || []).length ? plural(step.implements.length, "design pt", "design pts") : "") + "</span>" +
      '<button type="button" class="dot" data-act="read" data-key="' + key + '" aria-label="Mark step ' + int(step.n) + (read ? " unread" : " read") + '"><i></i></button></div>';
    var body = "";
    if (open) {
      body = '<div class="rowbody">' + (step.rev && step.revNote ? '<p class="revnote" style="background:var(--' + t + "-bg);color:var(--" + t + '-fg)">' + esc(step.revNote) + "</p>" : "") +
        '<ol class="subs">' + (step.subs || []).map(function (s) {
          if (!s.rev) return "<li>" + esc(s.text) + "</li>";
          var u = revTone(s.rev);
          return '<li style="background:var(--' + u + '-bg)">' + esc(s.text) + '<span class="sv" style="color:var(--' + u + '-fg)">v' + int(s.rev) + "</span></li>";
        }).join("") + "</ol>" +
        ((step.implements || []).length ? '<div class="refs"><span>Implements</span>' + step.implements.map(function (x) { return refHtml(x, bundle); }).join("") + "</div>" : "") +
        noteBox(st, key, "Only if this step should change", false) + "</div>";
    }
    return '<div class="row step' + (read ? " read" : "") + '" id="' + key + '" style="' + (t ? "background:var(--" + t + "-tint)" : "") + '">' + head + body + "</div>";
  }

  function planHtml(st, bundle) {
    var p = bundle.plan, steps = p.steps || [], open = secOpen(st, "plan", true);
    var shown = steps.filter(function (s) { return passes(st, s, stepKey(s), true); });
    var layers = LAYER_ORDER.map(function (l) {
      var n = steps.filter(function (s) { return s.layer === l; }).length;
      return n ? '<span class="lc" style="' + tone(LAYER_TONE[l]) + ';text-transform:none">' + esc(l) + "<b>" + n + "</b></span>" : "";
    }).join("");
    var revs = Object.keys(steps.reduce(function (m, s) { if (s.rev) m[s.rev] = 1; return m; }, {})).sort().map(function (v) {
      var t = revTone(+v); return '<span class="lc" style="background:var(--' + t + "-bg);color:var(--" + t + '-fg)">v' + int(v) + "<b>" + steps.filter(function (s) { return s.rev === +v; }).length + "</b></span>";
    }).join("");
    var right = layers + revs + '<span class="shown">' + (st.filter === "all" ? steps.length : shown.length + "/" + steps.length) + "</span>";
    var body = open ? '<div class="secbody">' + shown.map(function (s) { return stepHtml(st, bundle, s); }).join("") + "</div>" : "";
    return '<section class="card" id="plan" data-sec="plan">' + sectionHead("plan", p.title || "Code plan", p.hint || "", open, right) + body + "</section>";
  }

  function answersHtml(st, bundle) {
    var defs = definedIds(bundle);
    var groups = bundle.answers || [], open = secOpen(st, "answers", true);
    var total = 0, differ = 0;
    groups.forEach(function (g) { (g.questions || []).forEach(function (q) { total++; if (q.proposed && q.answer.charAt(0) !== q.proposed.charAt(0)) differ++; }); });
    var right = (differ ? '<span class="lc" style="' + tone("warn") + '">differs from proposal<b>' + differ + "</b></span>" : "") + '<span class="shown">' + plural(groups.length, "file") + " · " + total + "</span>";
    var body = "";
    if (open) {
      body = '<div class="secbody">' + groups.map(function (g) {
        var gk = "ans-" + g.key, go = st.open[gk] !== false;
        var d = (g.questions || []).filter(function (q) { return q.proposed && q.answer.charAt(0) !== q.proposed.charAt(0); }).length;
        return '<div class="row qgroup" id="' + esc(g.key) + '"><div class="rowhead"><button type="button" class="twist" data-act="group" data-key="' + esc(gk) + '" aria-expanded="' + go + '" aria-label="' + (go ? "Collapse " : "Expand ") + esc(g.title) + ' answers">' + CHEVRON + "</button>" +
          '<button type="button" class="rtitle" data-act="group" data-key="' + esc(gk) + '" title="' + esc(g.file) + '">' + esc(g.title) + "</button>" +
          (d ? '<span class="differ">' + d + " differ" + (d === 1 ? "s" : "") + " from the proposal</span>" : "") +
          '<span class="shown">' + plural((g.questions || []).length, "answer") + "</span></div>" +
          (go ? '<div class="qs">' + (g.questions || []).map(function (q) {
            var df = q.proposed && q.answer.charAt(0) !== q.proposed.charAt(0);
            return '<div class="q" id="' + esc(q.anchor) + '"' + idAttr(defs, q.anchor) + '><span class="qid">' + esc(q.id) + '</span><span class="ans" title="' + esc(q.answer) + '">' + esc(q.answer.length > 3 ? q.answer.slice(0, 1) + "…" : q.answer) + '</span><span class="qt" title="' + esc(q.text + (q.answer.length > 3 ? " — " + q.answer : "")) + '">' + esc(q.text) + "</span>" + (df ? '<span class="prop">proposed ' + esc(q.proposed) + "</span>" : "") + "</div>";
          }).join("") + "</div>" : "") + "</div>";
      }).join("") + "</div>";
    }
    return '<section class="card" id="answers" data-sec="answers">' + sectionHead("answers", "Your answers", "kept for reference; Q links land here", open, right) + body + "</section>";
  }

  function designHtml(st, bundle) {
    var d = bundle.design, open = secOpen(st, "design", true), rows = d.rows || [];
    var link = d.bundle ? '<a href="#' + esc(d.bundle) + '" data-nav="' + esc(d.bundle) + '" style="margin-top:10px;font-size:13px">Open the full plan-approval page</a>' : (d.url ? '<a href="' + esc(safeHref(d.url)) + '" target="_blank" rel="noopener">Open the full plan-approval page</a>' : "");
    var body = open ? '<div class="drows">' + rows.map(function (r) {
      return '<div class="drow"><span class="rid">' + esc(r.id) + '</span><span class="dt" title="' + esc(r.title) + '">' + esc(r.title) + '</span><span class="lab" style="' + tone(LABEL_TONE[r.label] || "low") + '">' + esc(r.label) + "</span></div>";
    }).join("") + link + "</div>" : "";
    return '<section class="card design" id="design" data-sec="design">' + sectionHead("design", "The design you approved", "same view as at plan approval · you have seen it", open, '<span class="shown">' + esc(d.counts || plural(rows.length, "row")) + "</span>") + body + "</section>";
  }

  function headerHtml(st, bundle) {
    var h = bundle.header || {}, revs = revisionsIn(bundle);
    var crumbs = '<div class="crumbs"><a href="#" data-nav="">All pages</a><span aria-hidden="true">/</span><span>' + esc(h.project) + '</span><span aria-hidden="true">/</span><span>' + esc(h.intentName || h.intent) + '</span><span aria-hidden="true">/</span><span class="mono">' + esc(h.unit) + "</span>" +
      '<span class="status"><i aria-hidden="true"></i>' + esc(h.status) + "</span></div>";
    var facts = (h.facts || []).map(function (f) { return '<div class="fact"><span>' + esc(f.label) + "</span><b>" + esc(f.value) + "</b>" + (f.note ? "<span>" + esc(f.note) + "</span>" : "") + "</div>"; }).join("");
    var revRow = "";
    if ((h.revision || 1) > 1) {
      var first = (h.revisions || [])[0] || { note: "first draft" };
      revRow = '<div class="revs"><span class="lbl">Revisions:</span><span class="v1"><span class="sw" style="background:var(--control)"></span>v1 ' + esc(first.note) + "</span>" +
        (h.revisions || []).slice(1).map(function (r) {
          var rn = int(r.n), t = revTone(rn), on = st.filter === "v" + rn, n = revs[rn] || 0;
          return '<button type="button" class="revbtn" data-act="filter" data-val="' + (on ? "all" : "v" + rn) + '" aria-pressed="' + on + '" title="' + esc(r.note) + '" style="color:var(--' + t + "-fg);" + (on ? "background:var(--" + t + "-bg);border-color:var(--" + t + "-fg)" : "") + '"><span class="sw" style="background:var(--' + t + '-fg)"></span>v' + rn + " · " + plural(n, "change") + (rn === int(h.revision) ? " (current)" : "") + "</button>";
        }).join("") + '<span class="hint">Changed rows carry their version; press one to see only its changes.</span></div>';
    }
    return '<header class="card head">' + crumbs + '<div class="titlerow"><div><h1>' + esc(pageTitle(h.unit, bundle.page, h.title)) + '</h1><p class="lede">' + esc(h.lede) + "</p></div>" + (facts ? '<div class="facts">' + facts + "</div>" : "") + "</div>" + revRow + "</header>";
  }

  function chipFor(st, bundle, key) {
    var short, count = "", top = "", rev = "";
    if (key === "plan") {
      var steps = bundle.plan.steps || []; short = "Plan";
      count = steps.filter(function (s) { return !isRead(st, stepKey(s), s); }).length + "/" + steps.length;
    } else if (key === "answers") { short = "Answers"; count = String((bundle.answers || []).reduce(function (n, g) { return n + (g.questions || []).length; }, 0)); }
    else if (key === "design") { short = "Approved design"; count = String((bundle.design.rows || []).length); }
    else {
      var s = (bundle.sections || []).filter(function (x) { return x.key === key; })[0], rows = s.rows || [];
      short = s.short; count = rows.filter(function (r) { return !isRead(st, anchor(r.id), r); }).length + "/" + rows.length;
      var lab = rows.some(function (r) { return r.label === "critical"; }) ? "critical" : (rows.some(function (r) { return r.label === "high"; }) ? "high" : "");
      if (lab) top = '<span class="tag" style="' + tone(LABEL_TONE[lab]) + '">' + lab + "</span>";
      var mx = Math.max.apply(null, [0].concat(rows.map(function (r) { return r.rev || 0; })));
      if (mx) { var t = revTone(mx); rev = '<span class="tag" style="background:var(--' + t + "-bg);color:var(--" + t + '-fg)">v' + int(mx) + " ·" + rows.filter(function (r) { return r.rev; }).length + "</span>"; }
    }
    if (key === "plan") {
      var smx = Math.max.apply(null, [0].concat((bundle.plan.steps || []).map(function (s) { return s.rev || 0; })));
      if (smx) { var u = revTone(smx); rev = '<span class="tag" style="background:var(--' + u + "-bg);color:var(--" + u + '-fg)">v' + int(smx) + " ·" + bundle.plan.steps.filter(function (s) { return s.rev; }).length + "</span>"; }
    }
    return '<a class="chip" href="#' + esc(key) + '" data-jump="' + esc(key) + '">' + esc(short) + rev + top + '<span class="count">' + esc(count) + "</span></a>";
  }

  function barHtml(st, bundle, keys) {
    var items = itemsOf(bundle), read = items.filter(function (x) { return isRead(st, x.key, x.item); }).length;
    var pct = items.length ? Math.round(read / items.length * 100) : 100;
    var unitEnd = bundle.page === "unit-end";
    var filters = [["all", "All"], ["look", "Look first"], ["unread", "Unread"], ["top", unitEnd ? "High and core" : "High and critical"]];
    return '<div class="bar" id="bar"><div class="barrow">' +
      '<div class="seg" role="group" aria-label="Detail"><button type="button" data-act="mode" data-val="summary" aria-pressed="' + (st.mode === "summary") + '">Summary</button><button type="button" data-act="mode" data-val="full" aria-pressed="' + (st.mode === "full") + '">Full</button></div>' +
      '<div class="filters" role="group" aria-label="Show">' + filters.map(function (f) { return '<button type="button" class="pill" data-act="filter" data-val="' + f[0] + '" aria-pressed="' + (st.filter === f[0]) + '">' + f[1] + "</button>"; }).join("") + "</div>" +
      '<div class="tools"><span class="progress"><span class="num">Read ' + read + "/" + items.length + '</span><span class="meter" aria-hidden="true"><i style="width:' + pct + '%"></i></span></span>' +
      '<button type="button" class="btn" data-act="expand">Expand all</button><button type="button" class="btn" data-act="collapse">Collapse all</button><button type="button" class="btn wide" data-act="allread">Mark all read</button></div></div>' +
      '<nav class="chips" aria-label="Sections">' + keys.map(function (k) { return chipFor(st, bundle, k); }).join("") + "</nav></div>";
  }

  function footerHtml(st, bundle) {
    var h = bundle.header || {}, items = itemsOf(bundle), read = items.filter(function (x) { return isRead(st, x.key, x.item); }).length;
    var lead = bundle.page === "plan" ? "Approve the plan or ask for changes in chat." : "Approve the Unit or ask for changes in chat.";
    var rest = h.footer || (bundle.page === "plan" ? "Notes you leave on rows go to the agent with your answer." : "Asking for changes here sends the Unit’s stages back for review; the code plan is the cheaper place to push back.");
    return '<footer class="band"><b>' + esc(lead) + "</b><span>" + esc(rest) + '</span><span class="end num">read ' + read + "/" + items.length + "</span></footer>";
  }

  /* A section with nothing to show is left out, with its heading, counts and nav chip: it has no rows, or the filter hides
     every one. A section that says something without rows (the design stays as approved, a map) stays. */
  function hasContent(st, bundle, key) {
    if (key === "plan") { var steps = bundle.plan.steps || []; return steps.some(function (x) { return passes(st, x, stepKey(x), true); }); }
    if (key === "answers") return (bundle.answers || []).length > 0;
    if (key === "design") return !!((bundle.design.rows || []).length || bundle.design.bundle || bundle.design.url);
