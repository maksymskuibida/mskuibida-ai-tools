<title>AI-DLC unit approvals</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  AI-DLC unit approvals — the one template for the two pages of a Unit claimed with the unit-end rhythm:
  the plan approval (every design stage, read once) and the unit-end approval (what was built).

  Published ONCE per developer as a private Artifact with the `db` and `user` capabilities
  (capabilities: {db: {}, user: {}}, icon "checklist"); never regenerated per Unit. Every page is a row
  INSIDE this artifact, written by the agent with the ArtifactData tool (SKILL.md next to this file;
  scripts/unit_bundle.py builds it). The page renders whatever the row says, live.

  Data contract (what the agent writes — always a NEW row, a fresh id per presentation):

    bundles/<id>   {bundle, page: "plan"|"unit-end", unit, intent, title, createdAt (ISO), status: "open"}
      bundle: a gate bundle, as contract/gate-bundle.schema.json and contract/README.md define it.
      id:     the bundle's id, <intent>-<unit>-<page>-v<revision>-<YYYYMMDDTHHMM>.

  Ids. Every id the page shows (US1.1, FR1.4, BR1.2, Q3, R-01, ADR-009, …), in any text, is a link with a tooltip by the
  shared AidlcIds (aidlc-ids.js below; shared/aidlc-ids/README.md is its contract), from the bundle's `ids`. A row or an
  answer that shows an id's definition carries data-aidlc-id, and a link to it opens what holds it and lands there.

  Verification. `verification: {auto}` (optional, unit-end page): how many points the code summary says its automated tests cover. The
    verification funnel (one stacked bar: covered by the tests, verified by you, not verified,
    failed and left as known) starts from it; pressing a part sets the Verification state chip.

  What the page writes:

    bundles/<id>.notes[<row anchor>] = "text"          a note to the agent on a row or a step (step-<n>)
    bundles/<id>.picks[<row anchor>] = "do"|"leave"    the person's lean on a suggestion row
                                       "now"|"later"   on a row of the `unverified` section: Test now or Later; the
                                                       agent's test plan covers the rows picked Test now
    A unit-end page presented after a test plan also holds the sections `verified` (Verified by you), `unverified`
    (Still not verified) and `failed` (Failed, left as known); see contract/README.md.
    data/users/<viewer>/reads-<intent>--<unit>--<page>  {marks: {<row anchor or step key>: <revision read>}}
      Read marks are the viewer's own (localStorage when the user capability is not served), set only with the row's
      read dot (opening a row does not mark it). A row is read when its mark is at least the row's revision, so on a
      new revision only the rows marked with it turn unread.

  Notes and picks reach the agent only when the person answers in chat; the decision itself is given in chat.
  Link to a page: <artifact url>#<id>. No hash: the list of pages.

  The render functions between RENDER-START and RENDER-END use no DOM, so tests render a bundle under Node.
-->

}

* { box-sizing: border-box; }
html { overflow-x: hidden; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--body); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
[hidden] { display: none !important; }
a { color: var(--accent); }
a:hover { color: var(--accent-strong); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }
#app { display: flex; flex-direction: column; gap: 16px; }
.wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

/* header */
.head { display: flex; flex-direction: column; gap: 14px; padding: 20px 24px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; color: var(--muted); font-size: 13px; }
.crumbs a { color: inherit; text-decoration: none; } .crumbs a:hover { text-decoration: underline; }
.maplinks { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-left: auto; font-size: 13px; } .maplinks a { color: var(--accent); text-decoration: none; font-weight: 500; } .maplinks a:hover { text-decoration: underline; }
.status { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 2px 10px; border-radius: 13px; background: var(--warn-bg); color: var(--warn-fg); font-weight: 500; }
.status i { width: 7px; height: 7px; border-radius: 4px; background: var(--warn-dot); }
.titlerow { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px 32px; }
.titlerow > div:first-child { flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; text-wrap: balance; overflow-wrap: anywhere; }
.lede { margin: 0; color: var(--fg-2); line-height: 1.55; max-width: 76ch; }
.facts { display: flex; flex-wrap: wrap; gap: 10px; }
.fact { display: flex; flex-direction: column; gap: 2px; padding: 8px 14px; border-radius: 8px; background: var(--bg); min-width: 108px; }
.fact span { font-size: 12px; color: var(--muted); } .fact b { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.revs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px; border-radius: 8px; background: var(--raised); }
.revs .lbl { font-size: 13px; color: var(--fg-2); }
.revs .v1 { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.revbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid var(--control); background: var(--surface); font-size: 12px; font-weight: 500; }
.revs .hint { font-size: 12px; color: var(--muted); }

/* sticky bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; display: flex; flex-direction: column; gap: 10px; padding: 10px 14px; background: color-mix(in srgb, var(--surface) 96%, transparent); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 2px 8px rgba(23, 26, 33, .06); backdrop-filter: blur(6px); }
.barrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.seg { display: inline-flex; padding: 3px; border-radius: 8px; background: var(--line-soft); }
.seg button { height: 30px; padding: 0 14px; border: 0; border-radius: 6px; background: transparent; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 2px rgba(23, 26, 33, .12); }
.filters { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.pill { height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid var(--control); background: var(--surface); font-weight: 500; }
.pill[aria-pressed="true"] { background: var(--fg); color: var(--surface); border-color: var(--fg); }
.tools { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.progress { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; color: var(--fg-2); }
.meter { width: 100px; height: 6px; border-radius: 3px; background: var(--line-soft); overflow: hidden; display: block; }
.meter i { display: block; height: 6px; background: var(--accent); }
.btn { height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--control); background: var(--surface); }
.btn:hover, .pill:hover, .revbtn:hover { border-color: var(--accent); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 16px; border: 1px solid var(--control); background: var(--surface); color: var(--fg); text-decoration: none; font-size: 13px; white-space: nowrap; }
.chip:hover { border-color: var(--accent); color: var(--fg); }
.chip .count { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; white-space: nowrap; }

/* sections and rows */
main { display: flex; flex-direction: column; gap: 16px; }
section.card { overflow: hidden; scroll-margin-top: calc(var(--bar-h) + 16px); }
.sechead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; min-height: 52px; padding: 6px 16px 6px 8px; }
.sechead:hover, .rowhead:hover { background: var(--hover); }
.twist { flex: none; width: 32px; height: 32px; border: 0; border-radius: 6px; background: transparent; display: inline-flex; align-items: center; justify-content: center; }
.twist svg { transition: transform .12s; } .twist[aria-expanded="true"] svg { transform: rotate(90deg); }
h2 { flex: 1 1 240px; min-width: 0; margin: 0; font-size: 15px; font-weight: 600; }
h2 button { width: 100%; min-height: 36px; border: 0; padding: 0; background: transparent; text-align: left; font-weight: 600; }
h2 .hint { margin-left: 8px; font-weight: 400; font-size: 13px; color: var(--muted); }
.counts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.lc { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 7px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.lc b { font-family: var(--mono); font-weight: 500; }
.nsettled { opacity: .55; } .nsettled:hover, .nsettled:focus-within { opacity: 1; }
.pill .n { margin-left: 6px; font: 12px var(--mono); opacity: .7; }
.ready { display: inline-flex; align-items: center; gap: 2px; font-size: 13px; color: var(--fg-2); }
.ready .sep { color: var(--muted); }
.rdy { min-height: 28px; height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid var(--control); background: var(--surface); color: var(--fg); font-weight: 500; font-size: 13px; }
.rdy:hover { border-color: var(--accent); }
.rdy.ok { background: var(--ok-bg); color: var(--ok-fg); border-color: transparent; }
.rech { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; margin: 0; padding: 12px 18px 0; font-size: 13px; font-weight: 600; color: var(--fg-2); } .rech .hint { font-weight: 400; font-size: 12px; color: var(--muted); }
.tag.why { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 10px; font-size: 11.5px; font-weight: 500; background: var(--raised); color: var(--fg-2); }
.answerbody { padding: 12px 18px 16px; } .answernote { margin: 0; color: var(--fg-2); } .ansleft { margin: 10px 0 0; color: var(--warn-fg); font-weight: 500; font-size: 13px; }
.ansg { margin-top: 14px; } .ansg h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--fg-2); display: flex; gap: 8px; align-items: baseline; } .ansg h3 b { font: 12px var(--mono); color: var(--muted); font-weight: 400; }
.ansg ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ansg li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 6px 10px; border: 1px solid var(--line-soft); border-radius: 8px; } .ansn { flex: 1 1 100%; font-size: 13px; color: var(--fg-2); white-space: pre-wrap; overflow-wrap: anywhere; } .empty0 { color: var(--muted); margin: 10px 0 0; }
.shown { margin-left: 4px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.secbody { border-top: 1px solid var(--line); }
.empty { margin: 0; padding: 14px 16px; color: var(--muted); }
.asapproved { margin: 0; padding: 14px 16px; display: flex; align-items: center; gap: 10px; color: var(--ok-fg); font-weight: 500; }
.row { border-bottom: 1px solid var(--line-soft); scroll-margin-top: calc(var(--bar-h) + 16px); }
.row:last-child { border-bottom: 0; }
.rowhead { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px 0 8px; }
.rid { flex: none; width: 64px; font-family: var(--mono); font-size: 12px; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rtitle { flex: 1; min-width: 0; height: 36px; border: 0; padding: 0; background: transparent; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; color: var(--fg); }
.row.read .rtitle, .step.read .rtitle { font-weight: 400; color: var(--muted); }
.look { flex: none; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--accent); color: var(--accent); white-space: nowrap; }
.where { flex: none; width: 104px; font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.where.path { font-family: var(--mono); width: 150px; }
.lab { flex: none; width: 66px; text-align: center; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 3px 0; border-radius: 4px; }
.layer { flex: none; width: 66px; text-align: center; font-size: 11px; font-weight: 500; padding: 3px 0; border-radius: 4px; }
.vchips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px 4px; }
.vchip { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid var(--line); background: var(--surface); color: var(--fg-2); font-size: 13px; cursor: pointer; }
.vchip b { font-family: var(--mono); font-weight: 500; color: var(--muted); }
.vchip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.tag.vst { flex: none; }
.secdot { margin-left: 4px; }
.dot { flex: none; width: 32px; height: 32px; border: 0; border-radius: 6px; background: transparent; display: inline-flex; align-items: center; justify-content: center; }
.dot i { width: 10px; height: 10px; border-radius: 5px; background: var(--accent); border: 2px solid var(--accent); }
.read > .rowhead .dot i { background: transparent; border-color: var(--control); }
.rowbody { display: flex; flex-direction: column; gap: 10px; padding: 2px 16px 16px 114px; }
.rowbody > * { max-width: 780px; }
.rowbody p { margin: 0; line-height: 1.55; color: var(--fg); }
.revnote { padding: 8px 10px; border-radius: 6px; font-size: 13px; line-height: 1.5; }
.refs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.refs > span { font-size: 12px; color: var(--muted); }
.ref { position: relative; display: inline-flex; align-items: center; min-height: 24px; padding: 0 7px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); font-family: var(--mono); font-size: 12px; text-decoration: none; white-space: nowrap; }
.ref:hover { color: var(--accent-strong); filter: brightness(.97); }
/* a design id among the references: the shared link, in the reference chip's look */
.refs a.aidlc-id { display: inline-flex; align-items: center; min-height: 24px; padding: 0 7px; border-radius: 5px; background: var(--accent-soft); font-family: var(--mono); font-size: 12px; }
.refs a.aidlc-id.aidlc-id-unknown { background: var(--line-soft); }
a.aidlc-id:hover { color: var(--accent-strong); }
/* the one tooltip: every reference and every id link, on hover and on keyboard focus */
#tip { position: fixed; z-index: 30; max-width: min(360px, calc(100vw - 24px)); padding: 8px 10px; border-radius: 6px; background: var(--tip-bg); color: var(--tip-fg); border: 1px solid var(--tip-line); font: 12px/1.45 var(--body); pointer-events: none; box-shadow: 0 4px 14px rgba(0, 0, 0, .18); }
.covered { font-size: 12px; padding: 2px 8px; border-radius: 4px; }
.handled { flex: none; display: inline-flex; align-items: center; gap: 4px; max-width: 190px; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none; }
.handled.ok { background: var(--ok-bg); color: var(--ok-fg); }
.handled.accepted { background: var(--warn-bg); color: var(--warn-fg); }
.handled.open { background: var(--crit-bg); color: var(--crit-fg); }

<script>
/* aidlc-ids.js:begin */
/* The ids an AI-DLC page shows (US1.1, AC1.1.2, FR1.4, NFR3, BR1.2, Q4, U31, C2, ADR-009, R-01, ...), each a link with
   a tooltip saying what it is. Shared: the canonical copy is shared/aidlc-ids/aidlc-ids.js in mskuibida-ai-tools,
   copied into every page by scripts/sync-shared.py. Edit it there.

   The page gives it a map of what each id is, `ids` = {"FR1.4": {kind, title, text, doc}}, the output of
   `aidlc_ids.py refs` written with the page's data, and marks each element that shows an id's own definition with
   data-aidlc-id="<id>". Then:

     AidlcIds.linkify(root, ids, { toast: fn })   turn every id in root's text into a link; run after each render
     AidlcIds.observe(root, getIds, { toast: fn }) the same, again whenever root's content changes

   A link whose id is shown in the page jumps there and flashes it. One that is not shown still looks like a link: its
   tooltip says what it is, and a click shows a toast that it is not in this page. An id no document defines says so.
   The tooltip is the page's own: the link carries data-tip and aria-label, which every page's tooltip reads. */
var AidlcIds = (function () {
  "use strict";
  var ID = /(^|[^\w-])([A-Z][A-Z]{0,4}-?\d+[a-z]?(?:[.-]\d+[a-z]?)*(?:-[A-Z]{1,4}\d+[a-z]?)?)(?![\w-])/g;
  var NOT_IDS = /^(UTF-?\d+|SHA-?\d+|ISO-?\d+|RFC-?\d+|HTTP-?\d+|TLS-?\d|H[1-6]|V\d+|X\d+|P\d|ES\d+|ID\d*)$/;
  var KINDS = { US: "Story", AC: "Acceptance criterion", FR: "Functional requirement", NFR: "Non-functional requirement",
    BR: "Business rule", Q: "Question", U: "Unit", C: "Contract", E: "External interface", ADR: "Decision record",
    R: "Review finding", D: "Decision", DR: "Design rule", S: "Screen", M: "Mockup", T: "Task" };
  var SKIP = "a, button, code, pre, script, style, textarea, input, select, option, [data-aidlc-noids]";

  function prefix(id) { return (/^[A-Z]+/.exec(id) || [""])[0]; }
  function docName(doc) { return String(doc || "").split("/").pop(); }

  function anchorOf(id) {
    var css = window.CSS && CSS.escape ? CSS.escape(id) : id.replace(/["\\]/g, "\\$&");
    return document.querySelector('[data-aidlc-id="' + css + '"]');
  }

  /** The tooltip of an id: what it is, in plain words, and where it is written. */
  function tip(id, def) {
    if (!def) return id + ": not found in this project's documents.";
    var kind = def.kind || KINDS[prefix(id)] || "";
    var head = (kind ? kind + " " : "") + id + (def.title ? ": " + def.title : "");
    var body = def.text && def.text !== def.title ? " " + def.text : "";
    return head + (/[.!?…]$/.test(head) || !body ? "" : ".") + body + (def.doc ? " (" + docName(def.doc) + ")" : "");
  }

  /** Whether a word is an id this page knows of, or looks like one of a kind it knows. */
  function isId(word, ids, prefixes) {
    if (NOT_IDS.test(word)) return false;
    return Object.prototype.hasOwnProperty.call(ids, word) || prefixes[prefix(word)] === true;
  }

  function linkify(root, ids, opts) {
    if (!root) return;
    ids = ids || {};
    opts = opts || {};
    var prefixes = {};
    Object.keys(ids).forEach(function (k) { prefixes[prefix(k)] = true; });
    Object.keys(KINDS).forEach(function (k) { prefixes[k] = true; });
    // Keys of the page's own map that are not id-shaped (a form's q1, a card's f-3) are linked by their exact text.
    var own = Object.keys(ids).filter(function (k) { return !/^[A-Z]/.test(k) && /^[\w.-]+$/.test(k); })
      .sort(function (a, b) { return b.length - a.length; })
      .map(function (k) { return k.replace(/[.-]/g, "\\$&"); });
    var OWN = own.length ? new RegExp("(^|[^\\w-])(" + own.join("|") + ")(?![\\w-])", "g") : null;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        if (!n.nodeValue || !(OWN ? /\d/ : /[A-Z]-?\d/).test(n.nodeValue)) return NodeFilter.FILTER_REJECT;
        var p = n.parentElement;
        return p && !p.closest(SKIP) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      }
    });
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function (node) {
      var text = node.nodeValue, last = 0, frag = null, m;
      var self = node.parentElement.closest("[data-aidlc-id]");
      var found = [];
      [ID, OWN].forEach(function (re) {
        if (!re) return;
        re.lastIndex = 0;
        while ((m = re.exec(text))) found.push({ word: m[2], start: m.index + m[1].length, own: re === OWN });
      });
      found.sort(function (a, b) { return a.start - b.start; });
      for (var i = 0; i < found.length; i++) {
        var word = found[i].word, start = found[i].start;
        if (start < last) continue;
        if (!found[i].own && !isId(word, ids, prefixes)) continue;
        if (self && self.getAttribute("data-aidlc-id") === word) continue;
        frag = frag || document.createDocumentFragment();
        frag.appendChild(document.createTextNode(text.slice(last, start)));
        var a = document.createElement("a");
        var def = ids[word];
        a.className = "aidlc-id" + (def ? "" : " aidlc-id-unknown");
        a.href = "#" + encodeURIComponent(word);
        a.textContent = word;
        a.setAttribute("data-aidlc-ref", word);
        a.setAttribute("data-tip", tip(word, def));
        a.setAttribute("aria-label", tip(word, def));
        frag.appendChild(a);
        last = start + word.length;
      }
      if (frag) {
        frag.appendChild(document.createTextNode(text.slice(last)));
        node.parentNode.replaceChild(frag, node);
      }
    });
    markLive(root);
    bind(root, opts);
  }

  /** Links whose id is shown in the page get the live look; the rest the out-of-page one. */
  function markLive(root) {
    Array.prototype.forEach.call(root.querySelectorAll("a.aidlc-id"), function (a) {
      a.classList.toggle("aidlc-id-out", !anchorOf(a.getAttribute("data-aidlc-ref")));
    });
  }

  function bind(root, opts) {
    if (root.__aidlcIds) { root.__aidlcIds.opts = opts; return; }
    root.__aidlcIds = { opts: opts };
    root.addEventListener("click", function (e) {
      var a = e.target.closest && e.target.closest("a.aidlc-id");
      if (!a || !root.contains(a)) return;
      e.preventDefault();
      var id = a.getAttribute("data-aidlc-ref"), target = anchorOf(id);
      var say = root.__aidlcIds.opts.toast || function (t) { window.alert(t); };
      if (target) {
        var closed = target.closest("details:not([open])");
        if (closed) closed.open = true;
        target.scrollIntoView({ behavior: "smooth", block: "center" });
        target.classList.remove("aidlc-flash");
        void target.offsetWidth;
        target.classList.add("aidlc-flash");
        if (target.tabIndex < 0 && !target.hasAttribute("tabindex")) target.setAttribute("tabindex", "-1");
        target.focus({ preventScroll: true });
      } else if (a.classList.contains("aidlc-id-unknown")) {
        say(id + " isn't defined in this project's documents.");
      } else {
        say(id + " isn't in this page. What it is: in its tooltip.");
      }
    });
  }

  function observe(root, getIds, opts) {
    if (!root) return;
    var busy = false;
    var run = function () {
      if (busy) return;
      busy = true;
      try { linkify(root, getIds(), opts); } finally { busy = false; }
    };
    run();
    new MutationObserver(function () { if (!busy) window.requestAnimationFrame(run); })
      .observe(root, { childList: true, subtree: true, characterData: true });
  }

  return { linkify: linkify, observe: observe, tip: tip, KINDS: KINDS };
})();
/* aidlc-ids.js:end */
</script>
<script>
/* rev-diff.js:begin */
/* Shared: the canonical copy is shared/rev-diff/rev-diff.js; scripts/sync-shared.py copies it into every page that
   carries the block. What changed between two rounds of a page, shown in the page itself: words inserted are
   highlighted (.rv-ins), words removed are struck and muted (.rv-del), a block or element that is gone stays as a struck
   ghost (.rv-gone / .rv-removed), a new one is marked (.rv-new). It works on what a page already drew, so every view a
   page has gets the same diff: the page draws the earlier round the same way, off screen, and hands both trees here.

     RevDiff.diff(a, b, maxD)        Myers diff of two arrays of strings: [{t: "=" | "-" | "+", a0, a1, b0, b1}], or
                                     null when they differ in more than maxD places (the caller shows a whole replacement)
     RevDiff.words(old, now)         word-level segments [{t, s}] of two strings, cleaned up to read well
     RevDiff.markText(el, old, o)    mark the words of el that differ from the string old, in place; {ins, del}
     RevDiff.markTree(now, old, o)   mark every text block of the tree now against the tree old; {ins, del}
     RevDiff.diffKeyed(now, old, o)  match keyed parts (sections, elements) by key, then title; changed ones recurse,
                                     new ones are marked, gone ones are handed to o.onRemoved; the rest goes to markTree
     RevDiff.attributeText(texts, rounds)  the latest text of a chain of rounds as [{r, s}]: r is the round that last wrote s
     RevDiff.attributeTree(now, olds, rounds, o)  the same on a tree: marks each round's words and blocks in its colour
     RevDiff.unmark(root)           take the Changes marks off a tree again
     RevDiff.legend(rounds, counts, only) / only(root, k) / toggleOnly(root, btn, cur)  the legend chips and their filter
     RevDiff.stops(root)             the changes in reading order, one stop per block, for next / previous
     RevDiff.reveal(node)            open every <details> around node, scroll to it and flash it
     RevDiff.pref() / setPref(v)     "show" | "clean" (the default): the viewer's choice, kept in this browser
   Standard browser APIs only; a page must not load a diff library for it. */
var RevDiff = (function () {
  "use strict";
  var WORD = /[\p{L}\p{N}_]+|\s+|[^\s\p{L}\p{N}_]/gu;
  var IS_WORD = /[\p{L}\p{N}]/u;
  var BLOCK = "p, li, td, th, h1, h2, h3, h4, h5, h6, pre, dt, dd, blockquote, figcaption, summary, caption, div";
  var CHROME = "button, svg, script, style, textarea, input, select, .rv-del, .rv-gone, .rv-removed, .rv-tag, [data-rv-skip]";
  var MAX_D = 1500;

  /* ---------- the core: Myers' O(ND) diff, prefix and suffix trimmed first ---------- */
  function diff(a, b, maxD) {
    maxD = maxD == null ? MAX_D : maxD;
    var n = a.length, m = b.length, pre = 0, suf = 0;
    while (pre < n && pre < m && a[pre] === b[pre]) pre++;
    while (suf < n - pre && suf < m - pre && a[n - 1 - suf] === b[m - 1 - suf]) suf++;
    var A = a.slice(pre, n - suf), B = b.slice(pre, m - suf), N = A.length, M = B.length;
    var moves = [];  /* [t, count] in order, over A and B */
    if (!N && !M) moves = [];
    else if (!N) moves = [["+", M]];
    else if (!M) moves = [["-", N]];
    else {
      var max = N + M, off = max + 1, v = new Int32Array(2 * max + 3), trace = [], d, k, x, y, found = -1;
      v[off + 1] = 0;
      for (d = 0; d <= max; d++) {
        if (d > maxD) return null;
        var snap = new Int32Array(2 * d + 3);
        for (k = -d - 1; k <= d + 1; k++) snap[k + d + 1] = v[off + k];
        trace.push(snap);
        for (k = -d; k <= d; k += 2) {
          if (k === -d || (k !== d && v[off + k - 1] < v[off + k + 1])) x = v[off + k + 1];
          else x = v[off + k - 1] + 1;
          y = x - k;
          while (x < N && y < M && A[x] === B[y]) { x++; y++; }
          v[off + k] = x;
          if (x >= N && y >= M) { found = d; break; }
        }
        if (found >= 0) break;
      }
      /* walk back: each d adds one insert or delete, then a snake of equal items */
      var path = []; x = N; y = M;
      for (d = found; d > 0; d--) {
        var t = trace[d], at = function (kk) { return t[kk + d + 1]; };
        k = x - y;
        var down = k === -d || (k !== d && at(k - 1) < at(k + 1));
        var pk = down ? k + 1 : k - 1, px = at(pk), py = px - pk;
        while (x > px + (down ? 0 : 1) && y > py + (down ? 1 : 0)) { path.push("="); x--; y--; }
        path.push(down ? "+" : "-");
        x = px; y = py;
      }
      while (x > 0 && y > 0) { path.push("="); x--; y--; }
      path.reverse();
      path.forEach(function (p) { var last = moves[moves.length - 1]; if (last && last[0] === p) last[1]++; else moves.push([p, 1]); });
    }
    var out = [], ia = 0, ib = 0;
    var push = function (t, c) {
      var r = { t: t, a0: ia, a1: ia, b0: ib, b1: ib };
      if (t !== "+") { ia += c; r.a1 = ia; }
      if (t !== "-") { ib += c; r.b1 = ib; }
      var last = out[out.length - 1];
      if (last && last.t === t) { last.a1 = r.a1; last.b1 = r.b1; } else out.push(r);
    };
    if (pre) push("=", pre);
    moves.forEach(function (mv) { push(mv[0], mv[1]); });
    if (suf) push("=", suf);
    return out;
  }

  /* ---------- words ---------- */
  function tokens(s) { return String(s || "").match(WORD) || []; }
  var keyOf = function (t) { return /^\s+$/.test(t) ? " " : t; };
  function countWords(s) { return tokens(s).filter(function (t) { return IS_WORD.test(t); }).length; }
  function norm(s) { return String(s || "").replace(/\s+/g, " ").trim(); }

  /* Segments of now against old: "=" kept, "-" removed (from old), "+" added. A short run kept between two changes
     (a space, a comma, one short word) joins them, so a reworded phrase reads as one removal and one insertion. */
  function words(old, now) {
    var a = tokens(old), b = tokens(now);
    var runs = diff(a.map(keyOf), b.map(keyOf));
    if (!runs) return [{ t: "-", s: a.join("") }, { t: "+", s: b.join("") }];
    var segs = runs.map(function (r) { return { t: r.t, s: r.t === "-" ? a.slice(r.a0, r.a1).join("") : b.slice(r.b0, r.b1).join("") }; });
    var changed = function (s) { return s && s.t !== "="; };
    for (var i = 1; i < segs.length - 1; i++) {
      var s = segs[i];
      if (s.t !== "=" || !changed(segs[i - 1]) || !changed(segs[i + 1])) continue;
      if (/^\s*$/.test(s.s) || (s.s.length <= 3 && !/\s/.test(s.s.trim()))) s.t = "~";  /* both sides keep it, as part of the change */
    }
    /* group each maximal change run into one removal then one insertion */
    var out = [], del = "", ins = "";
    var flush = function () { if (del) out.push({ t: "-", s: del }); if (ins) out.push({ t: "+", s: ins }); del = ins = ""; };

      if (k === "plan") { ((bundle.plan || {}).steps || []).forEach(function (x) { out.push({ key: stepKey(x), anchor: "step-" + int(x.n), item: x, sec: "plan", isStep: true }); }); return; }

    });

    if (/^v\d+$/.test(f)) { var v = +f.slice(1); return item.rev === v || (isStep && (item.subs || []).some(function (s) { return s.rev === v; })); }

  /* key: the read mark's key (a row's anchor; a step's source, so a renumbered step keeps its mark); anchor: the jump target. */
  function itemsOf(bundle) {

  function revisionsIn(bundle) {

    return seen;
  }

  /* ---------- pieces ---------- */
  function labelChip(label, count) { return '<span class="lc" style="' + tone(LABEL_TONE[label] || "low") + '">' + esc(label) + "<b>" + count + "</b></span>"; }
  function revBadge(item, extra) {
    if (!item.rev) return "";

    return '<span class="tag' + (extra || "") + '" style="background:var(--' + t + "-bg);color:var(--" + t + '-fg)">v' + int(item.rev) + " " + (item.revKind === "new" ? "new" : "changed") + "</span>";
  }
  /* An id the shared AidlcIds links: the same shape as its matcher (US1.1, FR1.4, BR1.2, R-01, ADR-009, U3-SD2). */
  var IDISH = /^[A-Z][A-Z]{0,4}-?\d+[a-z]?(?:[.-]\d+[a-z]?)*(?:-[A-Z]{1,4}\d+[a-z]?)?$/;
  /* The project id a row or an answer shows the definition of ("FD R-06" shows R-06), only when no other row or answer
     of the page claims the same id: every stage has its own R-01 and its own Q1. {anchor: id} */
  function definedIds(bundle) {
    var byId = {}, out = {};
    var add = function (id, key) { id = String(id || "").split(" ").pop(); if (IDISH.test(id)) (byId[id] = byId[id] || []).push(key); };
    sectionsOf(bundle).forEach(function (s) { (s.rows || []).forEach(function (r) { add(r.id, anchor(r.id)); }); });
    (bundle.answers || []).forEach(function (g) { (g.questions || []).forEach(function (q) { add(q.id, q.anchor); }); });
    Object.keys(byId).forEach(function (id) { if (byId[id].length === 1) out[byId[id][0]] = id; });
    return out;
  }
  function idAttr(defs, key) { return defs[key] ? ' data-aidlc-id="' + esc(defs[key]) + '"' : ""; }
  /* The map AidlcIds links from: the bundle's `ids` (aidlc_ids.py refs), and, for an id the bundle has no entry for,
     what the page knows of it: the tip of a reference to it, or the row that defines it. */
  function idMap(bundle) {
    var out = {}, defs = definedIds(bundle);
    var fromRef = function (x) { var l = String(x.label || ""); if (IDISH.test(l) && !out[l]) out[l] = { title: String(x.tip || ""), doc: String(x.target || "").indexOf("path:") === 0 ? String(x.target).slice(5).replace(/#.*/, "") : "" }; };
    sectionsOf(bundle).forEach(function (s) { (s.rows || []).forEach(function (r) {
      var id = defs[anchor(r.id)]; if (id && !out[id]) out[id] = { title: String(r.title || "") };
      (r.refs || []).forEach(fromRef);
    }); });

    (bundle.answers || []).forEach(function (g) { (g.questions || []).forEach(function (q) { var id = defs[q.anchor]; if (id && !out[id]) out[id] = { title: String(q.text || ""), text: "Your answer: " + String(q.answer || ""), doc: g.file }; }); });

  }

    if (t.charAt(0) === "#") { href = safeHref(t); data = ' data-jump="' + esc(href.slice(1)) + '"'; }
    else if (/^https?:\/\//i.test(t)) href = t;

  }
  function noteBox(st, key, placeholder, suggestion) {

    return '<div class="notebox"><label for="nt-' + esc(key) + '">Note to the agent<textarea id="nt-' + esc(key) + '" rows="2" data-note="' + esc(key) + '" placeholder="' + esc(placeholder) + '">' + esc(note) + '</textarea><span class="notestat" id="ns-' + esc(key) + '">' + esc(st.noteStat[key] || "") + "</span></label>" + picks + "</div>";
  }

  /* The pick on a not-verified row: Test now or Later. It decides which rows the agent's test plan covers. */
  function testPick(st, key) {

  /* Where a finding, requirement or NFR is handled: a linked row passes (a green chip that opens where), an accepted

  function handledChip(r, bundle) {

      return refHtml({ label: "\u2713 " + label, tip: c.text, target: t }, bundle).replace('class="ref"', 'class="handled ok"');
    }
    if (c.acceptanceReason) return '<span class="handled accepted" title="' + esc(c.acceptanceReason.text) + '">Accepted, reason below</span>';

  }
  function reasonLine(r) {

  }

  function rowHtml(st, bundle, sec, r) {
    var key = anchor(r.id), read = isRead(st, rowKey(r), r), open = isOpen(st, key, read);
    var t = r.rev ? revTone(r.rev) : null, vs = r._state ? VSTATE[r._state] : null;

      '<button type="button" class="twist" data-act="row" data-key="' + esc(key) + '" aria-expanded="' + open + '" aria-label="' + (open ? "Collapse " : "Expand ") + esc(r.id) + '">' + CHEVRON + "</button>" +
      '<span class="rid" title="' + esc(r.id) + '">' + esc(r.id) + "</span>" +
      '<button type="button" class="rtitle" data-act="row" data-key="' + esc(key) + '" title="' + esc(r.title) + '">' + esc(r.title) + "</button>" +

      (r.where ? '<span class="where' + (r.whereIsPath ? " path" : "") + '" title="' + esc(r.where) + '">' + esc(r.where) + "</span>" : "") +
      (vs ? '<span class="tag vst" style="' + tone(vs[1]) + '">' + esc(vs[0]) + "</span>" : "") +
      ((r._state || sec.kind) === "unverified" ? testPick(st, key) : "") +
      '<span class="lab" style="' + tone(LABEL_TONE[r.label] || "low") + '">' + esc(r.label) + "</span>" +
      '<button type="button" class="dot" data-act="read" data-key="' + esc(key) + '" aria-label="Mark ' + esc(r.id) + (read ? " unread" : " read") + '" title="Mark ' + (read ? "unread" : "read") + '"><i></i></button></div>';

  /* a section's own dot is derived: read when every row (step) in it is, and pressing it marks or unmarks them all */
  function secDot(st, bundle, key, title) {

  }
  function sectionHead(key, title, hint, open, right) {
    return '<div class="sechead"><button type="button" class="twist" data-act="sec" data-key="' + esc(key) + '" aria-expanded="' + open + '" aria-label="' + (open ? "Collapse " : "Expand ") + esc(title) + '">' + CHEVRON + "</button>" +
      '<h2><button type="button" data-act="sec" data-key="' + esc(key) + '">' + esc(title) + (hint ? ' <span class="hint">' + esc(hint) + "</span>" : "") + "</button></h2>" +

  }

  function labelCounts(rows, kinds) {
    return kinds.map(function (k) { var n = rows.filter(function (r) { return r.label === k; }).length; return n ? labelChip(k, n) : ""; }).join("") +
      Object.keys(rows.reduce(function (m, r) { if (r.rev) m[r.rev] = 1; return m; }, {})).sort().map(function (v) {

  function mapHtml(m) {
    var nodes = m.nodes || [], edges = m.edges || [], layer = {}, i, changed = true, guard = 0;

    while (changed && guard++ < 50) {

    }

      return '<path class="edge" d="' + d + '" marker-end="url(#arrow)"></path>' + (e.label ? '<text class="edgelabel" x="' + (mx) + '" y="' + ((y1 + y2) / 2 - 6) + '" text-anchor="middle">' + esc(e.label) + "</text>" : "");

    }).join("");
    return '<div class="mapwrap"><span>' + esc(m.caption || "How the pieces connect: dark boxes matter most; dashed ones already existed.") + '</span><div class="mapscroll"><div class="map" style="width:' + width + "px;height:" + height + 'px">' +
      '<svg width="' + width + '" height="' + height + '" aria-hidden="true"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"></path></marker></defs>' + lines + "</svg>" + boxes + "</div></div></div>";
  }

  /* The verification funnel: the points the code's own tests cover, then the ones you verified, the ones still not verified and
     the failed ones left as known: one bar, a second view of the points below. Pressing a part is pressing its state chip. */
  function funnelHtml(st, bundle, rows) {
    var f = { auto: (bundle.verification || {}).auto || 0, verified: 0, unverified: 0, failed: 0 };
    rows.forEach(function (r) { if (f[r._state] != null) f[r._state]++; });
    f.total = f.auto + f.verified + f.unverified + f.failed;
    if (["auto", "verified", "unverified", "failed"].filter(function (k) { return f[k]; }).length < 2) return "";
    var on = VKINDS.filter(function (k) { return (st.vstate || {})[k]; });
    f.active = on.length === 1 ? on[0] : "";
    return GateViz.funnel(f);
  }
  function sectionHtml(st, bundle, s) {
    var rows = sortRows(s.rows || []), kinds = s.kind === "built" ? WEIGHTS : SEVERITY;
    var vsel = st.vstate || {}, anyV = s.merged && VKINDS.some(function (k) { return vsel[k]; });
    var shownRows = rows.filter(function (r) { return passes(st, r, rowKey(r), false) && (!anyV || vsel[r._state]); });
    var open = secOpen(st, s.key, true);
    var right = labelCounts(rows, kinds) + '<span class="shown">' + (st.filter === "all" && !anyV ? rows.length : shownRows.length + "/" + rows.length) + "</span>" + secDot(st, bundle, s.key, s.title);
    var body = "";
    var chips = !s.merged ? "" : '<div class="vchips" role="group" aria-label="Show points that are">' + VKINDS.filter(function (k) { return rows.some(function (r) { return r._state === k; }); }).map(function (k) {
      return '<button type="button" class="vchip" data-act="vstate" data-val="' + k + '" aria-pressed="' + !!vsel[k] + '">' + esc(VSTATE[k][0]) + '<b>' + rows.filter(function (r) { return r._state === k; }).length + "</b></button>";
    }).join("") + "</div>";
    if (open) {

    }

  }

  function stepHtml(st, bundle, step) {
    var key = "step-" + int(step.n), read = isRead(st, stepKey(step), step), open = isOpen(st, key, read), t = step.rev ? revTone(step.rev) : null;
    var lt = LAYER_TONE[step.layer] || "low";
    var head = '<div class="rowhead"><button type="button" class="twist" data-act="row" data-key="' + key + '" aria-expanded="' + open + '" aria-label="' + (open ? "Collapse" : "Expand") + " step " + int(step.n) + '">' + CHEVRON + "</button>" +
      '<span class="rid">Step ' + int(step.n) + "</span>" +
      '<button type="button" class="rtitle" data-act="row" data-key="' + key + '" title="' + esc(step.title) + '">' + esc(step.title) + "</button>" + revBadge(step) +
      '<span class="layer" style="' + tone(lt) + '">' + esc(step.layer) + "</span>" +
      '<span class="where num">' + plural(step.files, "file") + "</span>" +
      '<span class="where wide">' + ((step.implements || []).length ? plural(step.implements.length, "design pt", "design pts") : "") + "</span>" +
      '<button type="button" class="dot" data-act="read" data-key="' + key + '" aria-label="Mark step ' + int(step.n) + (read ? " unread" : " read") + '"><i></i></button></div>';
    var body = "";
    if (open) {
      body = '<div class="rowbody">' + (step.rev && step.revNote ? '<p class="revnote" style="background:var(--' + t + "-bg);color:var(--" + t + '-fg)">' + esc(step.revNote) + "</p>" : "") +
        '<ol class="subs">' + (step.subs || []).map(function (s) {
          if (!s.rev) return "<li>" + esc(s.text) + "</li>";
          var u = revTone(s.rev);
          return '<li style="background:var(--' + u + '-bg)">' + esc(s.text) + '<span class="sv" style="color:var(--' + u + '-fg)">v' + int(s.rev) + "</span></li>";
        }).join("") + "</ol>" +
        ((step.implements || []).length ? '<div class="refs"><span>Implements</span>' + step.implements.map(function (x) { return refHtml(x, bundle); }).join("") + "</div>" : "") +
        noteBox(st, key, "Only if this step should change", false) + "</div>";
    }
    return '<div class="row step' + (read ? " read" : "") + '" id="' + key + '" style="' + (t ? "background:var(--" + t + "-tint)" : "") + '">' + head + body + "</div>";
  }

  /* The steps grouped by layer, in build order; with one layer the list is enough. A step's place links to its row. */
  function lanesHtml(steps) {
    var order = [], by = {};
    steps.slice().sort(function (x, y) { return int(x.n) - int(y.n); }).forEach(function (s) {  /* the plan is in build order: a lane sits where its first step does */
      if (!by[s.layer]) { by[s.layer] = { name: s.layer, steps: [] }; order.push(s.layer); }

      return '<div class="drow"><span class="rid">' + esc(r.id) + '</span><span class="dt" title="' + esc(r.title) + '">' + esc(r.title) + '</span><span class="lab" style="' + tone(LABEL_TONE[r.label] || "low") + '">' + esc(r.label) + "</span></div>";

  }
  function recordsHtml(st, bundle) {
    var open = secOpen(st, "records", false), nq = (bundle.answers || []).reduce(function (n, g) { return n + (g.questions || []).length; }, 0);
    var differ = 0; (bundle.answers || []).forEach(function (g) { (g.questions || []).forEach(function (q) { if (q.proposed && q.answer.charAt(0) !== q.proposed.charAt(0)) differ++; }); });
    var right = (differ ? '<span class="lc" style="' + tone("warn") + '">differs from proposal<b>' + differ + "</b></span>" : "") + '<span class="shown">' + [(bundle.answers || []).length ? plural(nq, "answer") : "", bundle.design ? "approved design" : ""].filter(Boolean).join(" · ") + "</span>";
    return '<section class="card records" id="records" data-sec="records">' + sectionHead("records", "Records", "your answers and the approved design, as written", open, right) +

  /* Your answer: what you picked and wrote, grouped as it reaches the agent. Read-only; stores nothing. */

      { id: "suggestions", title: "Suggestion picks", rows: w.filter(function (x) { return !x.isStep && x.item.suggestion && (pk[x.anchor] === "do" || pk[x.anchor] === "leave"); }).map(function (x) { return [x, pk[x.anchor] === "do" ? "Do it" : "Leave it"]; }) },
      { id: "tests", title: "Test picks", rows: w.filter(function (x) { return !x.isStep && (x.item._state || x.kind) === "unverified" && (pk[x.anchor] === "now" || pk[x.anchor] === "later"); }).map(function (x) { return [x, pk[x.anchor] === "now" ? "Test now" : "Later"]; }) },

  function hasContent(st, bundle, key) {

    if (key === "records") return st.filter === "all" && ((bundle.answers || []).length > 0 || !!(bundle.design && ((bundle.design.rows || []).length || bundle.design.bundle || bundle.design.url)));

        }).join("") + "</section>";

  /* does the row pass the page's current filter (the jump of the readiness counter keeps the filter when it can) */
  function passesFilter(bundle, st, x) {
    var s2 = Object.assign({}, st); s2.needsNow = {}; needs(bundle, st).forEach(function (n) { s2.needsNow[n.key] = 1; });

    var o = e.target.closest("[data-rvonly]"); if (o) { e.preventDefault(); e.stopImmediatePropagation(); view.rvOnly = RevDiff.toggleOnly(app, o, view.rvOnly); }
  }, true);
  app.addEventListener("change", function (e) { if (e.target.matches && e.target.matches("[data-rvbase]")) { view.base = view.rounds.filter(function (r) { return r.id === e.target.value; })[0] || view.base; view.rvAt = -1; paint(); } });
  document.addEventListener("keydown", function (e) {
    if (!view.base || RevDiff.pref() !== "show" || e.metaKey || e.ctrlKey || e.altKey || (e.target.closest && e.target.closest("textarea, input, select, [contenteditable]"))) return;
    if (e.key === "j") { e.preventDefault(); rvStep(1); } else if (e.key === "k") { e.preventDefault(); rvStep(-1); }
  });

  /* ---------- views ---------- */
  function showList() {
    teardown(); view.id = ""; view.bundle = null;
    if (!db) return;
    view.unsub.push(db.collection("bundles").orderBy("createdAt", "desc").limit(100).onSnapshot(function (snap) {
      app.innerHTML = GateView.listHtml(snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }));
    }, function () { app.innerHTML = '<div class="card msg"><b>Couldn’t load the pages.</b><p>Reload the page.</p></div>'; }));
  }
  function showPage(id) {
    teardown(); view.id = id; view.bundle = null; view.st = freshState(); view.rounds = []; view.base = null; view.rvAt = -1; view.rvOnly = 0;
    if (!db) return;
    app.innerHTML = '<div class="card msg"><b>Loading this page…</b></div>';
    view.unsub.push(db.doc("bundles/" + id).onSnapshot(function (snap) {
      if (!snap.exists) {
        app.innerHTML = '<div class="card msg"><b>Waiting for this page</b><p>Nothing is stored under this id yet. The agent writes the page just before it asks you, and this view fills in when it lands. If nothing happens, check the link the agent gave you.</p><p><a href="#" data-nav="">All pages</a></p></div>';
        return;
      }
      var row = snap.data(), first = !view.bundle;
      view.row = row; view.bundle = row.bundle || null; view.ids = view.bundle ? GateView.idMap(view.bundle) : {};
      if (!view.bundle) { app.innerHTML = '<div class="card msg"><b>This row holds no page.</b><p>Ask the agent to build it again.</p></div>'; return; }
      if (view.bundle.schema !== "aidlc-gate-bundle/1") { app.innerHTML = '<div class="card msg"><b>This page is newer than this view.</b><p>It uses ' + GateView.esc(view.bundle.schema) + '. Ask the agent to republish the unit approvals page from the plugin.</p></div>'; return; }
      if (first) {
        loadEarlier();
        view.readKey = [row.intent || view.bundle.header.intent, row.unit || view.bundle.header.unit, view.bundle.page].join("--");
        view.st.read = loadLocalReads();
        if (db && uid) Promise.resolve().then(function () { return readsDoc().get(); }).then(function (d) {
          var marks = d && d.exists ? (d.data().marks || {}) : {};
          Object.keys(marks).forEach(function (k) { view.st.read[k] = Math.max(view.st.read[k] || 0, marks[k] || 0); });
          paint();
        }).catch(function () { /* local marks only */ });
      }
      if (!view.unsaved && !view.saving) { view.st.notes = Object.assign({}, row.notes || {}); view.st.picks = Object.assign({}, row.picks || {}); }
      document.title = (GateView.pageTitle(view.bundle.header.unit, view.bundle.page, view.bundle.header.title) || "Unit approval") + " · AI-DLC unit approvals";
      paint();
    }, function () { app.innerHTML = '<div class="card msg"><b>Couldn’t load this page.</b><p>Reload the page.</p></div>'; }));
  }
  function route() { var id = pageId(); if (id) showPage(id); else showList(); }
  window.addEventListener("hashchange", function () { if (pageId() || !location.hash) route(); });

  (async function boot() {
    var use = window.claude && typeof window.claude.use === "function" ? window.claude.use : null;
    db = use ? await use("db") : null;
    if (!db) { app.innerHTML = '<div class="card msg"><b>Sign in to claude.ai to read this page.</b><p>The pages are stored with the artifact, and only a signed-in viewer can read them.</p></div>'; return; }
    try { user = await use("user"); uid = user && typeof user.id === "function" ? await user.id() : null; } catch (e) { uid = null; }
    route();
  })();
})();
</script>
