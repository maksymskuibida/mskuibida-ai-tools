<title>AI-DLC question forms</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  AI-DLC question forms — the one template for every AI-DLC questions file.

  Published ONCE per developer as a private Artifact with the `db` and `user` capabilities
  (capabilities: {db: {}, user: {}}, icon "form"); never regenerated per stage. Every questions
  file becomes a form INSIDE this artifact, always, written as rows by the agent with the
  ArtifactData tool (see SKILL.md next to this file). The page renders whatever the rows
  say, live, so a question can be added, changed or removed without republishing anything.
  Published without `user`, the page still works; "new since you looked" marks then stay in
  this browser only.

  Data contract (the only thing an agent writes):

    forms/<id>                       {title, stage, file, status: "open"|"done",
                                      createdAt (ISO), intro?, savedAt?, answers?, terms?}
      id: [a-z0-9._-]+ — e.g. 261016-daily-page-mvp-intent-capture
      terms?: {"NFR": "plain-language meaning", …} — words and abbreviations that get a tooltip
        wherever they appear in the form's text (whole words, case as written). The page knows a
        few common ones itself (AC, API, CI, MVP, NFR, PR, SSO, UI, UX …); terms adds or overrides.
      ids?: {"FR1.5": "the requirement in one plain line", "ADR-013": {t: "…", target: "path:<repo path>"}, …}
        — the ids of the intent's documents that the form's text mentions. Every such id is drawn as a
        link with a tooltip; the page recognises FR, NFR, BR, US, AC, ADR, C, U and WF ids by itself
        (FR8.9a, US15.1, AC15.1.2, ADR-013, C21, U5) and names their kind, and ids gives the text the
        tooltip shows and, with target, where the link goes. Any key works, so other kinds of ids can
        be listed too.
      records?: "https://github.com/<owner>/<repo>/blob/<branch>/" — the repository's web address at
        the branch. With it, path: targets, file paths in `code` and the questions file are real links.
    forms/<id>/questions/<qid>       {n: 1, text, ctx?, kind: "single"|"multi",
                                      options: [{k: "A", t: "…"}], other?: false,
                                      proposed?: {k: "A", why: "…"}, hint?, refs?, revNote?}
      qid: the file's question id (Q1, Q2 …). other defaults to true.
      refs?: [{label, tip, target}] — what the question refers to, shown as links under it.
        label is short (an id is fine here: "FR-3", "US2.1"); tip says in plain words what it is
        (the tooltip, and all the reader gets when the target is not on this page).
        target "#<qid>" — another question or card of this form: a live link that jumps there.
        target "https://…" — opens in a new tab.
        anything else ("path:src/app.ts", "story:US2.1", "") — the source isn't in this page: it
        still looks like a link, shows tip as its tooltip, and a press says so.
      revNote?: one line on why the question was added or changed (a follow-up), shown above it.

    Markdown the page renders (functions md and inline; nothing else):
      ctx (questions and cards) — blocks separated by a blank line. A block whose every line
        starts with "- " is a list, one level only (leading spaces are dropped, so an indented
        line is not a sub-item); any other block is a paragraph, its single line breaks kept.
        Inside both: `code` and **bold**.
      text, options[].t, proposed.why, proposed.t, hint, from, outcomes, boxes[].t/hint,
        groups[].t/hint, plain, action, revNote — `code` and **bold** only, no blocks or lists.
      title, stage, file, intro, refs[].label/tip — plain text.
      Not rendered: •, –, numbered or nested lists, headings, links, _italic_; they show as
      literal text. A sentence before a list needs a blank line, or the list stays plain lines.
      Linked by the page itself: an id of another question or card of this form written in any
      rendered text (Q5, R-06) becomes a live link to it; on a question list, a Q<n> that is not
      in this form is shown as a link that says so. A `code` span that is a file path is shown as
      a file link (the file is not in this page). Terms get a tooltip.

    Text question — no options, only a text field (no Other):
    forms/<id>/questions/<qid>       {n, text, ctx?, kind: "text", hint?, proposed?: {t: "…"}, refs?}
      proposed.t is a suggested answer the developer can take with one press.

    Board form — cards sorted into boxes instead of questions answered one by one:
    forms/<id>                       {…, view: "board",
                                      boxes: [{k: "fix", t: "…", hint?, tone?: "ink"|"accent"|"warn"|"muted"}]}
      2–4 boxes, side by side when the page is wide enough, stacked when it is not.
      groups?: [{k, t, hint?}] with boxes[].group, and boxes[].sink: true — a grouped board: the
      groups side by side, each group's boxes stacked, sink boxes in a full row below. A card can
      move only within its group or to a sink box; a card proposed into a sink box names its group
      in `group` (card field), else it may go to any box.
    forms/<id>/questions/<qid>       {n, text, ctx?, kind: "card", from?, group?, proposed: {k: "<box k>", why?},
                                      outcomes?: {"<box k>": "what happens when the card sits here"},
                                      plain?, action?, detail?, refs?}
      text is the card's short title; from is one line on who asked for what. A card starts
      in its proposed box. On a grouped board the group alone decides where it can go, and
      outcomes only describes; on a board without groups, outcomes (when present) limits the
      boxes offered to its keys and the proposed box.
      plain?: what the card means in plain words, shown on the card under its title.
      action?: the suggested action, shown in the card's details. refs?: as for questions.
      detail?: ctx without what plain and action say; shown in place of ctx when the card has plain
        or action, so the plain words are not said twice. ctx stays complete for older pages.
      refs targets on a findings board: "#<qid>" another card (live); "doc:<where>", "path:<file>",
        "finding:<closed id>" are not in the form (a link that says so).

  What the page writes (the only thing an agent reads back, one `get` of forms/<id>):

    forms/<id>.answers[qid] = {k: ["A"] | ["A","C"] | ["X"], note: "…", at: ISO}
      text question: {k: [], note: "<the answer>"} · card: {k: ["<box k>"], note}
      On Done every card is written, moved or not.
    forms/<id>.status       = "done" when the developer presses Done; "open" again
                              after a later edit.   forms/<id>.savedAt = ISO of Done.
    data/users/<viewer>/seen-<id>  {marks: {<qid>: <signature>}} — the viewer's own "seen" marks
      (localStorage when the user capability is not served). Never read by the agent.

  Tag format when copying into the questions file:  A · A, C · X — each followed by
  " — <note>" when a note was written. A note is required for X, optional otherwise.
  A text question's tag is the note itself; empty means still open.

  Link to a form: <artifact url>#<id>. No hash: the list of forms.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* The same visual system as the approval-gates unit page (unit-gate.html): one reading column, a header
   card with the form's facts, a sticky bar (filters, progress, save state, Done, a chip per question or
   box), then the questions as cards, or the board. */
:root {
  --bg: #F5F6F8; --surface: #FFFFFF; --raised: #F8F9FB; --fg: #171A21; --fg-2: #3D4350; --muted: #5A6170;
  --line: #E4E7EC; --line-soft: #EEF0F3; --control: #D5D9E0; --field: #878E9B; --hover: #F7F8FA;
  --accent: #2F49C4; --accent-strong: #1E3399; --accent-soft: #EEF1FB; --accent-tint: #F4F6FE;
  --crit-bg: #FDE4E4; --crit-fg: #9B1C1C; --high-bg: #FDEAD7; --high-fg: #8A3B00;
  --med-bg: #E3ECFB; --med-fg: #1E4A9A; --low-bg: #EEF0F3; --low-fg: #4A5160;
  --ok-bg: #E6F4EA; --ok-fg: #1F6B36; --warn-bg: #FFF4DB; --warn-fg: #7A4B00; --warn-dot: #B26B00;
  --r2-tint: #F8F5FE; --r2-bg: #EDE5FC; --r2-fg: #5B2FA8;
  --band-bg: #171A21; --band-fg: #FFFFFF; --band-muted: #C9CDD6; --tip-bg: #171A21; --tip-fg: #FFFFFF;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --bar-h: 120px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111318; --surface: #1A1D24; --raised: #20232B; --fg: #E6E8EE; --fg-2: #C3C8D2; --muted: #9AA1AF;
  --line: #2A2E38; --line-soft: #22262F; --control: #3A3F4B; --field: #6E7585; --hover: #20242C;
  --accent: #8FA2FF; --accent-strong: #B5C2FF; --accent-soft: #222B4D; --accent-tint: #1B2035;
  --crit-bg: #3D1D1D; --crit-fg: #F4A4A4; --high-bg: #3A2614; --high-fg: #F2B27A;
  --med-bg: #1C2A45; --med-fg: #9DBBF2; --low-bg: #262A33; --low-fg: #AEB4C0;
  --ok-bg: #183024; --ok-fg: #8FD3A6; --warn-bg: #3A2C12; --warn-fg: #F0C36B; --warn-dot: #F0A93B;
  --r2-tint: #1E1A2B; --r2-bg: #2E2547; --r2-fg: #C7B1F5;
  --band-bg: #E6E8EE; --band-fg: #111318; --band-muted: #3D4350; --tip-bg: #E6E8EE; --tip-fg: #111318;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111318; --surface: #1A1D24; --raised: #20232B; --fg: #E6E8EE; --fg-2: #C3C8D2; --muted: #9AA1AF;
  --line: #2A2E38; --line-soft: #22262F; --control: #3A3F4B; --field: #6E7585; --hover: #20242C;
  --accent: #8FA2FF; --accent-strong: #B5C2FF; --accent-soft: #222B4D; --accent-tint: #1B2035;
  --crit-bg: #3D1D1D; --crit-fg: #F4A4A4; --high-bg: #3A2614; --high-fg: #F2B27A;
  --med-bg: #1C2A45; --med-fg: #9DBBF2; --low-bg: #262A33; --low-fg: #AEB4C0;
  --ok-bg: #183024; --ok-fg: #8FD3A6; --warn-bg: #3A2C12; --warn-fg: #F0C36B; --warn-dot: #F0A93B;
  --r2-tint: #1E1A2B; --r2-bg: #2E2547; --r2-fg: #C7B1F5;
  --band-bg: #E6E8EE; --band-fg: #111318; --band-muted: #3D4350; --tip-bg: #E6E8EE; --tip-fg: #111318;
  color-scheme: dark }

* { box-sizing: border-box; }
html { overflow-x: hidden; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--body); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
[hidden] { display: none !important; }
a { color: var(--accent); }
a:hover { color: var(--accent-strong); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, textarea:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.wrap { width: 100%; max-width: 920px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
body.wide .wrap { max-width: 1320px; }
#app { display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

/* header */
.head { display: flex; flex-direction: column; gap: 14px; padding: 20px 24px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; color: var(--muted); font-size: 13px; min-width: 0; }
.crumbs a { color: inherit; text-decoration: none; } .crumbs a:hover { text-decoration: underline; }
.status { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 2px 10px; border-radius: 13px; background: var(--warn-bg); color: var(--warn-fg); font-weight: 500; }
.status i { width: 7px; height: 7px; border-radius: 4px; background: var(--warn-dot); }
.status.done { background: var(--ok-bg); color: var(--ok-fg); } .status.done i { background: var(--ok-fg); }
.titlerow { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px 32px; }
.titlerow > div:first-child { flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; text-wrap: balance; overflow-wrap: anywhere; }
.lede { margin: 0; color: var(--fg-2); line-height: 1.55; max-width: 76ch; }
.facts { display: flex; flex-wrap: wrap; gap: 10px; }
.fact { display: flex; flex-direction: column; gap: 2px; padding: 8px 14px; border-radius: 8px; background: var(--bg); min-width: 96px; }
.fact span { font-size: 12px; color: var(--muted); } .fact b { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.source { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px; border-radius: 8px; background: var(--raised); font-size: 13px; color: var(--fg-2); min-width: 0; }
.source .ref { white-space: normal; overflow-wrap: anywhere; text-align: left; }

/* sticky bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; display: flex; flex-direction: column; gap: 10px; padding: 10px 14px; background: color-mix(in srgb, var(--surface) 96%, transparent); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 2px 8px rgba(23, 26, 33, .06); backdrop-filter: blur(6px); }
.barrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.filters { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid var(--control); background: var(--surface); font-weight: 500; }
.pill b { font-family: var(--mono); font-weight: 500; font-size: 12px; opacity: .8; }
.pill[aria-pressed="true"] { background: var(--fg); color: var(--surface); border-color: var(--fg); }
.tools { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.progress { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; color: var(--fg-2); }
.meter { width: 100px; height: 6px; border-radius: 3px; background: var(--line-soft); overflow: hidden; display: block; }
.meter i { display: block; height: 6px; background: var(--accent); transition: width .2s; }
.btn { height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--control); background: var(--surface); }
.btn:hover, .pill:hover { border-color: var(--accent); }
.primary { height: 32px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font-weight: 600; }
:root[data-theme="dark"] .primary { color: #111318; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .primary { color: #111318; } }
.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.primary:disabled { opacity: .55; cursor: default; }
.primary.is-done { background: var(--ok-fg); border-color: var(--ok-fg); }
.save { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 2px 10px; border-radius: 13px; font-size: 12px; font-weight: 500; background: var(--line-soft); color: var(--fg-2); white-space: nowrap; }
.save i { width: 7px; height: 7px; border-radius: 4px; background: var(--muted); flex: none; }
.save.ok { background: var(--ok-bg); color: var(--ok-fg); } .save.ok i { background: var(--ok-fg); }
.save.busy { background: var(--accent-soft); color: var(--accent); } .save.busy i { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
.save.fail { background: var(--crit-bg); color: var(--crit-fg); } .save.fail i { background: var(--crit-fg); }
.save button { border: 0; background: transparent; padding: 0 0 0 4px; font-weight: 600; text-decoration: underline; color: inherit; }
@keyframes pulse { 50% { opacity: .35; } }
.barmsg { font-size: 13px; padding: 8px 10px; border-radius: 6px; background: var(--warn-bg); color: var(--warn-fg); display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.barmsg.crit { background: var(--crit-bg); color: var(--crit-fg); }
.barmsg button { border: 0; background: transparent; padding: 0; font-weight: 600; text-decoration: underline; color: inherit; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 16px; border: 1px solid var(--control); background: var(--surface); color: var(--fg); text-decoration: none; font-size: 13px; white-space: nowrap; }
.chip:hover { border-color: var(--accent); color: var(--fg); }
.chip .count { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.chip .st { width: 8px; height: 8px; border-radius: 4px; border: 1.5px solid var(--control); flex: none; }
.chip.ans .st { background: var(--ok-fg); border-color: var(--ok-fg); }
.chip.need .st { background: var(--crit-fg); border-color: var(--crit-fg); }
.chip.fresh { border-color: var(--r2-fg); }
.chip .sw { width: 8px; height: 8px; border-radius: 2px; background: var(--tone); flex: none; }
.chip.dim { opacity: .45; }
.tag { display: inline-flex; align-items: center; gap: 5px; height: 22px; font-size: 11px; font-weight: 600; padding: 0 7px; border-radius: 4px; white-space: nowrap; border: 0; letter-spacing: .02em; }
.tag.open { background: var(--low-bg); color: var(--low-fg); }
.tag.ans { background: var(--ok-bg); color: var(--ok-fg); }
.tag.need { background: var(--crit-bg); color: var(--crit-fg); }
.tag.differs { background: var(--warn-bg); color: var(--warn-fg); }
.tag.fresh { background: var(--r2-bg); color: var(--r2-fg); }
button.tag:hover { filter: brightness(.96); }

/* links: a live jump, an external page, or a source that is not on this page */
.ref { position: relative; display: inline-flex; align-items: center; gap: 4px; min-height: 22px; padding: 0 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); font-family: var(--mono); font-size: 12px; text-decoration: none; white-space: nowrap; vertical-align: baseline; }
.ref:hover { color: var(--accent-strong); filter: brightness(.97); }
.ref.off { background: transparent; border: 1px dashed color-mix(in srgb, var(--accent) 55%, transparent); }
.ref.off::after { content: "↗"; font-size: 10px; opacity: .7; }
.ref.code { font-weight: 500; }
.term { text-decoration: underline dotted color-mix(in srgb, var(--fg) 45%, transparent); text-underline-offset: 3px; cursor: help; border-radius: 2px; }
.refs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.refs > span { font-size: 12px; color: var(--muted); }
#tip { position: fixed; z-index: 30; max-width: min(340px, calc(100vw - 24px)); padding: 8px 10px; border-radius: 6px; background: var(--tip-bg); color: var(--tip-fg); font: 12px/1.45 var(--body); pointer-events: none; box-shadow: 0 4px 14px rgba(0, 0, 0, .18); }
#tip b { font-family: var(--mono); font-weight: 500; }
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: calc(100vw - 32px); background: var(--tip-bg); color: var(--tip-fg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 31; box-shadow: 0 4px 14px rgba(0, 0, 0, .18); }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--accent); background-color: var(--accent-tint); } 100% { box-shadow: 0 0 0 0 transparent; } }

/* the list of forms */
.list h2 { margin: 0; padding: 16px 16px 8px; font-size: 15px; font-weight: 600; }
.lbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.search { flex: 1 1 220px; height: 32px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--field); background: var(--surface); color: var(--fg); font: inherit; }
.lrow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 10px 16px; border-top: 1px solid var(--line-soft); color: var(--fg); text-decoration: none; }
.lrow:hover { background: var(--hover); color: var(--fg); }
.lrow > span:first-child { flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; }
.lrow b { font-weight: 500; overflow-wrap: anywhere; } .lrow small { color: var(--muted); }
.msg { padding: 28px 24px; display: flex; flex-direction: column; gap: 6px; }
.msg p { margin: 0; color: var(--fg-2); max-width: 70ch; }
.empty { margin: 0; padding: 14px 16px; color: var(--muted); }

/* questions */
#questions { display: flex; flex-direction: column; gap: 14px; }
section.q { display: flex; flex-direction: column; gap: 14px; padding: 18px 20px 20px; scroll-margin-top: calc(var(--bar-h) + 16px); }
section.q.is-ans { border-color: color-mix(in srgb, var(--ok-fg) 28%, var(--line)); }
section.q.needs-note { border-color: var(--crit-fg); }
section.q.filtered { display: none; }
.qhead { display: flex; gap: 12px; align-items: flex-start; }
.qid { flex: none; font: 500 12px/1 var(--mono); color: var(--fg-2); background: var(--line-soft); padding: 6px 8px; border-radius: 5px; margin-top: 1px; }
h2 { flex: 1; margin: 0; font-size: 17px; font-weight: 600; line-height: 1.35; text-wrap: balance; min-width: 0; overflow-wrap: anywhere; }
.qtags { flex: none; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; max-width: 46%; }
.revnote { margin: 0; padding: 8px 10px; border-radius: 6px; background: var(--r2-tint); color: var(--r2-fg); font-size: 13px; line-height: 1.5; }
.qbody { display: flex; flex-direction: column; gap: 14px; padding-left: 46px; }
.ctx { display: flex; flex-direction: column; gap: 10px; max-width: 72ch; color: var(--fg); line-height: 1.6; }
.ctx p, .ctx ul { margin: 0; }
.ctx ul { padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
code { font: 500 12.5px var(--mono); background: var(--line-soft); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }

<script>

    API: "Application programming interface: how one program talks to another.",
    CI: "Continuous integration: the checks that run on every push.",
    E2E: "End-to-end test: drives the whole app the way a person would.",
    MVP: "Minimum viable product: the smallest version worth shipping.",
    NFR: "Non-functional requirement: how well the system must work (speed, security, uptime), not what it does.",

    save: { state: "idle", at: "", msg: "" }, closing: false, confirmDone: false, expanded: new Set(), filter: "all",
    marks: {}, marksReady: false, baselined: false, notice: null, tokens: null,

  /* ---------- tooltips: hover and keyboard focus; a tap on touch ---------- */

  /* ---------- text: the Markdown subset, with links to this form's ids and tooltips on terms ---------- */
  function tokens() {

    const ids = [...view.questions.keys()];
    const terms = Object.assign({}, TERMS, (view.form && typeof view.form.terms === "object" && view.form.terms) || {});
    const docIds = (view.form && view.form.ids && typeof view.form.ids === "object") ? view.form.ids : {};
    const words = [...new Set([...ids, ...Object.keys(docIds), ...Object.keys(terms)])].filter(Boolean).sort((a, b) => b.length - a.length).map((w) => reEsc(esc(w)));
    if (!isBoard()) words.push("Q\\d+");

    view.tokens = { re, ids: new Set(ids), terms, docIds, idRe: new RegExp(`^${ID_RE}$`) };
    return view.tokens;
  }
  const qLabel = (q) => q ? (q.text || "").replace(/[`*]/g, "") : "";

    const t = tokens(), q = view.questions.get(id);

      if (id === self) return esc(id);
      const kind = q.kind === "card" ? "Card" : "Question";
      return `<a class="ref" href="#" data-jump="q-${esc(id)}" data-tip="${esc(`${kind} ${id}: ${qLabel(q)}. Press to go there.`)}">${esc(id)}</a>`;

  }

    const t = tokens(); if (!t.re) return html;

      const raw = w.replace(/&amp;/g, "&");

  const PATH = /^(?:[\w.@~-]+\/)+[\w.@~-]+\/?$|^[\w-]+\.(?:md|mdx|ts|tsx|js|jsx|mjs|py|swift|kt|go|rs|rb|java|yml|yaml|json|toml|html|css|scss|sh|sql|csv|txt)$/;
  function code(t) {
    const url = PATH.test(t) && t.includes("/") ? recordsUrl(t) : "";
    if (url) return `<a class="ref code" href="${esc(url)}" target="_blank" rel="noopener" data-tip="${esc(`A file in the repository: ${t}. Opens on the code host.`)}">${esc(t)}</a>`;
    if (PATH.test(t) && !/^https?:/.test(t)) return `<a class="ref code off" href="#" data-off="1" data-path="${esc(t)}" data-tip="${esc(`A file in the repository: ${t}. It isn't part of this page.`)}">${esc(t)}</a>`;
    return `<code>${esc(t)}</code>`;
  }
  function inline(s, self) {
    const codes = [];
    let h = String(s ?? "").replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
    h = esc(h).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");

  }
  const md = (s, self) => String(s ?? "").trim().split(/\n\s*\n/).filter(Boolean).map((b) => {
    const lines = b.split("\n");
    if (lines.every((l) => /^\s*-\s+/.test(l))) return "<ul>" + lines.map((l) => "<li>" + inline(l.replace(/^\s*-\s+/, ""), self) + "</li>").join("") + "</ul>";
    return "<p>" + lines.map((l) => inline(l, self)).join("<br>") + "</p>";
  }).join("");
  /* refs: [{label, tip, target}] — a live jump when the target is on this page, else a link that says it isn't */
  function refHtml(r) {
    const label = String(r.label || r.target || "").trim(), target = String(r.target || "").trim();
    let tip = String(r.tip || "").trim();
    if (!label) return "";
    const local = target.replace(/^#/, "");
    if (target.charAt(0) === "#" && view.questions.has(local)) {
      const q = view.questions.get(local);
      return `<a class="ref" href="#" data-jump="q-${esc(local)}" data-tip="${esc((tip ? tip + " " : "") + `(${q.kind === "card" ? "card" : "question"} ${local}: ${qLabel(q)}) Press to go there.`)}">${esc(label)}</a>`;
    }
    if (/^https?:\/\//i.test(target)) return `<a class="ref" href="${esc(target)}" target="_blank" rel="noopener" data-tip="${esc((tip || target) + " Opens in a new tab.")}">${esc(label)}</a>`;
    const path = target.indexOf("path:") === 0 ? target.slice(5) : "";
    const url = path && recordsUrl(path);
    if (url) return `<a class="ref" href="${esc(url)}" target="_blank" rel="noopener" data-tip="${esc((tip || `A file in the repository: ${path}.`) + " Opens on the code host.")}">${esc(label)}</a>`;
    if (!tip) tip = path ? `A file in the repository: ${path}.` : label;
    return `<a class="ref off" href="#" data-off="1"${path ? ` data-path="${esc(path)}"` : ""} data-tip="${esc(tip + " Not part of this page.")}">${esc(label)}</a>`;
  }
  /* forms/<id>.records: the repository's web address at the branch (https://github.com/o/r/blob/main/); with it a
     repo path becomes a real link. */
  function recordsUrl(path) {
    const base = view.form && view.form.records;
    if (!base || !/^https:\/\//i.test(base)) return "";

  }
  const refsHtml = (q, lead) => Array.isArray(q.refs) && q.refs.length ? `<div class="refs"><span>${esc(lead)}</span>${q.refs.map(refHtml).join("")}</div>` : "";

  function teardown() {

  }

  /* ---------- the list of forms ---------- */
  const listState = { filter: "open", q: "", rows: [] };
  function showIndex() {
    teardown(); view.id = ""; view.form = null; document.title = "AI-DLC question forms";
    app.innerHTML = `<header class="card head"><div class="crumbs"><span>AI-DLC</span><span aria-hidden="true">/</span><span>Question forms</span></div>
      <div class="titlerow"><div><h1>Question forms</h1><p class="lede">Every stage’s questions file, as a form. Pick one; nothing is pre-selected, and Claude copies what you save word for word into the file.</p></div><div class="facts" id="lfacts"></div></div></header>
      <div class="bar" id="bar"><div class="lbar"><div class="filters" role="group" aria-label="Show forms" id="lfilters"></div><input class="search" id="lsearch" type="search" placeholder="Find a form by title, stage or file" aria-label="Find a form"></div></div>
      <main id="lbody"><div class="card msg"><b>Loading forms…</b></div></main>`;
    barHeight();
    $("lsearch").addEventListener("input", (e) => { listState.q = e.target.value.trim().toLowerCase(); paintIndex(); });
    $("lbody").addEventListener("click", (e) => { const b = e.target.closest("[data-f]"); if (b) { listState.filter = b.dataset.f; paintIndex(); } });
    $("lfilters").addEventListener("click", (e) => { const b = e.target.closest("[data-f]"); if (b) { listState.filter = b.dataset.f; paintIndex(); } });
    if (!db) return;
    const u = db.collection("forms").orderBy("createdAt", "desc").limit(200).onSnapshot((snap) => {
      listState.rows = snap.docs.map((d) => ({ id: d.id, ...d.data() })); paintIndex();
    }, () => { $("lbody").innerHTML = '<div class="card msg"><b>Couldn’t load the forms.</b><p>Reload the page.</p></div>'; });
    view.unsub.push(u);
  }
  function paintIndex() {
    const rows = listState.rows, open = rows.filter((r) => r.status !== "done").length;
    if (!$("lbody")) return;
    $("lfacts").innerHTML = `<div class="fact"><span>Open</span><b>${open}</b></div><div class="fact"><span>Done</span><b>${rows.length - open}</b></div>`;
    keepFocus($("lfilters"), () => { $("lfilters").innerHTML = [["open", "Open", open], ["done", "Done", rows.length - open], ["all", "All", rows.length]].map(([k, t, n]) => `<button type="button" class="pill" data-f="${k}" aria-pressed="${listState.filter === k}">${t}<b>${n}</b></button>`).join(""); });
    if (!rows.length) { $("lbody").innerHTML = '<div class="card msg"><b>No forms yet.</b><p>Claude creates one here for every questions file a stage writes and gives you its link, which ends in # and the form’s id.</p></div>'; return; }
    const shown = rows.filter((r) => (listState.filter === "all" || (listState.filter === "done") === (r.status === "done")) &&
      (!listState.q || [r.title, r.stage, r.file, r.id].join(" ").toLowerCase().includes(listState.q)));
    $("lbody").innerHTML = `<section class="card list">${shown.length ? shown.map((f) => {
      const n = Object.keys(f.answers || {}).length, done = f.status === "done";
      return `<a class="lrow" href="#${esc(f.id)}"><span><b>${esc(f.title || f.id)}</b><small>${esc(f.stage || "")}${f.stage ? " · " : ""}${esc(fmt(f.createdAt))}${n ? ` · ${n} answered` : ""}${f.view === "board" ? " · board" : ""}</small></span><span class="tag ${done ? "ans" : "open"}">${done ? "Done" : "Open"}</span></a>`;
    }).join("") : `<p class="empty">${listState.q ? "No form matches your search." : (listState.filter === "open" ? "Every form is done." : "Nothing here.")} ${listState.filter !== "all" ? `<button type="button" class="btn" data-f="all">Show all forms</button>` : ""}</p>`}</section>`;
  }

  /* ---------- one form ---------- */
  function showForm(id) {
    teardown(); view.id = id;
    app.innerHTML = `<header class="card head" id="head"><div class="crumbs"><a href="#" data-home="1">All forms</a></div><div class="titlerow"><div><h1 id="title">Loading…</h1></div></div></header>
      <div class="bar" id="bar"></div><main id="questions"><div class="card msg"><b>Loading questions…</b></div></main><footer class="band" id="band" hidden></footer>`;
    barHeight();
    if (!db) return;
    const ref = db.doc("forms/" + id);
    loadMarks(id);
    view.unsub.push(ref.onSnapshot((snap) => {
      if (!snap.exists) { view.form = null; app.innerHTML = `<div class="card msg"><b>No such form</b><p>Nothing is stored under this id. Check the link Claude gave you, or go back to <a href="#" data-home="1">all forms</a>.</p></div>`; return; }
      const f = snap.data(), termsChanged = JSON.stringify((view.form || {}).terms || null) !== JSON.stringify(f.terms || null);
      view.form = f; if (termsChanged) { view.tokens = null; view.rendered = new Map(); }
      document.title = (f.title || id) + " · AI-DLC question forms";
      layout();
      const remote = f.answers || {};

      if (!view.inflight && !Object.keys(view.pending).length && view.save.state !== "fail") view.save = { state: Object.keys(remote).length ? "ok" : "idle", at: latest(remote), msg: "" };

    }, () => setSave("fail", "Couldn’t load the form. Reload the page.")));
    view.unsub.push(ref.collection("questions").orderBy("n").onSnapshot((snap) => {
      const next = new Map(); snap.docs.forEach((d) => next.set(d.id, { id: d.id, ...d.data() }));
      const idsChanged = [...next.keys()].join("|") !== [...view.questions.keys()].join("|");
      view.questions = next; view.loaded = true;

  }
  const latest = (answers) => Object.values(answers).map((a) => a.at || "").sort().pop() || "";

  function barHeight() { const b = $("bar"); if (b) document.documentElement.style.setProperty("--bar-h", b.offsetHeight + "px"); }
  window.addEventListener("resize", barHeight);

  function paintHead() {
    const f = view.form, head = $("head"); if (!f || !head) return;
    const done = f.status === "done", n = view.questions.size, a = [...view.questions.keys()].filter(answered).length;
    const lede = f.intro || (f.view === "board"
      ? "Each card starts in the box Claude suggests. Move it with its buttons or by dragging its handle (⠿); Done saves where every card sits."

    const facts = isBoard()
      ? `<div class="fact"><span>Cards</span><b>${n}</b></div><div class="fact"><span>Moved</span><b>${movedCount()}</b></div><div class="fact"><span>With a note</span><b>${notedCount()}</b></div>`
      : `<div class="fact"><span>Questions</span><b>${n}</b></div><div class="fact"><span>Answered</span><b>${a}</b></div><div class="fact"><span>Open</span><b>${n - a}</b></div>`;
    const file = f.file ? `<div class="source"><span>Questions file</span>${refHtml({ label: f.file, target: "path:" + f.file, tip: `The file Claude copies your answers into: ${f.file}.` })}</div>` : "";
    head.innerHTML = `<div class="crumbs"><a href="#" data-home="1">All forms</a>${f.stage ? `<span aria-hidden="true">/</span><span>${esc(f.stage)}</span>` : ""}
        <span class="status${done ? " done" : ""}" tabindex="0" data-tip="${esc(done ? `You pressed Done ${fmt(f.savedAt)}. Claude reads the answers when you say so in chat. A later change reopens the form.` : "Still open: Claude reads the answers after you press Done and say so in chat.")}"><i aria-hidden="true"></i>${done ? "Done" : "Open"}</span></div>
      <div class="titlerow"><div><h1 id="title">${esc(f.title || view.id)}</h1><p class="lede">${linkify(esc(lede))}</p></div><div class="facts">${facts}</div></div>${file}`;
  }

  /* The form row decides the layout: a list of questions, or a board of boxes. */
  function layout() {
    const mode = view.form && view.form.view === "board" ? "board" : "list";

  function sync() {

    if (!isBoard()) {
      if (!qs.length) { qsEl.innerHTML = '<div class="card msg"><b>No questions yet.</b><p>Claude adds them as rows; they appear here as soon as they are written.</p></div>'; view.rendered = new Map(); paintAll(); return; }
      qsEl.querySelectorAll(":scope > .msg").forEach((n) => n.remove());
    }
    const seen = new Set();
    qs.forEach((q, i) => {
      seen.add(q.id); const sig = JSON.stringify(q);
      let node = document.getElementById("q-" + q.id);
      if (!node || view.rendered.get(q.id) !== sig) {
        const focusId = document.activeElement && node && node.contains(document.activeElement) ? document.activeElement.id : "";

    paintAll();
  }
  function paintAll() { paintCounts(); qsAll().forEach((q) => paintFresh(q.id)); applyFilter(); paintHead(); paintBar(); }
  const qsAll = () => [...view.questions.values()];

  /* ---------- "new since you looked": the viewer's own marks ---------- */
  const qsig = (q) => { const s = JSON.stringify([q.text, q.ctx, q.kind, q.options, q.proposed, q.hint, q.outcomes]); let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
  const marksKey = (id) => "qf:seen:" + id;
  function loadMarks(id) {

    Promise.resolve().then(() => marksDoc(id).get()).then((d) => {

  }

  /* The first visit is the baseline: nothing is "new" to someone who has never seen the form. */

  function markSeen(ids) { let any = false; ids.forEach((qid) => { const q = view.questions.get(qid); if (q && view.marks[qid] !== qsig(q)) { view.marks[qid] = qsig(q); any = true; } }); if (any) { saveMarks(); ids.forEach(paintFresh); paintBar(); applyFilter(); } }
  function paintFresh(qid) {
    const node = document.getElementById("q-" + qid); if (!node) return;
    const slot = node.querySelector(".qfresh"); if (!slot) return;
    const f = freshness(qid);
    node.classList.toggle("is-fresh", !!f);
    slot.innerHTML = f ? `<button type="button" class="tag fresh" data-seen="${esc(qid)}" data-tip="${esc(f === "new" ? "Added since you last looked at this form. Press to mark it seen." : "Changed since you last looked at this form. Press to mark it seen.")}">${f === "new" ? "New" : "Changed"}</button>` : "";
  }

  /* ---------- the sticky bar: filters, progress, save state, Done, and a chip per question or box ---------- */
  function counts() {
    const qs = qsAll();
    return { total: qs.length, ans: qs.filter((q) => answered(q.id)).length, need: missingNotes().length, fresh: qs.filter((q) => freshness(q.id)).length, moved: movedCount(), noted: notedCount() };
  }
  function saveHtml() {
    const s = view.save, f = view.form || {};
    if (s.state === "saving") return `<span class="save busy"><i></i>Saving…</span>`;
    if (s.state === "dirty") return `<span class="save busy"><i></i>Unsaved changes</span>`;
    if (s.state === "fail") return `<span class="save fail" data-tip="${esc(s.msg)}" tabindex="0"><i></i>Not saved${s.readonly ? "" : '<button type="button" data-act="retry">Retry</button>'}</span>`;
    if (f.status === "done") return `<span class="save ok"><i></i>Done ${esc(clock(f.savedAt))}</span>`;
    if (s.state === "ok") return `<span class="save ok"><i></i>Saved${s.at ? " " + esc(clock(s.at)) : ""}</span>`;

  }
  function doneLabel() { return view.form && view.form.status === "done" ? "Done ✓" : "Done"; }
  function paintBar() {
    const bar = $("bar"); if (!bar || !view.form || !view.mode) return;
    keepFocus(bar, () => paintBarInner(bar));
  }
  function paintBarInner(bar) {
    const c = counts(), multi = c.total > 1;
    const pct = c.total ? Math.round((isBoard() ? c.total : c.ans) / c.total * 100) : 0;
    const f = view.filter;
    let filters, progress, chips;
    if (isBoard()) {
      filters = [["all", "All", c.total], ["moved", "Moved", c.moved], ["noted", "With a note", c.noted]].concat(c.fresh ? [["fresh", "New or changed", c.fresh]] : []);
      progress = "";
      chips = boxes().map((b) => { const n = [...document.querySelectorAll(`[data-cards="${CSS.escape(b.k)}"] .fcard:not(.filtered)`)].length;
        return `<a class="chip" href="#" data-jump="box-${esc(b.k)}" style="--tone:var(--${toneVar(b.tone)})" data-tip="${esc(stripMd(b.t) + (b.hint ? " — " + stripMd(b.hint) : "") + `. ${plural(n, "card")} here.`)}"><span class="sw" aria-hidden="true"></span>${esc(stripMd(b.t))}<span class="count">${n}</span></a>`; }).join("");
    } else {
      filters = [["all", "All", c.total], ["open", "Unanswered", c.total - c.ans]].concat(c.fresh ? [["fresh", "New or changed", c.fresh]] : []);

      chips = ordered().map((q) => {
        const st = (view.answers[q.id]?.k || []).includes("X") && !(view.answers[q.id]?.note || "").trim() ? "need" : (answered(q.id) ? "ans" : "");
        const fr = freshness(q.id), state = st === "need" ? "needs your own words for Other" : (st ? "answered " + answerText(q.id) : "not answered yet");
        return `<a class="chip ${st}${fr ? " fresh" : ""}${!passes(q) ? " dim" : ""}" href="#" data-jump="q-${esc(q.id)}" data-tip="${esc(`${q.id}: ${qLabel(q)} — ${state}${fr ? ` (${fr} since you looked)` : ""}.`)}"><span class="st" aria-hidden="true"></span>${esc(q.id)}</a>`;
      }).join("");
    }
    const notice = view.notice ? `<div class="barmsg${view.notice.crit ? " crit" : ""}"><span>${view.notice.html}</span>${view.notice.jump ? `<button type="button" data-jump="q-${esc(view.notice.jump)}">Go to the first one</button>` : ""}</div>` : "";
    const showNext = !isBoard() && c.ans < c.total;
    bar.innerHTML = `<div class="barrow">
        ${multi ? `<div class="filters" role="group" aria-label="Show">${filters.map(([k, t, n]) => `<button type="button" class="pill" data-filter="${k}" aria-pressed="${f === k}">${t}<b>${n}</b></button>`).join("")}</div>` : ""}
        <div class="tools">${progress}
          ${showNext ? `<button type="button" class="btn" data-act="next" data-tip="Go to the next question you have not answered.">Next unanswered</button>` : ""}
          ${isBoard() ? `<button type="button" class="btn wide-only" data-act="expand">Expand all</button><button type="button" class="btn wide-only" data-act="collapse">Collapse all</button>` : ""}
          ${c.fresh ? `<button type="button" class="btn wide-only" data-act="allseen">Mark all seen</button>` : ""}
          <span class="grow-sp"></span>${saveHtml()}
          <button type="button" class="primary${view.form.status === "done" ? " is-done" : ""}" data-act="done" ${view.closing ? "disabled" : ""} data-tip="${esc(doneTip(c))}">${doneLabel()}</button></div></div>
      ${notice}${multi || isBoard() ? `<nav class="chips" aria-label="${isBoard() ? "Boxes" : "Questions"}">${chips}</nav>` : ""}`;
    barHeight(); paintBand(c);
  }
  function notify(n) { view.notice = n; if (n) $("live").textContent = n.html.replace(/<[^>]+>/g, ""); paintBar(); }
  function doneTip(c) {
    if (view.form && view.form.status === "done") return "Already done. Press again after a change to mark it done again.";
    if (isBoard()) return "Saves where every card sits and marks the form done. Then tell Claude in chat.";
    return c.ans < c.total ? `${c.total - c.ans} still unanswered; Done asks you to confirm. Then tell Claude in chat.` : "Every question is answered. Mark the form done, then tell Claude in chat.";
  }
  function paintBand(c) {
    const band = $("band"); if (!band || !view.form) return;
    const done = view.form.status === "done";
    band.hidden = false;
    band.innerHTML = done
      ? `<b>Done ${esc(fmt(view.form.savedAt))}.</b><span>Tell Claude in chat that the form is done. A later change reopens the form, and you press Done again.</span><button type="button" class="primary is-done" data-act="done">Done ✓</button>`
      : `<b>${isBoard() ? `${plural(c.total, "card")} sorted.` : `${c.ans} of ${c.total} answered.`}</b><span>${isBoard() ? "Done saves where every card sits." : "Unanswered questions stay open questions for Claude."} Press Done, then tell Claude in chat that the form is done.</span><button type="button" class="primary" data-act="done" ${view.closing ? "disabled" : ""}>Done</button>`;
  }

    if (!isBoard()) { flagNote(qid); paintState(qid); }
    markSeen([qid]); setQ([qid], "Unsaved"); setSave("dirty");
    if (!isBoard()) { applyFilter(); paintHead(); }
    clearTimeout(view.timer); view.timer = setTimeout(flush, 450);
  }
  async function flush() {
    if (view.inflight || !db || !view.id || !Object.keys(view.pending).length) return;
    const batch = view.pending; view.pending = {}; view.inflight = true; clearTimeout(view.retryTimer);
    const id = view.id, ids = Object.keys(batch);
    setQ(ids, "Saving…"); setSave("saving");
    let failed = false;
    try {
      const patch = { answers: {} }; for (const [qid, a] of Object.entries(batch)) patch.answers[qid] = { k: a.k, note: a.note, at: a.at };
      /* An edit after Done reopens the form; a save that Done itself is waiting for never does. */
      if (view.form && view.form.status === "done" && !view.closing) patch.status = "open";
      await db.doc("forms/" + id).update(patch);
      if (view.id === id) { view.retry = 0; setQ(ids.filter((q) => !view.pending[q]), "Saved"); if (!Object.keys(view.pending).length) setSave("ok"); }
    } catch (e) {
      failed = true;
      if (view.id !== id) return;
      for (const [qid, a] of Object.entries(batch)) if (!view.pending[qid]) view.pending[qid] = a;
      setQ(ids, "Not saved");
      const readonly = e && e.code === "invalid_argument";
      view.save.readonly = readonly;
      setSave("fail", readonly ? "You can view this form but not save to it. Ask the owner for Contributor access." : "Couldn’t save. Check your connection; it tries again by itself, or press Retry.");
      toast(readonly ? "You can view this form but not save to it." : "Couldn’t save your answer. It is kept here and sent again.");
      if (!readonly) { view.retry = Math.min(view.retry + 1, 5); view.retryTimer = setTimeout(flush, 1000 * 2 ** view.retry); }
    } finally {
      view.inflight = false;
      if (view.id === id && !failed && Object.keys(view.pending).length) flush();
    }
  }
  function answered(qid) {
    const q = view.questions.get(qid); const a = view.answers[qid];
    if (q?.kind === "card") return true;
    if (q?.kind === "text") return !!(a?.note || "").trim();
    return !!(a?.k || []).length;
  }
  function unanswered() { return ordered().map((q) => q.id).filter((qid) => !answered(qid)); }
  function missingNotes() { return ordered().map((q) => q.id).filter(needsNote); }
  const idList = (ids) => (ids.length > 4 ? ids.slice(0, 4) : ids).map((q) => idRef(q)).join(", ") + (ids.length > 4 ? ` and ${ids.length - 4} more` : "");

  async function done() {
    if (!db || !view.id || view.closing) return;
    const miss = missingNotes();
    if (miss.length) { notify({ crit: true, html: `${idList(miss)}: you chose Other — write your own words in the note, or pick an option.`, jump: miss[0] }); reveal("q-" + miss[0]); return; }
    const open = unanswered();
    if (open.length && !view.confirmDone) { view.confirmDone = true; notify({ html: `${plural(open.length, "question")} unanswered (${idList(open)}). They stay open questions for Claude. Press Done again to confirm.`, jump: open[0] }); return; }
    if (isBoard()) {
      /* A card left where it started is an answer too: write every card's box. */
      const now = new Date().toISOString();
      for (const qid of view.questions.keys()) {
        const k = boxOf(qid);
        if (view.answers[qid]?.k?.[0] !== k) { view.answers[qid] = { k: [k], note: view.answers[qid]?.note || "", at: now }; view.pending[qid] = view.answers[qid]; }
      }
    }
    clearTimeout(view.timer); clearTimeout(view.retryTimer); view.closing = true; view.notice = null; paintBar();
    try {
      /* Wait until every answer is saved: an autosave may be in flight, and more may be pending. */
      for (let i = 0; i < 100 && (view.inflight || Object.keys(view.pending).length); i++) {
        if (!view.inflight) await flush(); else await new Promise((r) => setTimeout(r, 100));
        if (view.save.state === "fail") break;
      }
      if (view.inflight || Object.keys(view.pending).length) throw new Error("unsaved");
      await db.doc("forms/" + view.id).update({ status: "done", savedAt: new Date().toISOString() }); view.confirmDone = false;
      toast("Marked as done. Tell Claude in chat that the form is done.");
    } catch {
      notify({ crit: true, html: "Couldn’t mark the form as done: some answers are not saved. Check your connection and press Done again." });
    } finally { view.closing = false; paintBar(); }
  }

  /* ---------- jumps land below the bar and flash ---------- */
  function reveal(targetId) {
    const node = document.getElementById(targetId); if (!node) return;
    if (node.classList.contains("filtered")) { view.filter = "all"; applyFilter(); paintBar(); }
    if (node.classList.contains("fcard") && !node.classList.contains("open")) setOpen(node, true);
    node.scrollIntoView({ block: node.classList.contains("fcard") ? "center" : "start", behavior: reduced() ? "auto" : "smooth" });
    node.classList.remove("flash"); void node.offsetWidth; node.classList.add("flash");
    if (!node.hasAttribute("tabindex")) node.setAttribute("tabindex", "-1");
    node.focus({ preventScroll: true });
  }

  /* ---------- events ---------- */
  document.addEventListener("click", (e) => {
    if (!e.target.closest("[data-tip]")) hideTip();
    const home = e.target.closest("[data-home]");
    if (home) { e.preventDefault(); history.pushState(null, "", location.pathname + location.search); route(); return; }
    const jump = e.target.closest("[data-jump]");
    if (jump) { e.preventDefault(); hideTip(); reveal(jump.dataset.jump); return; }
    const off = e.target.closest("[data-off]");
    if (off) {
      e.preventDefault(); showTip(off);
      const p = off.dataset.path;
      if (p && navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(p).then(() => toast("That file isn’t in this document — its path is in the tooltip, and now on your clipboard."), () => toast("That source isn’t in this document — read the tooltip."));
      else toast("That source isn’t in this document — read the tooltip.");
      return;
    }
    const seen = e.target.closest("[data-seen]");
    if (seen) { markSeen([seen.dataset.seen]); return; }
    const fl = e.target.closest("[data-filter]");
    if (fl) { view.filter = view.filter === fl.dataset.filter && fl.dataset.filter !== "all" ? "all" : fl.dataset.filter; applyFilter(); paintBar(); return; }
    const act = e.target.closest("[data-act]")?.dataset.act;
    if (!act) {
      const t = e.target.closest(".term[data-tip], .tag[data-tip], .qid[data-tip]");
      if (t) showTip(t);
      return;
    }
    if (act === "done") done();
    else if (act === "retry") { view.retry = 0; flush(); }
    else if (act === "next") { const open = unanswered(); const cur = ordered().findIndex((q) => { const n = document.getElementById("q-" + q.id); return n && n.getBoundingClientRect().top > (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--bar-h")) || 120) + 24; }); const after = ordered().slice(Math.max(0, cur)).map((q) => q.id).find((q) => open.includes(q)) || open[0]; if (after) reveal("q-" + after); }
    else if (act === "expand") setAllOpen(true);
    else if (act === "collapse") setAllOpen(false);
    else if (act === "allseen") markSeen(qsAll().map((q) => q.id));
  });
  window.addEventListener("beforeunload", (e) => { if (Object.keys(view.pending).length || view.inflight) { flush(); e.preventDefault(); e.returnValue = ""; } });

  /* ---------- boot ---------- */
  function route() { const id = formId(); if (id) showForm(id); else showIndex(); }
  window.addEventListener("hashchange", route);
  (async () => {
    const use = window.claude && typeof window.claude.use === "function" ? window.claude.use : null;
    db = use ? await use("db").catch(() => null) : null;
    if (!db) { app.innerHTML = '<div class="card msg"><b>Sign in to claude.ai to see your forms.</b><p>The forms are stored with the artifact, and only a signed-in viewer can read them.</p></div>'; return; }
    try { const user = await use("user"); uid = user && typeof user.id === "function" ? await user.id() : null; } catch { uid = null; }
    route();
  })();
})();
</script>
